.carry{background:var(--panel);border:3px solid var(--edge);box-shadow:3px 3px 0 rgba(63,74,92,.3)}
.carryitem{background:var(--panel2)}
@media (hover:none){
  body.picking .ctxbar{background:linear-gradient(180deg,rgba(233,227,204,.94),var(--bg) 40%);border-top:3px solid var(--edge)}
}
.hintbar{color:var(--muted);font-size:12.5px}

/* ---- battle chrome (the arena itself is untouched) ---- */
.bosstag{color:var(--goldtx)} .bosstag.elite{color:#5a4a9c} .bosstag.champion{color:#a8491f} .bosstag.rival{color:var(--info)}
#blog{font-size:14px;line-height:1.5;color:var(--muted);height:118px}
#blog div:last-child{color:var(--text)}
#blog .eff{color:#a86d00} #blog .ineff{color:#7d8494} #blog .ko{color:var(--bad)} #blog .evo{color:#1f8a4f}
.queue{padding:6px 10px}
.qlbl{color:var(--muted)}
.qmon{background:var(--panel2);border:2px solid var(--line2)}
.qmon.p{border-color:var(--info);background:rgba(42,111,201,.12)}
.qmon.e{border-color:var(--atk);background:rgba(200,68,42,.12)}
.qmon.now{box-shadow:0 0 0 2px var(--gold2)}
.queue.shopq{background:var(--panel2);box-shadow:none;border-width:2px;border-color:var(--line2)}
.speed{background:var(--panel2);border:2px solid var(--edge)}
.sp{color:var(--muted)}
.sp:hover{color:var(--text);background:rgba(63,74,92,.08)}
.sp.on{background:var(--edge);color:var(--panel)}
.steps{color:var(--muted)}
.award{background:#fbf1d6;border:2px solid var(--gold2)}
.award b{color:var(--goldtx)} .award.rivalwin b{color:var(--info)}
.gnote{color:var(--muted)}

/* ---- modals ---- */
.modal{background:rgba(43,47,58,.5);backdrop-filter:none}
.modal .box{border-radius:12px}
.modal h3{font-size:22px;font-weight:600}
.modal h4{color:var(--muted);font-size:13px}
.modal p{color:var(--muted);font-size:14px}
.modal p.legend,.modal textarea{background:#fff;border:2px solid var(--line2);color:var(--text)}
kbd{background:var(--panel2);border-color:var(--line2)}
.clog details{background:var(--panel2);border:2px solid var(--line)}
.clog details.unseen{border-color:#e2433d80}
.clog summary b{color:var(--goldtx)}
.clog li{font-size:13.5px}
.dexjump{background:var(--panel);border-bottom:2px solid var(--edge)}
.dexjump .sp{background:var(--panel2);border:2px solid var(--line2)}
.dexrow,.brow{border-bottom:2px dotted var(--line)}
.rcard{background:var(--panel2);border:2px solid var(--line2);box-shadow:2px 2px 0 rgba(63,74,92,.2)}
.rcard:hover,.rcard:focus-visible{border-color:var(--edge)}
.rtaken{color:var(--goldtx)}
.big.win{color:var(--good)} .big.lose{color:var(--bad)} .big.draw{color:var(--goldtx)}

/* ---- START menu ---- */
.modal.startmenu{align-items:flex-start;justify-content:flex-end;padding:12px;background:rgba(43,47,58,.22)}
.modal.startmenu .box{width:min(290px,78vw);max-width:none;padding:10px 8px 8px 10px;animation:smin .2s steps(4) both}
@keyframes smin{from{transform:translateX(115%)}to{transform:none}}
.smi{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;border-radius:6px;font-family:var(--font);font-size:19px;
  text-align:left;color:var(--text);padding:5px 6px 5px 26px;position:relative;cursor:pointer;letter-spacing:.6px;text-transform:uppercase}
.smi.cur::before{content:'▶';position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:13px}
.smi:focus-visible{outline:none}   /* 2.2.1: arrow only, no tint */
.smi.red{color:#b8302b}
.smi .newdot{margin-left:auto}
.smenu hr{border:0;border-top:2px dotted var(--line2);margin:4px 0}
.sdesc,.yesno{font-size:13.5px;color:var(--muted);border-top:3px solid var(--edge);margin-top:6px;padding:7px 4px 2px;min-height:46px;line-height:1.3}
.yesno{color:var(--text)}
.yesno .btnrow{margin-top:8px}
.yesno .btn{text-transform:uppercase;letter-spacing:1px}
.sver{font-size:11px;color:var(--dim);text-align:right;margin-top:4px}

/* ---- Trainer Card ---- */
.modal.trainer .box{max-width:420px;background:linear-gradient(180deg,#fbf8ec,#f1ead0)}
.tcard .trow{display:flex;gap:12px;align-items:flex-start}
.tcard .facts{flex:1;min-width:0;font-size:17px;line-height:1.6}
.tcard .facts div,.tcard .recs div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px dotted var(--line2)}
.tcard .facts span,.tcard .recs span{color:var(--muted);text-transform:uppercase;font-size:12.5px;letter-spacing:.8px;flex:0 0 auto}
.tcard .facts b,.tcard .recs b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.tcard .tface{width:96px;height:112px;flex:0 0 auto;border:3px solid var(--edge);border-radius:8px;display:flex;align-items:flex-end;
  justify-content:center;overflow:hidden;background:linear-gradient(180deg,#f3f0dc 0 58%,#c7dca8 58%)}
.tcard .tface img{width:86px;height:86px;object-fit:contain;image-rendering:pixelated;margin-bottom:6px}
.tcard .tface .pball{width:50px;height:50px;margin-bottom:26px}
.modal .tcard h4{margin:14px 0 6px;color:var(--text);font-size:15px;letter-spacing:1px}
.bcase{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bcell2{aspect-ratio:1;border:2px solid var(--edge);border-radius:8px;position:relative;overflow:hidden;display:flex;align-items:flex-end;
  justify-content:center;background:repeating-linear-gradient(45deg,#f1ead0 0 4px,#e9e3cc 4px 8px)}
.bcell2.on{background:linear-gradient(180deg,#fbf8ec 0 60%,#e7ecd0 60%)}
.bcell2 .bdg{position:absolute;top:5px;left:5px;width:14px!important;height:14px!important;z-index:2}
.bcell2 .bossart.case{width:80%;height:80%;margin-bottom:12px}
.bcell2 span{position:absolute;left:0;right:0;bottom:0;font-size:10px;text-align:center;background:rgba(251,248,236,.92);
  border-top:2px solid var(--edge);color:var(--text);line-height:1.35}
.tcard .recs{font-size:16px;line-height:1.6}

/* ---- Options ---- */
.optrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:2px dotted var(--line2)}
.optrow > span{text-transform:uppercase;letter-spacing:.8px;font-size:13px;color:var(--muted)}
.optrow input{font-family:var(--font);font-size:17px;width:min(170px,100%);padding:4px 8px;border:3px solid var(--edge);border-radius:8px;
  background:#fff;color:var(--text);-webkit-user-select:text;user-select:text}
.optrow input:focus{outline:2px solid var(--gold);outline-offset:1px}
.optseg .sp{font-size:13px;min-width:0;padding:5px 10px}
.modal p.optnote{text-align:left;margin:10px 0 0;font-size:12.5px;line-height:1.45;color:var(--dim)}

/* ---- small text reads better a little bigger in a pixel font ---- */
.rankhead span,.lbl,.nlabel,.qlbl{font-size:10.5px}
.vtag{color:var(--muted);font-size:12px}
.dexjump .sp,.ntype,.nbadge{font-size:11px}

[hidden]{display:none!important}
.bcell2.on{background:var(--panel)}
.tcol:not(.tright){flex:0 0 auto}
.tcol.tright{min-width:0;flex:1 1 auto}
.tcol.tright .stat{white-space:nowrap}
@media (max-width:430px){
  .stat.badges .pips{gap:3px}
  .stat.badges .bdg{width:12px;height:12px}
  .stat.lives .pball{width:12px;height:12px}
  .tcol.tright .stat{font-size:12px}
  .tcol.tright .stat .lbl{font-size:9.5px}
  .speech{padding:6px 8px 6px 6px;gap:8px}
  .speech .who{width:52px;height:54px}
  .bossart.dockart{width:50px;height:50px}
  .speech .who .pball{width:28px;height:28px;margin-bottom:12px}
  .speech .say b{font-size:15.5px}
  .btn.fight{font-size:17px;padding:7px 8px}
  .dock{gap:6px;padding-top:8px}
}

/* ---- v37: night theme (START → Options → Theme). html.dark is set from the

/* ===================================================================
   v38 — TITLE SCREEN
   =================================================================== */
.title{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
  background:repeating-linear-gradient(0deg,rgba(63,74,92,.05) 0 2px,transparent 2px 6px),var(--bg);color:var(--text);font-family:var(--pix)}
body.titled{overflow:hidden}
.tscreen{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.tlogo{margin:0;display:flex;flex-direction:column;align-items:center;line-height:.86;font-weight:700;letter-spacing:2px}
.tlogo .t1{display:flex;align-items:center;gap:8px;font-size:clamp(24px,7vw,32px);color:#d9463f;
  text-shadow:2px 2px 0 var(--edge)}
.tlogo .t1 .pball{width:.9em;height:.9em}
.tlogo .t2{font-size:clamp(46px,15vw,72px);color:var(--edge);text-shadow:4px 4px 0 var(--gold);margin-top:4px}
.tsub{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.tfield{width:100%;height:clamp(170px,48vw,210px);position:relative;border:3px solid var(--edge);border-radius:10px;box-shadow:var(--gbbox);
  overflow:hidden;background:
   radial-gradient(ellipse 60% 14% at 50% 80%,#b9d9a0 0 70%,#8fbf76 71% 100%,transparent 101%),
   linear-gradient(180deg,#bfe0ee 0 55%,#eef0d6 55% 58%,#cfe2b6 58%)}
.tfield::before,.tfield::after{content:'';position:absolute;top:16%;height:10px;border-radius:6px;background:#fff;opacity:.8;
  box-shadow:10px -6px 0 #fff,22px 0 0 #fff}
.tfield::before{left:12%;width:26px}
.tfield::after{right:18%;top:28%;width:18px}
.tmon{position:absolute;left:50%;bottom:17%;width:clamp(112px,32vw,140px);height:clamp(112px,32vw,140px);transform:translateX(-50%)}
.tmon img{width:100%;height:100%;object-fit:contain;object-position:bottom;image-rendering:pixelated;transform:scaleX(-1);
  filter:drop-shadow(0 3px 0 rgba(63,74,92,.25));animation:tbob 1.6s steps(2) infinite}
.tmon.hop img{animation:thop .45s ease-out}
.twho{font-size:14px;color:var(--muted);min-height:1em}
.tpress{font:inherit;font-size:20px;font-weight:700;letter-spacing:3px;color:var(--edge);background:none;border:0;padding:10px 18px;cursor:pointer;
  animation:gbblink 1.1s steps(1) infinite}
.tpress:focus,.tmi:focus{outline:none}
/* 2.2.1 (Sean): the ▶ arrow is the only selection marker — no dashed focus box beside it */
.tmi:focus-visible{outline:none}
.tmenu{width:min(300px,100%);display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--panel);
  border:3px solid var(--edge);border-radius:10px;box-shadow:var(--gbbox);text-align:left}
.tmenu[hidden],.tpress[hidden]{display:none!important}
.tmi{font:inherit;font-size:18px;font-weight:700;letter-spacing:1.5px;color:var(--text);background:none;border:0;
  padding:6px 6px 6px 26px;text-align:left;cursor:pointer;position:relative;border-radius:6px}
.tmi small{display:block;font-size:12px;font-weight:500;letter-spacing:.3px;color:var(--muted);margin-top:1px}
.tmi.cur::before{content:'▶';position:absolute;left:6px;top:7px;font-size:14px;color:var(--edge)}
.tmi:disabled{opacity:.45;cursor:default}
.tmenu .yesno{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;padding-top:8px;border-top:2px dotted var(--line2);font-size:13px}
.tmenu .yesno span{flex:1 1 100%}
.tmenu .yesno .btn{flex:1;padding:6px 10px}
.tfoot{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim);margin-top:4px}
.tfoot span:first-child:not(:last-child){color:var(--muted)}
@keyframes tbob{50%{transform:scaleX(-1) translateY(-3px)}}
@keyframes thop{0%{transform:scaleX(-1)}40%{transform:scaleX(-1) translateY(-18px)}100%{transform:scaleX(-1)}}
@keyframes tdrop{0%{transform:translateY(-40px);opacity:0}70%{transform:translateY(4px);opacity:1}100%{transform:none}}
@keyframes tslide{0%{transform:translateX(120%)}100%{transform:translateX(-50%)}}
@keyframes tfade{from{opacity:0}to{opacity:1}}
.title .tlogo{animation:tdrop .6s ease-out both}
.title .tsub{animation:tfade .4s .45s both}
.title .tmon{animation:tslide .55s .35s cubic-bezier(.2,.8,.3,1) both}
.title .tpress{animation:tfade .3s .9s both,gbblink 1.1s 1.2s steps(1) infinite}
.title.still,.title.still *{animation:none!important}
.title.still .tpress{animation:none}
html.dark .title{background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 6px),var(--bg)}
html.dark .tlogo .t1{color:#ff6b62;text-shadow:2px 2px 0 #0b0d13}
html.dark .tlogo .t2{text-shadow:4px 4px 0 #8a6412}
html.dark .tfield{background:
   radial-gradient(ellipse 60% 14% at 50% 80%,#3c5a40 0 70%,#2c4430 71% 100%,transparent 101%),
   linear-gradient(180deg,#26334d 0 55%,#2d3a30 55% 58%,#1f2a23 58%)}
html.dark .tfield::before,html.dark .tfield::after{background:#f3eed8;opacity:.25;box-shadow:10px -6px 0 #f3eed8,22px 0 0 #f3eed8}
@media (max-height:620px){ .tfield{height:140px} .tmon{width:100px;height:100px} .tlogo .t2{font-size:44px} .tscreen{gap:8px} }

/* ===================================================================
   v40 — POKéBALL WIPE (rolling iris)
   =================================================================== */
.wipe{position:fixed;left:0;right:0;top:-240px;bottom:-240px;z-index:90;pointer-events:auto;overflow:hidden}
/* 2.2.1: the dark shade is clipped to this box, and on some phones (iOS with the
   toolbar / home-bar area) a plain inset:0 stops short of the screen's bottom edge,
   leaving a pale strip. The box now runs 240px past the top and bottom — equally,
   so the iris still centres on the screen. */
.wiris{position:absolute;left:50%;top:50%;border-radius:50%;box-shadow:0 0 0 300vmax #22262f;transform:translate(-50%,-50%)}
.wiris.flat{inset:0;left:0;top:0;transform:none;border-radius:0;box-shadow:none;background:#22262f}
.wball{position:absolute;left:50%;top:50%;width:clamp(64px,16vw,84px);height:clamp(64px,16vw,84px);transform-origin:50% 50%;
  margin:calc(clamp(64px,16vw,84px) / -2) 0 0 calc(clamp(64px,16vw,84px) / -2)}
.wball svg{display:block;width:100%;height:100%}
.wiris.flat + .wball{display:none}

/* ===================================================================
   v42 — IRON OUT
   =================================================================== */
.queue .qmon.ghost{visibility:hidden}
#blog::before{content:'';position:sticky;top:-2px;display:block;height:22px;margin-bottom:-22px;z-index:1;pointer-events:none;
  background:linear-gradient(var(--panel),rgba(0,0,0,0))}
html:not(.dark) #blog::before{background:linear-gradient(var(--panel),rgba(251,248,236,0))}
html.dark #blog::before{background:linear-gradient(var(--panel),rgba(37,42,55,0))}
.overteam{flex-wrap:wrap;gap:6px}
.overteam .held{bottom:auto;top:-5px;right:-7px}
.shopbar .btn{white-space:nowrap}
.dexrow .tag{display:inline-block;border-radius:5px;padding:0 6px;margin-left:3px;font-size:11px;font-weight:700;line-height:1.55;vertical-align:2px;
  border:1.5px solid rgba(0,0,0,.18)}

/* ===================================================================
   v43 — IRON OUT 2
   =================================================================== */
/* Bold pixel text: Pixelify's heaviest weight closes up the small letters at
   game sizes ("Continue" ran together, C read as O). Only 400–600 are loaded,
   and the browser may not fake a heavier one, so bold lands on 600. */
html{font-synthesis-weight:none;font-synthesis:none}
.btn,.big-cta{letter-spacing:.6px}

/* role chips stay one line */
.rchip{white-space:nowrap;line-height:1.35;vertical-align:1px}
.drow .rchip{font-size:10px;padding:0 5px;margin-left:3px}

/* the party field: empty spots are only the disc; level pips show */
.pfield .slot.empty::before{content:none;display:none}
.pfield .exp{margin-top:10px;gap:3px;justify-content:center}
.pfield .exp i{width:7px;height:7px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1.5px var(--edge);opacity:.55}
.pfield .exp i.on{background:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold2);opacity:1}
html.dark .pfield .exp i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--edge)}
html.dark .pfield .exp i.on{background:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold2)}

/* one summary: the message box */
.isum{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media (min-width:700px){ .isum{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:0 20px} .isum .pcol.b .popmove:first-child{margin-top:0;border-top:0;padding-top:0} }
.isum .popart{width:52px;height:52px}
.isum .popname{font-size:17px}
.isum .line{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:8px 0 2px}
.isum .stage{font-size:12px;color:var(--dim)}
.isum .stage.now{color:var(--text);font-weight:bold;background:var(--panel2);border-radius:5px;padding:0 5px}
.isum .arr{color:var(--dim);font-size:11px}
.isum .mu{font-size:11px;color:var(--dim)}

/* the turn order row stays; at the end it shows who is left */
.queue.over .qmon{opacity:.75}

.isum.reveal{animation:isumroll .55s steps(11,end) both}
@keyframes isumroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
/* scroll bars don't change a list's width */
.dclist,.martlist,#blog,.clog{scrollbar-gutter:stable}

/* ===================================================================
   v45 — TWO FONTS
   Pixelify is a display face: at the sizes of descriptions, names and
   numbers its C read as O and B as G. Everything now reads in Nunito, and the
   pixel font is kept for what should look like a Game Boy: headings, buttons,
   labels, menus, the top bar, the fight's banners. Pixel text sits at 500 —
   heavier weights close the letters up.
   =================================================================== */
:root{ --read:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif; --font:var(--read) }
body{font-family:var(--read)}
button,input,textarea,select{font-family:inherit}
h1,h2,h3,h4,.panel h2,.modal h3,.dexh,.tcard h4,
.btn,.big-cta,.iconbtn,.speed .sp,.optseg .sp,.dexjump .sp,
.smi,.sdesc,.sver,.tmi,.tpress,.tlogo,.tsub,.twho,
.topbar .stat,.topbar .lbl,.stat.vs,
.speech .say b,.popname,.big,.ribbon,.introban b,.rankhead span,.rklbl,.qlbl,.pfield .lvl,
.optrow > span,.yesno span,.carry span,.tfoot,.vtag{font-family:var(--pix)}
h1,h2,h3,h4,.panel h2,.modal h3,.dexh,.tcard h4,.btn,.big-cta,.iconbtn,.speed .sp,.optseg .sp,.dexjump .sp,
.smi,.tmi,.tpress,.topbar .stat,.speech .say b,.popname,.big,.ribbon,.introban b,.rankhead span,.rklbl,.qlbl,.pfield .lvl,.carry span{font-weight:500!important}
.tlogo{font-weight:500}
.btn,.big-cta,.iconbtn{letter-spacing:.8px}
/* the reading face carries the weight now */
.drow b,.mtext b,.popmove b,.poprole b,.popheld b,#inspect b,.dexrow b,.abil b,.recs b,.facts b{font-weight:800}

/* ===================================================================
   v46 — FRAMES THAT DON'T SCROLL, SPRITES WITH ROOM
   The Game Boy frame is an inset shadow, and a box's own content paints over
   its inset shadow — so a scrolling box slid its text across its own border.
   The frame is now an outer box with a few pixels of padding, and only the
   inside scrolls.
   =================================================================== */
.blogbox{background:var(--panel);border:3px solid var(--edge);border-radius:10px;box-shadow:var(--gbbox);padding:5px 3px 5px 5px}
.blogbox #blog{border:0!important;box-shadow:none!important;background:transparent!important;border-radius:4px;padding:2px 6px 2px 7px;height:112px;margin:0}
.modal .box{padding:5px;overflow:hidden;display:flex;flex-direction:column;--boxpad:13px}
.modal .boxscroll{overflow:auto;padding:13px;min-height:0;flex:1 1 auto;border-radius:6px}
.modal.startmenu .box{padding:5px}
.modal.startmenu .boxscroll{padding:5px 3px 3px 5px;overflow:visible}

/* sprites get room inside their frames */
.qmon{width:38px;height:38px}
.qmon img{width:26px;height:26px}
.queue.shopq .qmon{width:32px;height:32px}
.queue.shopq .qmon img{width:21px;height:21px}
.queue.shopq{overflow:hidden}
@media (max-width:480px){ .queue.shopq .qmon:nth-child(n+8){display:none} }
.popart img{width:40px;height:40px}
.isum .popart img{width:38px;height:38px}
.carry img{width:28px;height:28px}
.speech .who img{max-width:84%;max-height:84%;object-fit:contain}
.tcard .tface img{width:74px;height:74px}

/* ===================================================================
   v47 — SMOOTH START MENU
   The menu used to slide in on four hard steps (steps(4)), which reads as
   dropped frames. It now glides on its own compositor layer,
   and the looping animations behind a pop-up pause while it is open so the
   page underneath stops repainting.
   =================================================================== */
.modal.startmenu{animation:none}
.modal.startmenu .box{animation:smin2 .18s cubic-bezier(.2,.8,.3,1) both;will-change:transform,opacity;contain:layout paint;backface-visibility:hidden}
@keyframes smin2{from{transform:translate3d(36px,0,0);opacity:0}to{transform:none;opacity:1}}
body:has(.modal) .btn.big-cta::after,body:has(.modal) .formation .unit .sprite img,
body:has(.modal) #inspect::after,body:has(.modal) .pfield .slot.selected .artwrap{animation-play-state:paused}

/* ===================================================================
   v48 — THE HOME-SCREEN APP
   Room for the notch and the home bar (env() is 0 everywhere else, so the
   artifact and the local file look the same as before). Opened from the home
   screen, iPhones draw the status bar over the page, so a slate strip sits
   behind it, like a Game Boy's bezel.
   =================================================================== */
#app{padding-top:calc(8px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal.startmenu{padding-top:calc(12px + env(safe-area-inset-top,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
html.standalone body::before{content:'';position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:#2b303b;z-index:95;pointer-events:none}
img{-webkit-touch-callout:none;-webkit-user-drag:none}
.ihelp{margin:4px 0 12px;padding-left:22px;line-height:1.6;color:var(--text);font-size:14.5px}
.ihelp li{margin:4px 0}
.ishare{display:inline-block;border:2px solid var(--edge);border-radius:5px;padding:0 5px;font-size:12px;vertical-align:1px}

/* ===================================================================
   v49 — STEADIER ON PHONES
   Messages float at the top instead of replacing the summary (no page jump),
   and the held-item badge on a summary picture is a corner badge again —
   the v46 sprite sizing (.popart img) was catching its icon too.
   =================================================================== */
.toastbox{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));z-index:80;pointer-events:none;
  transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;
  background:var(--panel);border:3px solid var(--edge);border-radius:10px;box-shadow:var(--gbbox);
  padding:8px 14px;font-size:14.5px;line-height:1.35;text-align:center;animation:toastin .16s ease-out both}
.toastbox b{color:var(--text);font-weight:800}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){ .toastbox{animation:none} }
.popart .held.pop{width:20px;height:20px;right:-6px;bottom:-6px;border-radius:6px}
.popart .held.pop img.pix,.isum .popart .held.pop img.pix{width:14px;height:14px;object-fit:contain;image-rendering:pixelated}

/* ===================================================================
   v50 — ITEM RARITY TAGS
   Common has no tag; the colour gets warmer as an item gets rarer.
   =================================================================== */
.rar{display:inline-block;font-style:normal;font-size:8.5px;letter-spacing:.8px;font-weight:800;margin-left:6px;vertical-align:1px;
  padding:1px 5px;border-radius:5px;line-height:1.35;white-space:nowrap}
.rar.r-uncommon{color:#fff;background:#2e8f5a}
.rar.r-rare{color:#fff;background:#3a6fc9}
.rar.r-veryrare{color:#1b1406;background:linear-gradient(135deg,#ffe28a,#f0b43c)}
#inspect .rar{vertical-align:2px}

/* v51: an item that costs a stat shows the cost in red */
.sb b .sbon.neg,html .sb b .sbon.neg{color:var(--bad,#c0392b)}
.stats .xdown,html .stats .xdown{color:#c0392b;text-shadow:none}
html.dark .stats .xdown{color:#ff8e96}

/* v52: a second move a Choice Band has locked out */
.popmove.locked b,.popmove.locked p{text-decoration:line-through;opacity:.55}
.popmove.locked .trig{opacity:.55}
.popmove .lockby{display:block;font-size:10.5px;font-weight:700;color:var(--bad);margin-top:1px}

/* ===================================================================
   v54 — RARITY SPARKLE
   A Rare / Very rare item landing on the shelf gets a glow round its row and
   a shine sweeping across it, after the row has dealt in. The row's own
   animation (the deal) is untouched: the effect lives on ::before / ::after.
   =================================================================== */
.martrow.fx-rare,.martrow.fx-vrare{position:relative;isolation:isolate}
.martrow.fx-rare::before,.martrow.fx-vrare::before{content:'';position:absolute;inset:-2px;border-radius:11px;pointer-events:none;z-index:1;
  animation:rareglow 1.3s ease-out var(--sparkdelay,300ms) both}
.martrow.fx-rare::before{--glow:#3a6fc9}
.martrow.fx-vrare::before{--glow:#f0b43c;animation-duration:1.9s}
.martrow.fx-rare::after,.martrow.fx-vrare::after{content:'';position:absolute;inset:0;border-radius:9px;pointer-events:none;z-index:2;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.75) 46%,rgba(255,255,255,.95) 50%,rgba(255,255,255,.75) 54%,transparent 70%) no-repeat;
  background-size:250% 100%;background-position:130% 0;animation:rareshine .75s ease-in-out var(--sparkdelay,300ms) both}
.martrow.fx-vrare::after{background-image:linear-gradient(105deg,transparent 30%,rgba(255,236,170,.8) 46%,rgba(255,255,255,1) 50%,rgba(255,236,170,.8) 54%,transparent 70%);
  animation:rareshine .75s ease-in-out var(--sparkdelay,300ms) 2 both}
@keyframes rareglow{0%{box-shadow:0 0 0 0 var(--glow)}25%{box-shadow:0 0 0 3px var(--glow),0 0 16px 4px var(--glow)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes rareshine{from{background-position:130% 0}to{background-position:-30% 0}}
@media (prefers-reduced-motion:reduce){ .martrow.fx-rare::after,.martrow.fx-vrare::after{animation:none;opacity:0} .martrow.fx-rare::before,.martrow.fx-vrare::before{animation-duration:.01s} }
body.calm .martrow.fx-rare::after,body.calm .martrow.fx-vrare::after{animation:none;opacity:0}

/* ===================================================================
   1.3.0 — version under the title logo, dates in What's new, transfer codes,
   and Eevee's branching evolution line in the summary
   =================================================================== */
.tver{font-family:var(--pix);font-size:12px;letter-spacing:1px;color:var(--dim);margin-top:2px}
.title .tver{animation:tfade .4s .5s both}
.cdate{font-size:10.5px;color:var(--dim);font-weight:400;margin-left:4px;white-space:nowrap}
.modal.xfer h4{margin:14px 0 4px;font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.modal.xfer textarea{width:100%;min-height:74px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;word-break:break-all;box-sizing:border-box}
.modal.xfer .xmsg{color:var(--bad);font-size:12.5px;min-height:1em;margin:4px 0}
.modal.xfer .xconfirm p{font-size:13px}
.line .stage.branch{white-space:nowrap}
.line .stage.branch img.pix{width:14px;height:14px;vertical-align:-2px}

/* 1.4.1 — What's new: the date and tag are one unbreakable group */
.clog .cmeta{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;vertical-align:1px;margin-left:2px}
.clog .cmeta .cdate{margin-left:0}
.clog .cmeta .cnow,.clog .cmeta .cnew{margin-left:0;white-space:nowrap;line-height:1.5}

/* 1.5.0 — stone preview */
.mtext .mprev{display:block;margin-top:2px;font-size:10.5px;color:var(--text);font-weight:600}
.mtext .mprev b{font-weight:800;display:inline;font-size:inherit}
.mtext .mprev .mp{white-space:nowrap;display:inline-block;margin-right:8px}
.mtext .mprev img.pix,.sprev img.pix{width:18px;height:18px;vertical-align:-4px;image-rendering:pixelated;margin-right:2px}
.sprevs{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.sprev{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12.5px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.sprev .arr{color:var(--dim)}
.sprev .poptype{font-size:10px;padding:0 6px;border-radius:6px;color:#10131a;font-weight:700}
.sprev .rchip{font-size:10px}
.sprev .sdel{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}

/* ===================================================================
   2.0.0 — daily challenge, rules, legendaries, undo, recap, formations
   =================================================================== */
.modebar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 8px;padding:6px 10px;border:2px solid var(--edge);border-radius:10px;
  background:var(--panel);font-size:12.5px;box-shadow:var(--gbbox)}
.modechip{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;background:var(--edge);color:#fff;letter-spacing:.3px}
.btn.undo{align-self:center;font-size:13px;padding:6px 14px;min-height:0;background:var(--panel);border-style:dashed}
.btn.undo .dim{font-size:11px;margin-left:4px}
.panel.legend{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-color:#c98a12;
  background:linear-gradient(135deg,var(--panel) 60%,#f6e3b0);animation:legin .5s ease-out both}
html.dark .panel.legend{background:linear-gradient(135deg,var(--panel) 60%,#4a3a14)}
@keyframes legin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.legart{width:64px;height:64px;flex:0 0 auto;border:2px solid var(--edge);border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--tcol) 35%,transparent),transparent 70%)}
.legart img{width:52px;height:52px;object-fit:contain;image-rendering:pixelated}
.legtext{flex:1;min-width:180px;display:flex;flex-direction:column;gap:3px}
.legtext b{font-size:15px;letter-spacing:.5px}
.legtext .poptype{font-size:10.5px;padding:0 6px;border-radius:6px;color:#10131a;font-weight:700}
.legbtns{display:flex;gap:8px;flex-wrap:wrap}
.panel.recap{margin-top:8px;padding:8px 10px}
.panel.recap summary{cursor:pointer;font-size:13px}
.recap .rhead,.recap .rrow{display:grid;grid-template-columns:minmax(90px,1.3fr) 1fr 1fr 44px 30px;gap:6px;align-items:center}
.recap .rhead{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:6px 0 2px}
.recap .rhead span:nth-child(n+4){text-align:right}
.recap .rrow{font-size:12px;padding:3px 0;border-top:1px dotted var(--line)}
.recap .rrow.down{opacity:.6}
.recap .rname img.pix{width:20px;height:20px;image-rendering:pixelated}
.recap .rname{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-weight:700}
.recap .rbar{position:relative;height:14px;border-radius:4px;background:var(--panel2);overflow:hidden}
.recap .rbar u{position:absolute;left:0;top:0;bottom:0;text-decoration:none}
.recap .rbar.dealt u{background:color-mix(in srgb,var(--atk,#d9534f) 55%,transparent)}
.recap .rbar.taken u{background:color-mix(in srgb,var(--hp,#3a9a5b) 45%,transparent)}
.recap .rbar b{position:relative;font-size:10.5px;padding-left:4px;line-height:14px}
.recap .rnum{text-align:right;font-size:11.5px;color:var(--muted)}
.rtag{font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:.6px;padding:0 4px;border-radius:4px;color:#fff}
.rtag.rt-mvp{background:#c98a12}.rtag.rt-wall{background:#3a6fc9}.rtag.rt-medic{background:#2e8f5a}
.panel.legend{margin-bottom:10px}
.presets{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.preset{border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel2)}
.preset .pmons{display:flex;gap:4px;flex-wrap:wrap;min-height:26px;align-items:center;margin:4px 0}
.preset .pmons img.pix{width:26px;height:26px;image-rendering:pixelated}
.preset .btnrow{margin:4px 0 0}
.modal.newrun .mods{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.modal.newrun .modt{text-align:left;display:flex;flex-direction:column;gap:1px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);cursor:pointer;font:inherit}
.modal.newrun .modt b{font-size:13.5px}
.modal.newrun .modt span{font-size:11.5px;color:var(--muted)}
.modal.newrun .modt.on{border-color:var(--edge);box-shadow:inset 0 0 0 2px var(--gold)}
.modal.newrun .modt.on b::before{content:'✓ ';color:var(--good)}
.modal.newrun .monotypes{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px 4px}
.modal.newrun .ntype{font:inherit;font-size:12px;font-weight:700;padding:3px 10px;border-radius:8px;border:2px solid var(--c);background:transparent;color:var(--text);cursor:pointer}
.modal.newrun .ntype.on{background:var(--c);color:#10131a}
.modal .warn{color:var(--bad);font-size:13px}
.modal.newrun h4,.modal.daily h4{margin:12px 0 4px;font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.modal.daily .drules{border:2px solid var(--line);border-radius:10px;padding:4px 10px;background:var(--panel2)}
.modal.daily .drules p{font-size:13px;margin:4px 0 6px}
.modal.daily .dbtns{flex-wrap:wrap}
.modal .small{font-size:11.5px}
.tmi small{display:block}
/* 2.1.0 — legendaries: a gold star where the level badge goes */
.unit .lvl.leg{background:linear-gradient(135deg,#ffd76a,#e0a526);color:#4a3300;font-size:10px}
.poplv.legend{color:#e0a526;font-weight:700}
/* 2.2.0 — EXP pips on the summary */
.poppips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.poppips i{width:7px;height:7px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1.5px var(--edge);opacity:.55}
.poppips i.on{background:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold2);opacity:1}
.poppips.max{font-size:10px;color:var(--gold2);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.clv.leg{background:linear-gradient(135deg,#ffd76a,#e0a526);color:#4a3300}
/* 2.2.1 (Sean): the dock keeps one shape. On wide screens it was a flex row of
   [Undo][next-fight box][BATTLE], so a visible Undo squeezed the box to a narrow
   column (text wrapping over 5 lines) and stretched BATTLE to match. Undo now has its
   own row above; the box and BATTLE always sit side by side at the same height. The
   box also carried the .nextup top margin, so it sat 10px lower than BATTLE. */
.dock .speech{margin-top:0}
.dock .btn.undo{margin-bottom:0}
@media (min-width:620px){

<!--BUILT-->
<script>
"use strict";
/* ===================================================================
   POKEBATTLER — ENGINE (pure logic, no DOM)      Gen 1 · v3
   ===================================================================
   COMBAT
   - Three stats: HP, ATTACK, SPEED.
   - A round = every living pokémon acts once, fastest first. Turn order
     is recomputed each round, so speed buffs and debuffs matter.
   - Everything targets the enemy's FRONT RANK unless its move says otherwise,
     picking one of the two at random — so a second body up front genuinely
     splits incoming damage. Ranks shift forward as pokémon faint.
   - One signature move per pokémon. No faint/hurt triggers.
   - damage = Attack x move power x type multiplier - flat reduction, min 1.

   PROGRESSION
   - Three copies of a pokémon = level 2, six = level 3.
   - Levelling EVOLVES it if its line evolves by level. Stone lines wait
     for their stone. Pokémon with nowhere left to evolve get a bigger
     flat stat bonus instead, so they are never strictly worse.

   Everything worth tuning lives in TUNING, TYPES, SPECIES, ITEMS and
   BATTLE_ITEMS.
   =================================================================== */

/* ---------------- TUNING ---------------- */
const TUNING = {
  startingLives:    5,

  /* --- the run: eight badges, then the Elite Four and the Champion ---
     The run is a SCHEDULE, not a win counter. `runPlan()` builds it from these
     numbers and every other system asks the plan what this turn is, so the
     whole shape can be re-cut by editing four values. */
  badgesToWin:      8,
  battlesPerBadge:  3,     // trainer battles before each gym
  eliteFourCount:   4,
  // Losing a boss doesn't end the run — it blacks you out, the way it does in
  // the real games. You keep your team and your badges and lose your money.
  blackoutPct:      0.5,   // share of credits lost on a boss defeat
  freeAttempts:     2,     // …after this many tries, a defeat also costs a life
  turnsPerTier:     5,     // the turn floor under the badge tier clock
  /* Boss difficulty is a SHARE OF WHAT THE PLAYER IS WORTH, not a stat
     multiplier. Measured over 250 bot runs, a player's team power grows almost
     perfectly linearly — about 94 a turn — while the themed pools a leader
     draws from range from 362 (Brock's Geodudes) to 2984 (Giovanni's Golems)
     at the same point in the run. Multiplying a pool by a constant therefore
     makes some gyms trivial and others impossible: Lt. Surge beat 75% of bots
     while every gym around him lost 75%. So each boss team is built and then
     scaled to hit a target, and the target is the one dial worth turning. */
  powerCurve:     { base:317, perTurn:103 },   // refit with fitcurve.js after ANY change to expGain*
  /* The global difficulty ramp. Re-derived with ramp.js against a player who
     REROLLS the Mart, because that is the strongest play available and a real
     player will find it. Tuned so that player clears ~34% of runs and one who
     never rerolls clears ~25% — rerolling should be worth something, not worth
     double, which is what it was worth before the Mart shelf was widened. */
  /* Eased ×0.92 when the gauntlet arrived: difficulty moved from the middle of
     the run to its end. Before, 55% of runs died at a gym and never saw the
     Elite Four at all, and the few who arrived found five ordinary turns. Now
     ~72% arrive and the gauntlet is the filter.
     v26 (vitamin cap): the reference player used to pour all its medicine into
     one pokémon, and that concentration was most of its strength — spread out,
     the same medicine cleared 0% against the old prices. Re-priced for a player
     who focuses medicine on its best hitter within the cap, at Sean's "middle"
     difficulty: that player clears ~61%, typical habits 30–42%, very casual ~9%.
     v28 (roles): re-priced after roles, longer fights and new calibs. Reference
     (lines up by role) ~76%; habits 30–50%; casual who taps "Line up by role"
     ~6%; casual who never arranges ~1%. Formation is now a real skill. */
  gymRatio:       [0.355, 0.383, 0.387, 0.413, 0.439, 0.451, 0.471, 0.483],   // v31 ×0.96 (snowball nerf), v32 ×0.97 (second moves), v34 ×0.95 (no step-up: gyms only)
  bossRatio:      { elite:0.89, champion:1.01 },
  /* The gauntlet, by position (Lorelei … Blue), on top of bossRatio. Each member
     is a full boss fight but the player arrives WOUNDED, so five standalone-
     priced bosses in a row with damage carrying is close to unwinnable. Tuned
     with gauntlet-measure.js against a player who stocks a PC bench. */
  /* Shaped, not flat. Lorelei is the one member you meet at full HP, so at a
     flat price she was the biggest wall — and falling at the first door is the
     least interesting place to fail. She now costs you HP rather than stopping
     you; Agatha and Lance grind; the Champion is the single biggest wall.
     Measured falls (400 runs): Lorelei 10% · Bruno 11% · Agatha 24% ·
     Lance 23% · Blue 31%. */
  /* v52: each member brings a Very rare item (Sean), and v53 keeps the v51
     prices on purpose: Sean wants the Elite Four harder, with the reference
     clear rate in the low 70s (was 77–78%). Scale these to move it: against the
     v51 prices, x0.975 gave 78%, x0.995 ~72%, x1.0 70% (with v53's items). */
  gauntletRatio: [0.3818, 0.4331, 0.4102, 0.4057, 0.4837],   // 3.2.0 x1.012 (stat pass, new pools); 3.0.0 x0.991 net (real type chart, re-measured; Brock eased); v51 prices x0.995; 2.2.0 x1.04 (every run now meets a legendary); 2.5.0 x1.01 (starter roles swapped, Jolteon's Thunderbolt); 2.8.0 x0.997 (Tangela); 2.10.0 x1.004 (Lorelei's Ice pool, Koga's Bug pool); 2.11.0 gyms tougher (see their calib)
  /* Between gauntlet fights, a pokémon resting in the PC recovers this share of
     its max HP for each fight it sits out. Fainted pokémon don't recover. */
  benchRest:      0.25,
  // X Attack / X Speed: party-wide, a share of each pokémon's own stat per use
  /* v28: 5% → 3%. Longer fights make every stat edge more decisive (a fight
     is less of a coin flip at the same power gap), so the full package took a
     coin-flip Champion fight up ~40 points at 5%. At 3% it is ~+33. */
  xItems:         { pct: 0.05, perBattle: 2, cost: 2 },   // v50: back to Sean's +5%; v54: 2 uses a battle (Sean)
  bossScaleClamp: [0.45, 3.0],   // never distort a pool beyond this
  bossSize:       { gym:0,    elite:1,    champion:1 },     // extra bodies
  bossHeldFrom:   { gym:2,    elite:0,    champion:0 },     // badge to start holding items
  bossOffTheme:     0.3,   // share of a themed team that is off-theme bodyguards
  /* The rival (v30): three surprise fights a run, in place of a trainer battle
     somewhere inside each window of gyms (0-based badge numbers). Priced like a
     boss, but `ratio` × YOUR team's power (not the reference curve), so he
     stays a step above a trainer and a step below the gym for every player. A loss is an ordinary trainer loss; a win pays
     `winCredits` on top of next turn's income and hands over a held item. */
  /* The snowball items (v31). Exp. Share and Lucky Egg grow a pokémon with no
     ceiling, where medicine stops at the vitamin cap. Measured in v30: the
     reference player bought ~20 Exp. Shares a run, and the game with neither
     item cleared 31% where it cleared 77%. Now:
     - both are RARE: a shop slot rolls one at `rareWeight` the odds of anything else;
     - Exp. Share trains the PARTY only — not the PC, not the trainer bank that
       new buys inherit, and it doesn't trigger Lucky Eggs;
     - a Lucky Egg gives a pokémon at most `eggCap` bonus rounds, like vitamins. */
  rareWeight:   0.25,
  /* Rarity (v50): how often a shop slot, a rival prize or a Gift Item rolls
     each item, relative to a common one. Tier says WHEN an item can appear;
     rarity says HOW OFTEN. The rule: the rarer an item, the stronger it is for
     one slot — rarity is never just an item being hard to find. Exp. Share and
     Lucky Egg keep the 0.25 they were measured at in v31. */
  rarity: {
    common:   { weight: 1,    name: 'Common' },
    uncommon: { weight: 0.6,  name: 'Uncommon' },
    rare:     { weight: 0.25, name: 'Rare' },
    veryrare: { weight: 0.1,  name: 'Very rare' },
  },
  /* Status conditions (v32), Gen 1's five plus a flinch. One at a time, and a
     pokémon suffers each one at most once per battle (flinch excepted) so a
     sleeper can't be locked down. Rounds are the upkeep clock; actions are the
     victim's own turns. */
  status: {
    brn: { name:'Burn',      icon:'🔥', short:'BRN', rounds:4, dotPct:0.03, atkCut:0.25 },   // v33: 6% → 3% a round, plus −25% damage dealt
    psn: { name:'Poison',    icon:'☠️', short:'PSN', rounds:5, dotPct:0.08 },
    par: { name:'Paralysis', icon:'⚡', short:'PAR', rounds:3, slow:1.6 },
    slp: { name:'Sleep',     icon:'💤', short:'SLP', actions:2 },
    cnf: { name:'Confusion', icon:'💫', short:'CNF', actions:3, selfHit:0.35, selfPower:0.5 },
    fln: { name:'Flinch',    icon:'😵', short:'FLN', actions:1, repeat:true },
  },
  eggCap:       10,
  rival: {
    windows:    [[0, 1], [3, 4], [6, 7]],
    size:       [3, 5, 6],
    ratio:      [0.75, 0.88, 0.84],   // × your own team: ref wins ~81/89/94%, casual ~75/75/56%
    winCredits: [4, 6, 8],
  },
  // Badges, not turns, unlock the Daycare roster — a 37-turn run would
  // otherwise have the full roster available by turn 11 and nothing new after.
  tierForBadge:   [1, 2, 2, 3, 4, 4, 5, 6, 6],
  maxTeam:          6,     // a full pokémon party
  // The battle formation: three ranks, two pokémon abreast. Party slots fill
  // it front-rank first, so 1-2 are Front, 3-4 Middle, 5-6 Back. Ranks are
  // recomputed from the LIVING line, so when a front pokémon faints the one
  // behind steps up.
  rankWidth:        2,
  rankNames: ['Front', 'Middle', 'Back'],
  // The PC: storage for pokémon you own but aren't carrying. It exists so you
  // can bank spare copies toward a level up without clogging your party or
  // tying up a Daycare slot.
  pcSlots:          8,     // two rows to start; the Storage badge reward adds more
  pcExpFraction:    0.5,   // benched pokémon train at half rate
  // The Bag: held items you own but nobody is carrying. It sits under the PC
  // box because it is the same idea — storage for things not currently in play.
  bagSlots:         4,
  /* --- badge rewards: every badge offers a choice of three ---
     Each entry is how much one pick is worth; `max` is how many times it can be
     taken in one run. Offers are drawn from the run's seed, so they are the same
     for the same run and can be measured. See BADGE_REWARDS.
     Measured one at a time with reward-measure.js: +2₽ a turn was worth more
     than everything else put together, so it is +1₽; a wider medicine shelf
     measured as a slight LOSS (more medicine, fewer pokémon), so it was cut
     rather than offered as a trap. */
  badgeRewards: {
    offer: 3,
    pcRow:     { amount: 4,  max: 2 },   // +4 PC slots
    pocket:    { amount: 1,  max: 3 },   // +1 Bag slot
    allowance: { amount: 1,  max: 3 },   // +1₽ at the start of every turn
    freeRoll:  { amount: 1,  max: 2 },   // free rerolls each turn (either shop)
    piggy:     { amount: 10, max: 2 },   // +10₽ carry-over cap
    training:  { amount: 4,  max: 3 },   // rounds of battle EXP, right now
    gift:      { amount: 1,  max: 3 },   // a held item, straight into the Bag
  },
  /* Vitamins (Protein, HP Up, Carbos) per pokémon, each — the real games' rule.
     Without it a player could pour sixty Proteins and thirty Carbos into one
     Raichu (751 Attack, 485 Speed, found in playtesting v25): damage grows with
     Attack × Speed on the same pokémon, and × every enemy for a spread move, so
     one stacked carry was worth far more than the same medicine spread out,
     and far more than the boss pricing (which adds stats up) could see. */
  vitaminCap:       10,
  martSlots:  [2, 3, 3, 4, 4, 5],   // medicine & stone slots by tier — see martSlotsFor
  heldFromTier:     2,     // the Mart starts stocking held items at this tier
  heldSlotsMax:     3,     // …and never more than this many at once

  /* --- economy --- */
  creditsPerTurn:   10,    // base income each turn
  /* 2.0.0 — run modifiers. Rich & Ruthless: income is doubled and every
     opponent's stats are multiplied by `richFoes`. */
  /* Mono-type scales opponents per type, measured so each type clears ~50% for
     the reference player (as Rich does): a Normal team has no offence and one weakness to
     exploit, a Water or Fire team meets gyms that wall it. */
  mods: { richIncome: 2, richFoes: 1.291, nopcFoes: 1.004, onelifeFoes: 1.019,     // 3.0.0: re-measured for the real type chart
          monoFoes: { Normal:1.041, Fire:0.914, Water:0.888, Electric:0.944, Grass:0.754, Bug:0.902, Fighting:0.955, Flying:1.045, Poison:0.92, Ground:1.024 } },   // 3.8.0: re-measured for the bigger roster; Flying, Poison and Ground join
  // 3.6.0: re-measured after the curated bodyguards (3.5.0: counter moves (3.4.0: the gym pass (3.3.0: tank identities and evolved Elite Four (3.2.0: stat pass and new boss pools) (only types with 3+ lines get a Mono run)
  /* 2.0.0 — legendary encounters. Zapdos and Mewtwo are no longer sold in the
     Daycare; after each gym from `fromBadge` on, one may appear for a turn. */
  legend: { fromBadge: 5, chance: 0.17, cost: 12, growth: 1.2, pityBadge: 7 },   // 2.2.0: a run that hasn't met one by the 7th gym always does
  maxCarryOver:     15,    // unspent credits kept into the next turn (cap)
  winBonus:         2,     // extra for winning the last battle
  lossBonus:        1,     // extra for losing it (keeps a comeback alive)
  // index = streak length, clamped to the last entry
  winStreakBonus:  [0, 0, 1, 2, 3, 4],
  lossStreakBonus: [0, 0, 1, 1, 2, 2],
  costBuy:          3,     // a pokémon from the Daycare
  costRoll:         1,     // reroll either shop
  sellRefundPerLevel: 1,
  itemResale:       0.5,   // share of an item's price the Mart buys it back for

  /* --- levelling --- */
  expForLevel2:     2,     // extra copies needed (3 total)
  expForLevel3:     5,     // extra copies needed (6 total)
  mergeBonus:      { hp:2, atk:3, spd:1 },   // per combine
  levelUpBonus:    { hp:4, atk:3, spd:3 },   // on levelling INTO an evolution
  levelUpBonusMax: { hp:9, atk:9, spd:6 },   // on levelling with nowhere to evolve
  movePowerPerLevel: 0.25,

  /* --- EXP from battling: the player's stat curve --- */
  /* Who the battle EXP belongs to.
     'unit'    — each pokémon banks its own, as it always has. A veteran carried
                 from turn 1 ends the run 4.4× the power of the same species
                 bought on turn 40, which is why a party locks at turn 3 and the
                 Daycare, the PC and the scouting report all go dead behind it.
     'trainer' — the TRAINER banks it, and anything you acquire is topped up to
                 that level on arrival. A fresh buy is competitive immediately,
                 so swapping and counter-drafting stay live all run. */
  aiDifficulty: 0.78,     // the AI's stat growth per turn; must move WITH the player's
  expModel:    'trainer',
  /* Cut from 3/3/2. Battle EXP was 41% of all the power gained in a run and it
     was unconditional — you got it for turning up — which left the shops with
     little to decide. At 2/2/1 purchased power rises from 66% to 74% of the
     total. Any change here needs powerCurve refitted and aiDifficulty moved
     with it, or bosses and trainers are priced for a player who no longer
     exists; expmodel2.js does both. */
  expGainWin:  { hp:2, atk:2, spd:1 },
  expGainLoss: { hp:1, atk:0, spd:0 },

  /* --- combat --- */
  // Moves that grant HP or damage reduction instead of dealing damage are
  // capped PER BATTLE, or two walls stare at each other forever. The cap is
  // measured against the pokémon's own HP at the start of the fight, so items
  // and EXP raise it too — this limits the MOVE, not the pokémon.
  moveGuardCap: {
    hpPct:          1.0,   // a move may add at most this much of starting HP
    reducePerLevel: 3,     // and at most this much flat damage reduction, per level (4 before v28's longer fights)
  },
  /* Speed buys extra actions. `scale` turns a speed ratio into banked surplus,
     `gainCap` stops one absurd matchup snowballing, `extraCap` is the most
     extra actions a single unit can take in one round. */
  /* The action meter. A pokémon's next action lands `atbQuantum / speed` later,
     so speed IS the rate at which you act — there are no rounds to be capped
     by. A "round" survives only as a unit of TIME (how long an average-speed
     pokémon takes to act once), which is what item upkeep and the battle
     length cap are measured in. */
  atbQuantum:       1000,
  maxBattleActions: 500,   // hard stop, whatever the speeds
  /* What a point of speed is worth next to a point of HP or Attack, measured
     with statvalue.js. Under the action meter speed edged ahead (1.42 against
     1.17 and 1.18), so the power score weights it up to match. Re-measure and
     update this together — it is the number that keeps the score honest. */
  spdPower:         1.2,
  /* Attack points per point of damage at 100% power. Attack was rescaled ×2 so
     it has the resolution to matter late; halving this kept every hit landing
     for exactly what it did before (1/3).
     v28: cut to 0.2 so fights last ~1.7× longer. At 1/3 a late fight was over in
     about three rounds — whoever struck first won, HP was a weak stat, a heal
     never had time to matter and a Tank was just a slower Bruiser. Roles only
     mean something if a fight lasts long enough to hold a line. Flat damage
     reduction (guard moves, Metal Coat) was scaled down with it. */
  atkPerDamage: 0.2,
  weakMult:         2,
  resistMult:       0.5,
  maxBattleRounds:  40,

  /* --- roles (v28) ---
     Every pokémon has one of four roles. The role decides how its stats GROW
     (battle EXP, the trainer catch-up, level-ups and merges are all split by
     these weights; medicine stays flat) and gives it one trait in battle.
     Growth is what shapes a pokémon late — base stats are only 5–20% of a
     late-game pokémon — so without this a Blastoise and a Mewtwo converged on
     the same even spread. Each weight set sums to 3, so no role grows more
     than another in total, only differently. */
  roles: {
    tank:    { grow:{ hp:1.8, atk:0.6, spd:0.6 } },               // Bodyguard
    bruiser: { grow:{ hp:1.0, atk:1.0, spd:1.0 }, superTaken:1.5, dmgTaken:0.9 },// Steady
    cannon:  { grow:{ hp:0.6, atk:1.5, spd:0.9 }, backBoost:0.25 },// Covering Fire (behind a Tank/Bruiser)
    support: { grow:{ hp:1.2, atk:0.6, spd:1.2 }, careRound:0.10 },// Aftercare
  },
  rallyMax: 3,
  /* Stat drops (Speed and Attack cuts from moves) stack, but never below this
     share of what the pokémon started the battle with. Longer fights (v28) let a
     team of Supports stack Stun Spore and Sing until the other side barely moved. */
  dropFloor: 0.7,
  /* A move that hits every enemy lands at this share behind the front rank (v28).
     With Tanks holding the front, reaching the back line is the most valuable
     thing a move can do — Thunderbolt at full power was the strongest move in the
     game before roles and the only way past a Tank after them. */
  spreadBack: 0.5,             // a Rally move stacks at most this many times per ally
};

// Which tier is unlocked on a given turn (1..6)
const tierForTurn = t => Math.max(1, Math.min(6, Math.floor((t + 1) / 2)));

/* ===================================================================
   THE RUN — a schedule of battles, not a win counter
   Three trainer battles, then a gym, eight times over, then the Elite Four
   and the Champion. `G.stage` indexes this; it only advances when you clear
   the entry, so a lost gym is fought again.
   =================================================================== */
function runPlan(){
  const plan = [];
  for(let b = 0; b < TUNING.badgesToWin; b++){
    for(let i = 0; i < TUNING.battlesPerBadge; i++) plan.push({ kind:'trainer', badge:b });
    plan.push({ kind:'gym', badge:b, boss:GYMS[b % GYMS.length] });
  }
  for(let i = 0; i < TUNING.eliteFourCount; i++)
    plan.push({ kind:'elite', boss:ELITE_FOUR[i % ELITE_FOUR.length] });
  plan.push({ kind:'champion', boss:CHAMPION });
  return plan;
}
const RUN_LENGTH = () =>
  TUNING.badgesToWin * (TUNING.battlesPerBadge + 1) + TUNING.eliteFourCount + 1;

/** What this turn is. Past the end means the run is already won. */
function stageOf(G){
  const plan = runPlan();
  return plan[Math.min(G.stage || 0, plan.length - 1)];
}
const isBoss = st => !!st && st.kind !== 'trainer';

/* ===================================================================
   THE ELITE FOUR GAUNTLET
   The last five stages — the Elite Four, then the Champion — are one
   continuous challenge rather than five ordinary turns:
   - damage CARRIES between fights, and a fainted pokémon sits out the rest;
   - between fights the shops are CLOSED, but you can rearrange, swap fresh
     pokémon in from the PC and move held items — the PC is your bench;
   - lose any of them and you black out back to Lorelei, fully healed, and the
     whole gauntlet counts as ONE boss attempt for lives.
   `G.gauntlet` exists only while you are mid-way through: once at least one
   member has fallen and before you win or black out.
   =================================================================== */
const gauntletStart = () => TUNING.badgesToWin * (TUNING.battlesPerBadge + 1);
const isGauntletStage = st => !!st && (st.kind === 'elite' || st.kind === 'champion');
const inGauntlet = G => !!(G && G.gauntlet);
/** What share of its max HP a pokémon has left. Stored as a SHARE, not a number,
    so moving an HP item on or off scales the current HP with the max instead of
    fainting or healing it. Anything never tracked is at full. */
function hpFracOf(G, u){
  if(!inGauntlet(G) || !u) return 1;
  const f = G.gauntlet.hpFrac[u.uid];
  return f == null ? 1 : f;
}
const canFight = (G, u) => hpFracOf(G, u) > 0;
const fightersOf = G => (G.team || []).filter(u => canFight(G, u));
/** The one way to fight the current stage — wounds, benched fainters and all.
    Every caller (the UI and the balance bots) goes through here, so the game
    and the tuning can never be measuring two different gauntlets. */
function stageBattle(G, opp, seed){
  fixSlots(G);
  return simulateBattle(fightersOf(G), opp.team,
    seed != null ? seed : G.seed + G.turn * 977 + (G.stage || 0) * 131,
    { hpFrac: inGauntlet(G) ? G.gauntlet.hpFrac : null });
}
/** After a gauntlet fight, write down what everyone who fought has left. */
function recordWounds(G, sim){
  if(!sim || !sim.steps || !sim.steps.length) return;
  const fought = sim.steps[0].p.map(c => c.uid);
  const left = {};
  for(const c of sim.steps[sim.steps.length - 1].p) left[c.uid] = c.hp;
  const owned = ownedUnits(G);
  for(const uid of fought){
    const u = owned.find(x => x.uid === uid);
    if(!u) continue;
    // a move like Harden can lift HP past max inside a fight; it doesn't come home
    G.gauntlet.hpFrac[uid] = left[uid] == null ? 0 : Math.max(0, Math.min(1, left[uid] / effHp(u)));
  }
}

/* Badges unlock the shop — but turns do too, and that matters more than it
   looks. If badges were the only clock, a player stuck on a gym would be stuck
   with the roster that lost them the gym, and the whole retry mechanic would be
   pointless. The turn floor is what lets a blacked-out trainer out-grow a wall. */
const tierFor = G => Math.max(
  TUNING.tierForBadge[Math.min(G.badges || 0, TUNING.tierForBadge.length - 1)],
  Math.min(6, 1 + Math.floor((G.turn || 1) / TUNING.turnsPerTier)));

  blurb:'He turns up three times a run, always when you least expect it. His starter beats yours, and his team grows every time you meet.' };

const bossById = id => ALL_BOSSES.find(b => b.id === id) || null;
/** The species a themed leader can draw on. No theme = the whole roster. */
function themePool(themeOrBoss){
  /* 2.10.0: takes a leader too. `also` adds named species that the typing alone
     misses (Seel and Shellder for Lorelei's Ice), `exclude` drops a Gen 1 type
     so two leaders don't share a bench (Koga leaves the Ghosts to Agatha). */
  const boss = themeOrBoss && !Array.isArray(themeOrBoss) ? themeOrBoss : null;
  const theme = boss ? boss.theme : themeOrBoss;
  const all = Object.keys(SPECIES).filter(k => !SPECIES[k].legendary);   // 2.1.0: no trainer fields a legendary
  if(!theme) return all;
  const types = k => (SPECIES[k].gen1 || '').split('/');
  return all.filter(k => {
    if(boss && boss.exclude && boss.exclude.some(t => t === k || types(k).includes(t))) return false;   // 3.2.0: an entry can also be a species id
    return theme.some(t => types(k).includes(t)) || !!(boss && boss.also && boss.also.includes(k));
  });
}
/* Slot counts. These run off the same effective tier as the roster, not off
   badges alone — a player stuck on a gym was getting tier-5 pokémon in the
   Daycare and no held-item shelf to equip them from. One clock, everywhere. */
const daycareSlotsFor = tier => (tier < 2 ? 4 : tier < 4 ? 5 : 6);
/* Medicine & stones, by tier. This is a TABLE rather than a formula because it
   is the real throttle on how fast a player can grow: measured over 250 runs, a
   fixed 3-slot shelf absorbed only ~11₽ of a ~30₽ turn from turn 8 on, and the
   surplus either evaporated over the carry cap or went into rerolling — which
   was a 1₽ bypass around this very limit and doubled the clear rate. Widening
   the shelf gives the income somewhere honest to go. Sweep it with econ7.js. */
const martSlotsFor = tier =>
  TUNING.martSlots[Math.max(0, Math.min(TUNING.martSlots.length - 1, tier - 1))];
/* Held items are EXTRA shelf, not a share of it. Taking a consumable slot away
   to make room for them measurably weakened the player — medicine stacks every
   turn, so losing a slot of it costs compounding stats. The Mart grows instead. */
function heldSlotsFor(tier){
  if(tier < TUNING.heldFromTier) return 0;
  return Math.min(TUNING.heldSlotsMax, 1 + Math.floor((tier - TUNING.heldFromTier) / 2));
}

/* ===================================================================
   TYPES — the real Gen 1 types (3.0.0, Sean), one type per pokémon.
   A pokémon's type is its MAIN type (its `gen1` string keeps the full Gen 1
   typing, which leaders still theme on). The one exception is Normal/Flying,
   which counts as Flying. Fourteen types have members; Poison has no main-type
   member, so it is left out.

   The matchups are the standard chart without Dark, Steel and Fairy. Where the
   games give ×0 (Ghost vs Normal, Ground vs Flying, Electric vs Ground, and
   Normal / Fighting vs Ghost) the game uses a resist (×½), so no attack ever
   does nothing. Each type can be weak to and resist several types; the two
   lists are derived from this one table so they can never disagree.
   =================================================================== */
const TYPE_CHART = {
  //          strong against                        not very effective against
  Normal:   { strong:[],                               notVery:['Rock','Ghost'] },
  Fire:     { strong:['Grass','Ice','Bug'],            notVery:['Fire','Water','Rock','Dragon'] },
  Water:    { strong:['Fire','Ground','Rock'],         notVery:['Water','Grass','Dragon'] },
  Electric: { strong:['Water','Flying'],               notVery:['Electric','Grass','Dragon','Ground'] },
  Grass:    { strong:['Water','Ground','Rock'],        notVery:['Fire','Grass','Poison','Flying','Bug','Dragon'] },
  Ice:      { strong:['Grass','Ground','Flying','Dragon'], notVery:['Fire','Water','Ice'] },
  Fighting: { strong:['Normal','Ice','Rock'],          notVery:['Flying','Poison','Psychic','Bug','Ghost'] },
  Ground:   { strong:['Fire','Electric','Poison','Rock'], notVery:['Grass','Bug','Flying'] },
  Flying:   { strong:['Grass','Fighting','Bug'],       notVery:['Electric','Rock'] },
  Poison:   { strong:['Grass'],                        notVery:['Poison','Ground','Rock','Ghost'] },   // 3.1.0
  Psychic:  { strong:['Fighting','Poison'],            notVery:['Psychic'] },
  Bug:      { strong:['Grass','Psychic'],              notVery:['Fire','Fighting','Poison','Flying','Ghost'] },
  Rock:     { strong:['Fire','Ice','Flying','Bug'],    notVery:['Fighting','Ground'] },
  Ghost:    { strong:['Psychic','Ghost'],              notVery:['Normal'] },
  Dragon:   { strong:['Dragon'],                       notVery:[] },
};
const TYPE_COLORS = { Normal:'#a9a79b', Fire:'#f2622e', Water:'#3d8bf0', Electric:'#e8c020', Grass:'#57b85f', Ice:'#7fd0e0',
  Fighting:'#c1452f', Ground:'#d8b460', Flying:'#8fa3f0', Psychic:'#b04fc4', Poison:'#d05fae', Bug:'#a2c034', Rock:'#b8a038', Ghost:'#6a5a9a', Dragon:'#7050e8' };
/** { color, weak:[types that deal ×2 to it], resist:[types it takes ×½ from] } for each type. */
const TYPES = {};
for(const d of Object.keys(TYPE_CHART)){
  TYPES[d] = { color: TYPE_COLORS[d],
    weak:   Object.keys(TYPE_CHART).filter(a => TYPE_CHART[a].strong.includes(d)),
    resist: Object.keys(TYPE_CHART).filter(a => TYPE_CHART[a].notVery.includes(d)) };
}
/** The single type a pokémon gets from its Gen 1 typing: the first type, or Flying for Normal/Flying. */
const singleTypeOf = gen1 => {
  const g = String(gen1 || '').split('/');
  return g.includes('Normal') && g.includes('Flying') ? 'Flying' : g[0];
};
/** Kept for the tests: the type a pokémon should have from its Gen 1 typing. */
const tcgTypeFor = id => { const sp = SPECIES[id]; return sp && sp.gen1 ? singleTypeOf(sp.gen1) : null; };

function typeMult(atkType, defType){
  const d = TYPES[defType];
  if(!d) return 1;
  if(d.weak.includes(atkType))   return TUNING.weakMult;
  if(d.resist.includes(atkType)) return TUNING.resistMult;
  return 1;
}

/* ---- roles ----
   Display data for the four roles. Numbers live in TUNING.roles. */
const ROLES = {
  tank:    { name:'Tank',    icon:'🛡️', trait:'Bodyguard',
             text:() => 'Soaks hits. Grows mostly HP. Bodyguard: an attack aimed at its front rank always lands on it.' },
  bruiser: { name:'Bruiser', icon:'👊', trait:'Steady',
             text:() => `Even all-rounder. Grows evenly. Steady: takes ${Math.round((1 - TUNING.roles.bruiser.dmgTaken)*100)}% less from every hit, and super-effective hits deal ×${TUNING.roles.bruiser.superTaken} to it, not ×${TUNING.weakMult}.` },
  cannon:  { name:'Cannon',  icon:'💥', trait:'Covering Fire',
             text:() => `Glass cannon. Grows mostly Attack. Covering Fire: +${Math.round(TUNING.roles.cannon.backBoost*100)}% damage while it stands behind your front rank and a Tank or Bruiser holds it.` },
  support: { name:'Support', icon:'✚', trait:'Aftercare',
             text:() => `Keeps the team going. Grows HP and Speed. Aftercare: every round it heals its most-hurt teammate ${Math.round(TUNING.roles.support.careRound*100)}% of that pokémon's HP.` },
};
const ROLE_ORDER = { tank:0, bruiser:1, support:2, cannon:3 };
/** A pokémon's role, from its species (so it changes if it evolves into another). */
const roleOf = x => {
  const id = typeof x === 'string' ? x : x && x.id;
  return (SPECIES[id] && SPECIES[id].role) || 'bruiser';
};
/* Add stat growth to a pokémon, split by its role. `d` is the even amount
   ({hp,atk,spd}) the old flat rules gave; each stat is multiplied by the role's
   weight. Fractions are banked on the unit (u.gf) rather than rounded away, so
   a Tank's 0.6 × 1 Speed is a point every few battles, not never. */
function growUnit(u, d){
  const w = (TUNING.roles[roleOf(u)] || TUNING.roles.bruiser).grow;
  const lg = SPECIES[u.id] && SPECIES[u.id].legendary ? TUNING.legend.growth : 1;   // 2.1.0
  u.gf = u.gf || { hp:0, atk:0, spd:0 };
  for(const k of ['hp','atk','spd']){
    const x = (d[k] || 0) * w[k] * lg + (u.gf[k] || 0);
    const n = Math.floor(x + 1e-9);
    u[k] += n; u.gf[k] = x - n;
  }
  return u;
}
/** The order a sensible trainer lines up in: tanks, bruisers, supports, cannons.
    Stable within a role, so a player's own order among equals is kept. */
/** Line a party up by role, filling the formation front-first (the button). */
function lineUpByRole(G){
  const order = formationSort(G.team);
  order.forEach((u, i) => { u.pos = i; });
  G.team.splice(0, G.team.length, ...order);
  return G;
}
function formationSort(team){
  return team.map((u, i) => ({ u, i }))
    .sort((a, b) => ROLE_ORDER[roleOf(a.u)] - ROLE_ORDER[roleOf(b.u)] || a.i - b.i)
    .map(x => x.u);
}

/* ---- scaling + display helpers ---- */
const pw  = (base, l) => base * (1 + TUNING.movePowerPerLevel * ((l || 1) - 1));
const pct = (base, l) => Math.round(pw(base, l) * 100) + '%';
const sc  = (base, l) => Math.round(base * (1 + 0.5 * ((l || 1) - 1)));
/* A share (0.08 = 8%) that grows with level like sc(), and its label. */
const sf  = (f, l) => f * (1 + 0.5 * ((l || 1) - 1));
const sfp = (f, l) => Math.round(sf(f, l) * 100) + '%';

/* ===================================================================
   MOVE FACTORIES
   Every move in the game is one of these shapes. To rebalance a pokémon
   change the numbers in its SPECIES line; to invent a new KIND of move,
   add a factory here.
   =================================================================== */
const M = {
  /* plain damage to the enemy front */
  hit: (name, p) => ({ name, text:l=>`Deals ${pct(p,l)} damage.`,
    fn:(u,B,l)=>{ const t=B.front(u); if(t) B.hit(u,t,pw(p,l)); } }),
