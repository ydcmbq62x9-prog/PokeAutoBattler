  { id:'allowance', name:'Allowance',    icon:'💰',
    text: () => `+${rewardCfg('allowance').amount}₽ at the start of every turn.`,
    now: G => perk(G, 'allowance') ? `+${perk(G, 'allowance')}₽ → +${perk(G, 'allowance') + rewardCfg('allowance').amount}₽ a turn` : '',
    apply: G => {} },
  { id:'freeRoll',  name:'Lucky Ticket', icon:'🎟️',
    text: () => `${rewardCfg('freeRoll').amount} free reroll every turn, in either shop.`,
    apply: G => { G.freeRolls = (G.freeRolls || 0) + rewardCfg('freeRoll').amount; } },
  { id:'piggy',     name:'Piggy Bank',   icon:'🐷',
    text: () => `Carry over up to ${rewardCfg('piggy').amount}₽ more between turns.`,
    now: G => `carry-over ${carryCap(G)}₽ → ${carryCap(G) + rewardCfg('piggy').amount}₽`,
    apply: G => {} },
  { id:'training',  name:'Special Training', icon:'🏋️',
    text: () => `${rewardCfg('training').amount} rounds of battle EXP right now — your party, and everything you buy after.`,
    apply: G => { for(let n = 0; n < rewardCfg('training').amount; n++) grantBattleExp(G, 'win', true); } },
  { id:'gift',      name:'Gift Item',    icon:'🎁',
    text: () => 'A random held item from the current shop tier, straight into your Bag.',
    ok: G => bagRoom(G) > 0 && heldPool(G).length > 0,
    apply: (G, rnd) => { const pool = heldPool(G);
      const id = pickWeighted(pool, HELD_ITEMS, rnd ? rnd() : 0);
      G.bag.push(id); G.lastGift = id; } },
];
const rewardById = id => BADGE_REWARDS.find(r => r.id === id) || null;
const heldPool = G => Object.keys(HELD_ITEMS).filter(k =>
  HELD_ITEMS[k].tier <= Math.max(TUNING.heldFromTier, tierFor(G)));
const rewardAvailable = (G, r) => timesTaken(G, r.id) < rewardCfg(r.id).max && (!r.ok || r.ok(G));

/** The three rewards on offer for a badge. Drawn from the run's seed and the
    badge number, so the offer is fixed — reloading can't re-roll it. */
function rewardOffer(G, badge){
  const rnd = makeRng(mix32((G.seed || 1) ^ 0x5bd1e995, 1000 + badge));
  const pool = BADGE_REWARDS.filter(r => rewardAvailable(G, r));
  const out = [];
  while(out.length < TUNING.badgeRewards.offer && pool.length)
    out.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0].id);
  return out;
}
/** What the player is being asked to choose right now, if anything. */
function pendingOffer(G){
  const q = G.pendingRewards || [];
  if(!q.length) return null;
  return { badge: q[0], options: rewardOffer(G, q[0]) };
}
/** Take reward `id` for the badge at the front of the queue. */
function chooseReward(G, id){
  const off = pendingOffer(G);
  if(!off) return { ok:false, why:'No badge reward waiting.' };
  if(!off.options.includes(id)) return { ok:false, why:'That reward is not on offer.' };
  const r = rewardById(id), cfg = rewardCfg(id);
  G.perks = G.perks || {};
  G.perks[id] = (G.perks[id] || 0) + cfg.amount;
  r.apply(G, makeRng(mix32((G.seed || 1) ^ 0x68e31da4, 2000 + off.badge)));
  G.pendingRewards.shift();
  (G.rewardLog = G.rewardLog || []).push({ badge: off.badge, id });
  makeGameApi(G).log(`${GYMS[off.badge % GYMS.length].badge} Badge reward: ${r.name}.`);
  return { ok:true, id, gift: id === 'gift' ? G.lastGift : null };
}

/* ---------------- the two shops ---------------- */
/* Shop rolls come from the RUN'S OWN SEED, not Math.random(). Every roll takes
   the next number in a sequence the save remembers (`G.shopRolls`), so the same
   seed and the same choices always produce the same shelves. Two reasons:
   - balance sweeps compare like with like. Unseeded, the exact same measurement
     run five times cleared anywhere from 36% to 44% — wider than most of the
     changes it was being used to judge;
   - a run can be replayed, and friends can play the same run.
   Reloading doesn't re-roll anything: the counter is saved after every action,
   so the next roll after a reload is the one you would have had anyway. */
function mix32(a, b){
  let h = (Math.imul((a >>> 0) ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul((b >>> 0) + 0x632be5ab, 0xc2b2ae35)) >>> 0;
  h ^= h >>> 16; h = Math.imul(h, 0x7feb352d) >>> 0;
  h ^= h >>> 15; h = Math.imul(h, 0x846ca68b) >>> 0;
  h ^= h >>> 16;
  return h >>> 0 || 1;
}
function shopRng(G){
  G.shopRolls = (G.shopRolls || 0) + 1;
  return makeRng(mix32(G.seed || 1, G.shopRolls));
}

/** Pay for a reroll: a free one from the badge reward first, then credits. */
function payReroll(G){
  if((G.freeRolls || 0) > 0){ G.freeRolls--; G.rolls++; return true; }
  if(G.credits < TUNING.costRoll) return false;
  G.credits -= TUNING.costRoll; G.rolls++;
  return true;
}
const rerollCost = G => (G.freeRolls || 0) > 0 ? 0 : TUNING.costRoll;

function rollDaycare(G, payCost){
  if(payCost && inGauntlet(G)) return false;
  if(payCost && !payReroll(G)) return false;
  const rnd = shopRng(G);
  /* The roster follows the BADGE clock (with its slow turn floor), as the
     TUNING comment always said it did. Until v25 this read tierForTurn, which
     opened the whole roster — Mewtwo included — by turn 11 whatever your badges. */
  const maxTier = tierFor(G);
  // 2.0.0: legendaries only come as encounters; Mono-type sells one type
  const mono = G.mods && G.mods.mono;
  // (one tier ahead for Mono-type, or tier 1 would offer a single line)
  let pool = BUYABLE.filter(k => SPECIES[k].tier <= maxTier + (mono ? 1 : 0) && !SPECIES[k].legendary && (!mono || SPECIES[k].type === mono));
  if(!pool.length) pool = BUYABLE.filter(k => !SPECIES[k].legendary && (!mono || SPECIES[k].type === mono));
  const n = daycareSlotsFor(tierFor(G));
  // Nothing is held here — if you want to keep a pokémon, buy it and park it
  // in the PC. That is what the PC is for.
  const next = [];
  for(let i = 0; i < n; i++){
    const weighted = pool.filter(k => SPECIES[k].tier >= Math.max(1, maxTier - 1));
    const src = (rnd() < 0.55 && weighted.length) ? weighted : pool;
    next.push({ unit: trainerCatchUp(G, makeUnit(src[Math.floor(rnd() * src.length)], 0)),
                bought:false });
  }
  G.daycare = next;
  return true;
}

/** Pick from a list of item ids, a rare one at TUNING.rareWeight the odds. */
const rarityOf = def => (def && (def.rarity || (def.rare ? 'rare' : 'common'))) || 'common';
const itemWeight = def => { const r = TUNING.rarity[rarityOf(def)]; return r ? r.weight : 1; };
function pickWeighted(ids, defs, r){
  const total = ids.reduce((n, k) => n + itemWeight(defs[k]), 0);
  let x = r * total;
  for(const k of ids){ x -= itemWeight(defs[k]); if(x < 0) return k; }
  return ids[ids.length - 1];
}
function rollMart(G, payCost){
  if(payCost && inGauntlet(G)) return false;
  if(payCost && !payReroll(G)) return false;
  const rnd = shopRng(G);
  const maxTier = tierFor(G);
  // never stock a stone nobody you own can use
  const owned = ownedUnits(G);
  const pool = Object.keys(ITEMS).filter(k =>
    ITEMS[k].tier <= maxTier && (!ITEMS[k].eligible || owned.some(u => canUseItem(k, u))
      // vitamins are for anyone until someone owns a pokémon that has maxed them
      || (ITEMS[k].vitamin && !owned.length)));
  const heldPool = Object.keys(HELD_ITEMS).filter(k => HELD_ITEMS[k].tier <= maxTier);
  /* The shelf is [consumables…, held…]. Consumables keep the indices they have
     always had, and held slots are appended, so a reserved item stays put. */
  const plan = [];
  for(let i = 0; i < martSlotsFor(tierFor(G)); i++) plan.push(false);
  for(let i = 0; i < heldSlotsFor(tierFor(G)); i++) plan.push(true);
  const next = [];
  plan.forEach((wantHeld, i) => {
    const prev = G.mart[i];
    if(prev && prev.reserved && !prev.bought && !!prev.held === wantHeld){ next.push(prev); return; }
    const src = wantHeld ? heldPool : pool;
    if(!src.length) return;
    next.push({ id: pickWeighted(src, wantHeld ? HELD_ITEMS : ITEMS, rnd()),
                held: wantHeld, reserved:false, bought:false });
  });
  G.mart = next;
  return true;
}

/* ---------------- the Bag ---------------- */
const bagCap   = G => TUNING.bagSlots + perk(G, 'pocket');
const bagRoom  = G => Math.max(0, bagCap(G) - (G.bag || []).length);
const defOfSlot = s => s && (s.held ? HELD_ITEMS[s.id] : ITEMS[s.id]);

/** Buy a held item off the Mart shelf. It goes into the Bag, not onto a
    pokémon — giving it out is a separate, free, reversible move. */
function buyHeld(G, idx){
  if(inGauntlet(G)) return shopClosed();
  const s = G.mart[idx];
  if(!s || s.bought || !s.held) return { ok:false, why:'Nothing to buy there.' };
  const def = HELD_ITEMS[s.id];
  if(!def) return { ok:false, why:'Nothing to buy there.' };
  if(G.credits < def.cost) return { ok:false, why:'Not enough pokecredits.' };
  if(bagRoom(G) <= 0) return { ok:false, why:'Your Bag is full.' };
  G.credits -= def.cost; s.bought = true;
  G.bag.push(s.id);
  makeGameApi(G).log(`Bought ${def.name}.`);
  return { ok:true, id:s.id };
}

/** Buy a held item straight onto a pokémon, skipping the Bag. Whatever it was
    holding goes back to the Bag, so that needs room; a pokémon holding nothing
    needs no Bag space at all. */
function buyHeldOnto(G, idx, u){
  if(inGauntlet(G)) return shopClosed();
  const s = G.mart[idx];
  if(!s || s.bought || !s.held) return { ok:false, why:'Nothing to buy there.' };
  const def = HELD_ITEMS[s.id];
  if(!def) return { ok:false, why:'Nothing to buy there.' };
  if(!u) return { ok:false, why:'Pick a pokémon first.' };
  if(G.credits < def.cost) return { ok:false, why:'Not enough pokecredits.' };
  if(u.held && bagRoom(G) <= 0)
    return { ok:false, why:`Your Bag is full — ${u.nm}'s ${HELD_ITEMS[u.held].name} would have nowhere to go.` };
  G.credits -= def.cost; s.bought = true;
  const was = u.held || null;
  u.held = s.id;
  if(was) G.bag.push(was);
  makeGameApi(G).log(`Bought ${def.name} for ${u.nm}.`);
  return { ok:true, id:s.id, given:s.id, taken:was, unit:u };
}

/** Give a Bag item to a pokémon. Whatever it was holding goes back to the Bag,
    so a swap never needs a free slot and never loses an item. */
function equipHeld(G, bagIdx, u){
  const id = (G.bag || [])[bagIdx];
  if(!id || !HELD_ITEMS[id]) return { ok:false, why:'No such item.' };
  if(!u) return { ok:false, why:'Pick a pokémon first.' };
  if(u.held === id) return { ok:false, why:`${u.nm} is already holding that.` };
  const was = u.held || null;
  G.bag.splice(bagIdx, 1);
  u.held = id;
  if(was) G.bag.splice(bagIdx, 0, was);        // the swap lands in the same slot
  return { ok:true, given:id, taken:was };
}

/** Take an item off a pokémon. Needs a free Bag slot. */
function unequipHeld(G, u){
  if(!u || !u.held) return { ok:false, why:'Nothing to take.' };
  if(bagRoom(G) <= 0) return { ok:false, why:'Your Bag is full.' };
  const id = u.held;
  u.held = null;
  G.bag.push(id);
  return { ok:true, id };
}

/** What the Mart pays for a held item you no longer want. */
const heldResale = id => {
  const d = HELD_ITEMS[id];
  return d ? Math.max(1, Math.round(d.cost * TUNING.itemResale)) : 0;
};

/* Sell a held item back. Straight from the Bag, or straight off a pokémon —
   the second matters, because with a full Bag you could not take an item off
   to sell it, and the thing you want to sell is often the one in the way. */
function sellHeld(G, where, i){
  let id = null;
  if(where === 'bag'){
    id = (G.bag || [])[i];
    if(!id || !HELD_ITEMS[id]) return { ok:false, why:'Nothing to sell.' };
    G.bag.splice(i, 1);
  } else {
    const u = where === 'pc' ? (G.pc || [])[i] : (G.team || [])[i];
    if(!u || !u.held || !HELD_ITEMS[u.held]) return { ok:false, why:'Nothing to sell.' };
    id = u.held; u.held = null;
  }
  const paid = heldResale(id);
  G.credits += paid;
  makeGameApi(G).log(`Sold ${HELD_ITEMS[id].name} for ${paid}₽.`);
  return { ok:true, id, paid };
}

/** Selling or releasing a pokémon must not silently bin its item. */
function reclaimHeld(G, u){
  if(!u || !u.held) return { ok:true };
  if(bagRoom(G) <= 0) return { ok:false, why:`Your Bag is full — take ${u.nm}'s ${HELD_ITEMS[u.held].name} off first.` };
  G.bag.push(u.held); u.held = null;
  return { ok:true, reclaimed:true };
}

function rollShop(G, payCost){ // both shelves, used at the start of a turn
  const a = rollDaycare(G, payCost);
  const b = rollMart(G, false);
  return a && b;
}

/* Bring a pokémon up to the trainer's level.
   Applied when the Daycare is ROLLED, not when a pokémon is bought. Two reasons.
   It is not done inside effHp/effAtk/effSpd because those are called for enemy
   units too and have no idea whose pokémon they are holding. And it is not done
   at purchase because the Daycare row shows a pokémon's own stats — topping it
   up on the way out of the shop would mean the shelf advertised one number and
   sold you another. Rolling happens after the bank has been paid, so the stats
   on the shelf are exactly what arrives. */
function trainerCatchUp(G, u){
  if(TUNING.expModel !== 'trainer' || !u) return u;
  const t = G.trainerExp;
  if(!t) return u;
  growUnit(u, t);          // the bank, split by this pokémon's role
  return u;
}

function buyPokemon(G, idx, slot, pos){
  if(inGauntlet(G)) return shopClosed();
  fixSlots(G);
  const s = G.daycare[idx];
  if(!s || s.bought) return { ok:false, why:'That slot is empty.' };
  if(G.credits < TUNING.costBuy) return { ok:false, why:'Not enough pokecredits.' };
  const target = G.team[slot];
  if(target){
    if(target.id !== s.unit.id) return { ok:false, why:'That slot is taken.' };
    if(unitLevel(target) >= 3)  return { ok:false, why:`${target.nm} is already level 3.` };
    G.credits -= TUNING.costBuy; s.bought = true;
    const r = mergeInto(G, target, s.unit);
    return { ok:true, merged:true, unit:target, evolved:r.evolved };
  }
  if(G.team.length >= TUNING.maxTeam) return { ok:false, why:'Your party is full.' };
  G.credits -= TUNING.costBuy; s.bought = true;
  const u = s.unit;
  // an empty cell the player picked, or else the first free one (front first)
  u.pos = Number.isInteger(pos) && !teamAt(G, pos) && pos < TUNING.maxTeam ? pos : freePos(G);
  G.team.push(u); fixSlots(G);
  makeGameApi(G).log(`Bought ${u.nm} for ${TUNING.costBuy}₽.`);
  return { ok:true, unit:u };
}

/** Combine two copies: better of each stat, plus the merge bonus, plus exp. */
function mergeInto(G, dst, src){
  // stats combine as the better of the two, so the vitamins they carry do too
  for(const k of ['protein','hpup','carbos']){
    const n = Math.max(vitaminsTaken(dst, k), vitaminsTaken(src, k));
    if(n){ dst.vit = dst.vit || {}; dst.vit[k] = n; }
  }
  // …and so do the Lucky Egg rounds it has already had
  if(src.eggTicks || dst.eggTicks) dst.eggTicks = Math.max(dst.eggTicks || 0, src.eggTicks || 0);
  dst.hp  = Math.max(dst.hp,  src.hp);
  dst.atk = Math.max(dst.atk, src.atk);
  dst.spd = Math.max(dst.spd, src.spd);
  growUnit(dst, TUNING.mergeBonus);
  return addExp(G, dst, (src.exp || 0) + 1);
}

/** A copy about to be absorbed hands its held item back first — a merge must
    never quietly bin one. Refuses if the Bag has no room, like selling does. */
function consumeCopy(G, src){
  return reclaimHeld(G, src);
}

/* ===================================================================
   SLOTS (v34)
   Where a pokémon STANDS is its own fact, not its place in the list. Party
   members carry `pos` (0-5: rank = pos / rankWidth, so 0-1 front, 2-3 middle,
   4-5 back) and PC pokémon carry `box` (0 … pcCap-1), so a player can leave
   gaps and arrange things their own way. G.team and G.pc stay plain lists,
   kept sorted by slot — every function that takes an INDEX still works, and a
   party with no gaps has index === pos, exactly as before.
   =================================================================== */
const teamAt  = (G, pos) => (G.team || []).find(u => u.pos === pos) || null;
const pcAt    = (G, box) => (G.pc || []).find(u => u.box === box) || null;
const teamIdx = (G, pos) => (G.team || []).findIndex(u => u.pos === pos);
const pcIdx   = (G, box) => (G.pc || []).findIndex(u => u.box === box);
const firstFree = (used, max) => { for(let i = 0; i < max; i++) if(!used.has(i)) return i; return -1; };
/** Give every pokémon a slot (old saves, bots and tests add them bare), fix any
    clash, and keep both lists sorted by slot. Idempotent; call after changes. */
function fixSlots(G){
  const place = (arr, key, max) => {
    const used = new Set();
    for(const u of arr){                       // keep good slots, first come first served
      if(Number.isInteger(u[key]) && u[key] >= 0 && u[key] < max && !used.has(u[key])) used.add(u[key]);
      else u[key] = null;
    }
    for(const u of arr) if(u[key] == null){ u[key] = firstFree(used, Math.max(max, arr.length)); used.add(u[key]); }
    arr.sort((a, b) => a[key] - b[key]);
  };
  place(G.team || (G.team = []), 'pos', TUNING.maxTeam);
  place(G.pc || (G.pc = []), 'box', Math.max(pcCap(G), (G.pc || []).length));
  for(const u of G.team) delete u.box;
  for(const u of G.pc) delete u.pos;
  return G;
}
const freePos = G => firstFree(new Set(G.team.map(u => u.pos)), TUNING.maxTeam);
const freeBox = G => firstFree(new Set(G.pc.map(u => u.box)), pcCap(G));

/* ===================================================================
   THE PC
   Owned pokémon that aren't in the party. Spare copies wait here until you
   cash them in for a level up, so keeping one no longer means freezing a
   Daycare slot. Benched pokémon train at TUNING.pcExpFraction.
   =================================================================== */
const pcCap  = G => (G.mods && G.mods.nopc) ? 0 : TUNING.pcSlots + perk(G, 'pcRow');   // 2.0.0: No PC
const pcRoom = G => pcCap(G) - (G.pc ? G.pc.length : 0);

/** Buy straight from the Daycare into storage. */
function buyToPc(G, idx, box){
  if(inGauntlet(G)) return shopClosed();
  const s = G.daycare[idx];
  if(!s || s.bought) return { ok:false, why:'That slot is empty.' };
  if(G.credits < TUNING.costBuy) return { ok:false, why:'Not enough pokecredits.' };
  fixSlots(G);
  /* v35: dropped onto a stored copy of the same pokémon, it combines with it
     right there, like it would in the party. Levels don't have to match — the
     only thing that stops it is the stored one already being level 3. */
  const there = Number.isInteger(box) ? pcAt(G, box) : null;
  if(there){
    if(there.id !== s.unit.id) return { ok:false, why:'That box is taken.' };
    if(unitLevel(there) >= 3) return { ok:false, why:`${there.nm} is already level 3.` };
    G.credits -= TUNING.costBuy; s.bought = true;
    const r = mergeInto(G, there, s.unit);
    makeGameApi(G).log(`${s.unit.nm} joined the ${there.nm} in the PC.`);
    return { ok:true, merged:true, unit:there, evolved:r.evolved };
  }
  if(pcRoom(G) <= 0) return { ok:false, why:'The PC is full.' };
  G.credits -= TUNING.costBuy; s.bought = true;
  fixSlots(G);
  s.unit.box = Number.isInteger(box) && !pcAt(G, box) && box < pcCap(G) ? box : freeBox(G);
  G.pc.push(s.unit); fixSlots(G);
  makeGameApi(G).log(`${s.unit.nm} was sent to the PC.`);
  return { ok:true, unit:s.unit };
}

/** Withdraw: merge onto a matching party member, fill an empty slot, or swap. */
function pcToParty(G, pcIdx, slot, pos){
  fixSlots(G);
  const u = G.pc[pcIdx];
  if(!u) return { ok:false };
  const t = G.team[slot];
  if(t){
    if(t.id === u.id && unitLevel(t) < 3){
      const keep = consumeCopy(G, u);
      if(!keep.ok) return keep;
      G.pc.splice(pcIdx, 1); fixSlots(G);
      const r = mergeInto(G, t, u);
      return { ok:true, merged:true, unit:t, evolved:r.evolved };
    }
    if(t.id === u.id) return { ok:false, why:`${t.nm} is already level 3.` };
    // straight swap: each takes the other's spot
    const p = t.pos, b = u.box;
    G.pc[pcIdx] = t; G.team[slot] = u; u.pos = p; t.box = b; fixSlots(G);
    makeGameApi(G).log(`Swapped ${u.nm} in for ${t.nm}.`);
    return { ok:true, swapped:true, unit:u };
  }
  if(G.team.length >= TUNING.maxTeam) return { ok:false, why:'Your party is full.' };
  G.pc.splice(pcIdx, 1);
  u.pos = Number.isInteger(pos) && !teamAt(G, pos) && pos < TUNING.maxTeam ? pos : freePos(G);
  G.team.push(u); fixSlots(G);
  makeGameApi(G).log(`Withdrew ${u.nm} from the PC.`);
  return { ok:true, unit:u };
}

/** Deposit a party member into storage. */
function partyToPc(G, slot, box){
  fixSlots(G);
  const u = G.team[slot];
  if(!u) return { ok:false };
  if(pcRoom(G) <= 0) return { ok:false, why:'The PC is full.' };
  G.team.splice(slot, 1);
  u.box = Number.isInteger(box) && !pcAt(G, box) && box < pcCap(G) ? box : freeBox(G);
  G.pc.push(u); fixSlots(G);
  makeGameApi(G).log(`${u.nm} was deposited in the PC.`);
  return { ok:true, unit:u };
}

function releaseFromPc(G, pcIdx){
  const u = G.pc[pcIdx];
  if(!u) return { ok:false };
  const keep = reclaimHeld(G, u);
  if(!keep.ok) return keep;
  const refund = unitLevel(u) * TUNING.sellRefundPerLevel;
  G.pc.splice(pcIdx, 1); fixSlots(G);
  G.credits += refund;
  makeGameApi(G).log(`Released ${u.nm} for ${refund}₽.`);
  return { ok:true, refund };
}

/** Is there a party member this stored copy could be merged into? */
function pcMergeTarget(G, pcIdx){
  const u = G.pc[pcIdx];
  if(!u) return -1;
  return G.team.findIndex(t => t.id === u.id && unitLevel(t) < 3);
}

/** …and is there another copy in the box itself? */
function pcTwinInBox(G, pcIdx){
  const u = G.pc[pcIdx];
  if(!u) return -1;
  return (G.pc || []).findIndex((t, i) =>
    i !== pcIdx && t && t.id === u.id && unitLevel(t) < 3);
}

/** Anywhere at all — what the ＋ badge on a box sprite means. */
const pcCanMerge = (G, i) => pcMergeTarget(G, i) >= 0 || pcTwinInBox(G, i) >= 0;

/** Combine two stored copies without going through the party. Levelling up
    in the box is the whole point of keeping spares there. */
function pcMerge(G, fromIdx, toIdx){
  if(fromIdx === toIdx) return { ok:false };
  const src = G.pc[fromIdx], dst = G.pc[toIdx];
  if(!src || !dst) return { ok:false };
  if(src.id !== dst.id) return { ok:false, why:`${src.nm} and ${dst.nm} are different pokémon.` };
  if(unitLevel(dst) >= 3) return { ok:false, why:`${dst.nm} is already level 3.` };
  const keep = consumeCopy(G, src);
  if(!keep.ok) return keep;
  G.pc.splice(fromIdx, 1);
  const r = mergeInto(G, dst, src); fixSlots(G);
  makeGameApi(G).log(`Combined two ${dst.nm} in the PC.`);
  return { ok:true, merged:true, unit:dst, evolved:r.evolved,
           // the box closes up when a slot empties, so the target may have moved
           at: G.pc.indexOf(dst) };
}

function sellUnit(G, slot){
  const u = G.team[slot];
  if(!u) return { ok:false };
  const keep = reclaimHeld(G, u);
  if(!keep.ok) return keep;
  const refund = unitLevel(u) * TUNING.sellRefundPerLevel;
  G.team.splice(slot, 1); fixSlots(G);
  G.credits += refund;
  makeGameApi(G).log(`Released ${u.nm} for ${refund}₽.`);
  return { ok:true, refund };
}

/** Old index-based rearrange, kept for the bots and tests: from and to are
    list indexes, and the two pokémon trade places (or merge, if twins). */
function moveUnit(G, from, to){
  fixSlots(G);
  if(from === to) return { ok:false };
  const u = G.team[from];
  if(!u) return { ok:false };
  const dst = G.team[to];
  return placeUnit(G, from, dst ? dst.pos : Math.min(to, TUNING.maxTeam - 1));
}
/** Put party member `idx` on formation cell `pos`: an empty cell just moves it;
    a twin that can still level merges; anyone else trades places with it. */
function placeUnit(G, idx, pos){
  fixSlots(G);
  const u = G.team[idx];
  if(!u || !Number.isInteger(pos) || pos < 0 || pos >= TUNING.maxTeam || u.pos === pos) return { ok:false };
  const dst = teamAt(G, pos);
  if(dst && dst.id === u.id && unitLevel(dst) < 3){
    const keep = consumeCopy(G, u); if(!keep.ok) return keep;
    G.team.splice(idx, 1);
    const r = mergeInto(G, dst, u); fixSlots(G);
    return { ok:true, merged:true, unit:dst, evolved:r.evolved };
  }
  if(dst) dst.pos = u.pos;
  u.pos = pos; fixSlots(G);
  return { ok:true, swapped:!!dst };
}
/** The same for the PC: move stored pokémon `idx` to box `box`, swapping with
    whoever is there. (Twins merge through pcMerge, which the UI calls first.) */
function placeInBox(G, idx, box){
  fixSlots(G);
  const u = G.pc[idx];
  if(!u || !Number.isInteger(box) || box < 0 || box >= pcCap(G) || u.box === box) return { ok:false };
  const dst = pcAt(G, box);
  if(dst) dst.box = u.box;
  u.box = box; fixSlots(G);
  return { ok:true, swapped:!!dst };
}

/** Use a Mart item on a pokémon — in the party (`where` 'team', the default)
    or in the PC ('pc'). A held item given this way goes straight onto it. */
function buyItem(G, idx, slot, where){
  if(inGauntlet(G)) return shopClosed();
  const s = G.mart[idx];
  if(!s || s.bought) return { ok:false, why:'Already used.' };
  const u = where === 'pc' ? (G.pc || [])[slot] : G.team[slot];
  if(s.held) return u ? buyHeldOnto(G, idx, u) : buyHeld(G, idx);
  const def = ITEMS[s.id];
  if(G.credits < def.cost) return { ok:false, why:'Not enough pokecredits.' };
  if(!u) return { ok:false, why:'Pick a pokémon first.' };
  if(!canUseItem(s.id, u)) return { ok:false, why: def.vitamin
    ? `${u.nm} can't take any more ${def.name} (${TUNING.vitaminCap} is the most per pokémon).`
    : `${def.name} does nothing for ${u.nm}.` };
  G.credits -= def.cost; s.bought = true;
  const api = makeGameApi(G);
  def.apply(u, api);
  if(def.vitamin){ u.vit = u.vit || {}; u.vit[s.id] = vitaminsTaken(u, s.id) + 1; }
  api.log(`Used ${def.name} on ${u.nm}.`);
  return { ok:true };
}

/** The always-stocked shelf. Boosts the whole party; wears off after the
    battle; at most `xItems.perBattle` uses of each per battle. Any extra
    arguments (older callers passed a party slot) are ignored. */
function buyBattleItem(G, idx){
  if(inGauntlet(G)) return shopClosed();
  const def = BATTLE_ITEMS[idx];
  if(!def) return { ok:false, why:'No such item.' };
  if(!G.team.length) return { ok:false, why:'You need a party first.' };
  if(xUses(G, def) >= TUNING.xItems.perBattle)
    return { ok:false, why:`That's all ${TUNING.xItems.perBattle} ${def.name} for this battle.` };
  if(G.credits < def.cost) return { ok:false, why:'Not enough pokecredits.' };
  G.credits -= def.cost;
  def.apply(G);
  G.xUses = G.xUses || {};
  G.xUses[def.id] = xUses(G, def) + 1;
  makeGameApi(G).log(`Used ${def.name} (${xUses(G, def)}/${TUNING.xItems.perBattle}) — ${def.text()}`);
  return { ok:true, uses: xUses(G, def) };
}

/** Hook kept for the UI; nothing happens between rounds in this model. */
function endTurnEffects(G){ /* no shop-phase abilities */ }

/** Exp. Share: one round of battle EXP for the PARTY only. No trainer bank (so
    it doesn't compound into every future buy), no PC, no Lucky Egg bonus. */
function shareExp(G){
  for(const u of G.team) growUnit(u, TUNING.expGainWin);
  makeGameApi(G).log('Your party gained a round of EXP from the Exp. Share.');
}

/** After a battle every pokémon gains EXP — the player's stat curve. */
function grantBattleExp(G, result, quiet){
  const g = result === 'win' ? TUNING.expGainWin : TUNING.expGainLoss;
  // the trainer's own bank, always kept so the model can be switched
  G.trainerExp = G.trainerExp || { hp:0, atk:0, spd:0 };
  G.trainerExp.hp += g.hp; G.trainerExp.atk += g.atk; G.trainerExp.spd += g.spd;
  const tick = u => growUnit(u, g);
  // a Lucky Egg's bonus rounds count toward TUNING.eggCap, like vitamins
  const bonusTicks = u => { const h = heldOf(u); if(!h || !h.expTick) return 0;
    const n = Math.min(h.expTick, Math.max(0, TUNING.eggCap - (u.eggTicks || 0)));
    u.eggTicks = (u.eggTicks || 0) + n; return n; };
  for(const u of G.team){ tick(u); for(let n = bonusTicks(u); n > 0; n--) tick(u); }
  // Benched pokémon train at a fraction of the rate. The remainder is banked
  // on the unit rather than rounded away, so at 0.5 a stored pokémon gains a
  // full tick every second battle instead of nothing at all.
  let trained = 0;
  for(const u of (G.pc || [])){
    u.rest = (u.rest || 0) + TUNING.pcExpFraction;
    while(u.rest >= 1 - 1e-9){ u.rest -= 1; tick(u); trained++; }
    for(let n = bonusTicks(u); n > 0; n--){ tick(u); trained++; }
  }
  const api = makeGameApi(G);
  if(quiet) return;
  if(G.team.length) api.log(
    `Your party gained EXP — each pokémon grows along its role.`);
  if(trained) api.log(`${trained} pokémon in the PC trained too.`);
}

/* The run advances by clearing schedule entries.
   A trainer battle is pass-or-pay: win or lose, you move on, and a loss costs
   a life. A boss is a gate: you stay on it until you beat it, and losing
   blacks you out — you keep your team and your badges and lose your money.
   Two attempts are free; from the third, a defeat costs a life as well, so a
   wall you cannot climb still ends the run. */
function applyBattleResult(G, result, opp, sim){
  const st = stageOf(G);
  const meeting = rivalMeeting(G);
  const boss = st.boss || null;
  const gauntlet = isGauntletStage(st);
  /* Wounds are read BEFORE the battle EXP lands. They are stored as a share of
     max HP and EXP raises max HP, so reading afterwards would quietly round every
     survivor up toward full. A draw mid-gauntlet still costs you what it cost. */
  if(gauntlet && sim && (result === 'win' || (result === 'draw' && inGauntlet(G)))){
    G.gauntlet = G.gauntlet || { hpFrac: {} };
    recordWounds(G, sim);
  }
  grantBattleExp(G, result);
  G.lastResult = result;
  G.blackout = 0;

  if(result === 'draw'){
    // nobody advances and nobody pays; the streak is left alone
    return G.over;
  }
  if(meeting >= 0){
    const R = rivalCore(G);
    R.met = meeting + 1;
    G.lastRival = { meeting, result, credits:0, item:null, sold:0 };
    if(result === 'win'){
      R.beaten = (R.beaten || 0) + 1;
      const prize = rivalPrize(G, meeting);
      G.rivalPay = (G.rivalPay || 0) + prize.credits;       // lands with next turn's income
      G.lastRival.credits = prize.credits;
      if(prize.item && bagRoom(G) > 0){ G.bag.push(prize.item); G.lastRival.item = prize.item; }
      else if(prize.item){                                   // full Bag: he pays its worth instead
        const worth = heldResale(prize.item); G.rivalPay += worth; G.lastRival.sold = worth; G.lastRival.item = prize.item;
      }
      makeGameApi(G).log(`You beat your rival! +${prize.credits}₽ next turn${prize.item ? ` and a ${HELD_ITEMS[prize.item].name}` : ''}.`);
    }
  }
  if(result === 'win'){
    G.streak = G.streak > 0 ? G.streak + 1 : 1;
    if(st.kind === 'gym'){
      G.badges++; G.lastBadge = boss ? boss.badge : null;
      (G.pendingRewards = G.pendingRewards || []).push(G.badges - 1);   // pick one of three
      rollEncounter(G);                                                 // 2.0.0: maybe a legendary
    }
    /* Beating Lorelei is not a fresh start. The gauntlet as a whole is the
       attempt, or a player who can always beat the first member would never pay
       a life for falling at the fourth. */
    if(!gauntlet) G.attempt = 0;
    // you will face them again if you fall further in, so remember what they fielded
    if(gauntlet && boss && opp) scout(G, boss, opp);
    G.stage = (G.stage || 0) + 1;
    if(st.kind === 'champion'){ G.over = 'won'; G.gauntlet = null; }
  } else {
    G.streak = G.streak < 0 ? G.streak - 1 : -1;
    if(isBoss(st)){
      G.attempt = (G.attempt || 0) + 1;
      const lost = Math.floor(G.credits * TUNING.blackoutPct);
      G.credits -= lost;
      G.blackout = lost;
      // you lose, but you learn: the rematch shows you exactly what they field
      if(boss && opp) scout(G, boss, opp);
      if(G.attempt > freeAttemptsFor(G)) G.lives--;
      // fall anywhere in the gauntlet and it starts again from Lorelei, healed
      if(gauntlet){ G.stage = gauntletStart(); G.gauntlet = null; }
      makeGameApi(G).log(`You blacked out! Lost ${lost}₽.`);
    } else {
      G.lives--;
      G.stage = (G.stage || 0) + 1;
    }
  }
  if(!G.over && G.lives <= 0) G.over = 'lost';
  return G.over;
}

/** Remember a boss's team. A rematch is rebuilt from this, so it is the truth. */
/** 2.2.1 (Sean): One Life means every lost battle takes the life — the free boss
    rematches don't apply, so a first defeat by a gym leader ends the run too. */
function freeAttemptsFor(G){ return G && G.mods && G.mods.onelife ? 0 : TUNING.freeAttempts; }
function scout(G, boss, opp){
  G.scouted = G.scouted || {};
  G.scouted[boss.id] = opp.team.map(u => ({
    id:u.id, nm:u.nm, hp:u.hp, atk:u.atk, spd:u.spd, exp:u.exp || 0, held:u.held || null }));
}

/** Everything the UI needs to describe what happens next, in one call. */
function nextUp(G){
  const st = stageOf(G);
  const plan = runPlan();
  const boss = st.boss || null;
  const untilGym = (() => {
    for(let i = G.stage || 0; i < plan.length; i++) if(plan[i].kind !== 'trainer') return i - (G.stage || 0);
    return 0;
  })();
  return {
    kind: st.kind, boss, badge: st.badge,
    stage: (G.stage || 0) + 1, total: plan.length, untilGym,
    attempt: G.attempt || 0,
    lifeAtRisk: isBoss(st) && (G.attempt || 0) >= freeAttemptsFor(G),
    scouted: boss ? (G.scouted || {})[boss.id] || null : null,
    gauntlet: isGauntletStage(st) ? {
      at: (G.stage || 0) - gauntletStart(),
      members: plan.slice(gauntletStart()).map(p => p.boss),
      running: inGauntlet(G),
    } : null,
    // the shop turn before Lorelei is the last one until the gauntlet is over
    lastShop: isGauntletStage(st) && !inGauntlet(G),
  };
}

/** What next turn's pay packet looks like. Shown in the UI, so it lives here. */
function incomeFor(G){
  const carry = Math.min(Math.max(0, G.credits), carryCap(G));
  const base = TUNING.creditsPerTurn;
  const result = G.lastResult === 'win' ? TUNING.winBonus
               : G.lastResult === 'lose' ? TUNING.lossBonus : 0;
  const tbl = G.streak > 0 ? TUNING.winStreakBonus : TUNING.lossStreakBonus;
  const streak = Math.abs(G.streak) >= 2
    ? tbl[Math.min(Math.abs(G.streak), tbl.length - 1)] : 0;
  // held items that pay — an Amulet Coin earns wherever the pokémon is kept
  const items = ownedUnits(G).reduce((n, u) => {
    const h = heldOf(u); return n + ((h && h.income) || 0); }, 0);
  const badges = perk(G, 'allowance');
  const rival = G.rivalPay || 0;                   // beating your rival pays next turn
  // 2.0.0: Rich & Ruthless doubles everything earned (not what you carried over)
  const rich = G.mods && G.mods.rich ? (TUNING.mods.richIncome - 1) * (base + result + streak + items + badges + rival) : 0;
  return { carry, base, result, streak, items, badges, rival, rich,
           total: carry + base + result + streak + items + badges + rival + rich };
}

function nextTurn(G){
  /* Between Elite Four fights: no pay, no restock, and the clock doesn't move
     (so the next member is priced against the same turn). But "next battle
     only" still means the next battle, or one X Attack before Lorelei would
     last all five fights. */
  if(inGauntlet(G)){
    for(const u of ownedUnits(G)){ u.tmpAtk = 0; u.tmpSpd = 0; }
    G.xUses = null;
    /* Resting on the bench. Anything that sat the last fight out in the PC
       recovers a share of its max HP. A FAINTED pokémon stays fainted — rest
       heals the hurt, it doesn't revive — or a full rotation would bring the
       whole team back and attrition would mean nothing. Applied here, straight
       after the fight, so it counts the fight a pokémon actually sat out. */
    for(const u of G.pc || []){
      const f = hpFracOf(G, u);
      if(f > 0 && f < 1) G.gauntlet.hpFrac[u.uid] = Math.min(1, f + TUNING.benchRest);
    }
    return;
  }
  G.turn++;
  const inc = incomeFor(G);
  G.income = inc;
  G.credits = inc.total;
  G.rivalPay = 0;
  for(const u of ownedUnits(G)){ u.tmpAtk = 0; u.tmpSpd = 0; }   // X items wear off
  G.xUses = null;
  G.mart.forEach(s => { if(s.bought) s.reserved = false; });
  G.freeRolls = perk(G, 'freeRoll');
  rollShop(G, false);
}

/* Bump on every publish: testers quote this in bug reports, and the
   project's tester-checklist doc is keyed by it. */
/* Version numbers (from 1.2.0, Sean's scheme): BIG.MEDIUM.SMALL —
   BIG = a big mechanical update · MEDIUM = patches, things added or removed ·
   SMALL = very minor visual and small text fixes. Before 1.2.0 updates were
   numbered v1…v54; those entries keep their old names in the changelog. */
const GAME_VERSION = { v:'3.8.1', date:'Sep 30, 2026' };   // the date shows only in What's new (1.3.0, Sean)
const versionTag = () => `<div class="vtag">PokéBattler ${GAME_VERSION.v}</div>`;

const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* v37: player settings (START → OPTIONS). Kept per device, like the speed choice. */
const PREF = {
  get(k, d){ try{ const v = localStorage.getItem('pkb_' + k); return v === null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('pkb_' + k, String(v)); }catch(e){} },
};
const playerName = () => String(PREF.get('name', '') || '').replace(/[<>]/g, '').trim() || 'Trainer';

/* ===================================================================
   v47 · SOUND — Game Boy style blips, made on the fly with Web Audio
   Square and triangle waves plus a little noise, like the old sound chip:
   nothing to download. On by default; START → Options has Sound (On/Off)
   and Volume. Phones only allow sound after the first tap, so the audio
   starts on the first pointerdown/keydown. Browser test runs stay silent
   (navigator.webdriver) unless window.PKB_SOUND is set, but every sound
   the game asks for is still written to SFX.log so tests can see it.
   =================================================================== */
/* 3.7.0 · HAPTICS — a light buzz on the moments that matter (buys, level-ups,
   evolutions, knockouts, wins and losses), on phones that support vibration
   (Android; iPhones don't let web pages vibrate). START → Options → Haptics. */
const HAPTIC = (() => {
  const PAT = { select:8, coin:12, levelup:[18, 40, 22], evolve:[25, 50, 25, 50, 60], faint:30, crit:14,
    win:[30, 60, 30, 60, 90], lose:[90, 70, 90], badge:[30, 50, 30, 50, 140], sparkle2:[12, 30, 12, 30, 12], error:[15, 30, 15], encounter:[20, 40, 60] };
  let last = 0; const log = [];
  const on = () => PREF.get('haptics', 'on') !== 'off';
  function buzz(name){
    const p = PAT[name]; if(!p || !on()) return;
    const now = performance.now(); if(now - last < 60) return; last = now;
    log.push(name); if(log.length > 100) log.shift();
    if(navigator.webdriver && !window.PKB_HAPTIC) return;
    try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){}
  }
  return { buzz, log, supported: () => typeof navigator.vibrate === 'function' };
})();

const SFX = (() => {
  let ctx = null, master = null, noiseBuf = null;
  const last = {};
  const log = [];
  const VOL = { low: 0.12, mid: 0.24, high: 0.4 };
  const on = () => PREF.get('sound', 'on') !== 'off';
  const allowed = () => !navigator.webdriver || window.PKB_SOUND;
  function ensure(){
    if(!allowed()) return null;
    try{
      if(!ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        ctx = new AC();
        master = ctx.createGain(); master.connect(ctx.destination);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if(ctx.state === 'suspended') ctx.resume();
      master.gain.value = VOL[PREF.get('volume', 'mid')] || VOL.mid;
    }catch(e){ return null; }
    return ctx;
  }
  // phones unlock audio only inside a user gesture
  const unlock = () => { if(on()) ensure(); };
  document.addEventListener('pointerdown', unlock, true);
  document.addEventListener('keydown', unlock, true);

  /* one note: f in Hz, t0 seconds from now, d seconds long; o.to slides the pitch */
  function tone(f, t0, d, o){
    o = o || {};
    const t = ctx.currentTime + t0, osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(f, t);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d);
    const v = (o.v == null ? 1 : o.v) * (osc.type === 'square' ? 0.5 : 1);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + 0.004);
    g.gain.setValueAtTime(v, t + Math.max(0.005, d * 0.6));
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + d + 0.02);
  }
  function noise(t0, d, o){
    o = o || {};
    const t = ctx.currentTime + t0, src = ctx.createBufferSource(), g = ctx.createGain(), fl = ctx.createBiquadFilter();
    src.buffer = noiseBuf; src.playbackRate.value = o.rate || 1;
    fl.type = o.high ? 'highpass' : 'lowpass'; fl.frequency.value = o.cut || 2200;
    const v = o.v == null ? 0.6 : o.v;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    src.connect(fl); fl.connect(g); g.connect(master);
    src.start(t); src.stop(t + d + 0.02);
  }
  const N = n => 440 * Math.pow(2, (n - 69) / 12);          // MIDI note → Hz
  const seq = (notes, step, o) => notes.forEach((n, k) => n && tone(N(n), k * step, step * 0.95, o));

  const SOUNDS = {
    tap:     () => tone(1250, 0, 0.025, { v: 0.5 }),
    move:    () => tone(880, 0, 0.03, { v: 0.5 }),
    select:  () => { tone(988, 0, 0.04); tone(1319, 0.04, 0.06); },
    back:    () => tone(660, 0, 0.07, { to: 400 }),
    open:    () => { tone(1319, 0, 0.03, { v: 0.6 }); tone(1760, 0.03, 0.05, { v: 0.6 }); },
    error:   () => { tone(185, 0, 0.07); tone(175, 0.1, 0.1); },
    coin:    () => { tone(988, 0, 0.05); tone(1319, 0.05, 0.14); },
    gain:    () => seq([88, 91, 96], 0.045),
    land:    () => { noise(0, 0.05, { cut: 5000, v: 0.4 }); tone(420, 0.03, 0.09, { to: 950 }); },
    deal:    () => [0, 1, 2, 3].forEach(k => tone(600 + k * 110, k * 0.03, 0.022, { v: 0.4 })),
    levelup: () => seq([72, 76, 79, 84], 0.07, { type: 'square', v: 0.8 }),
    evolve:  () => { tone(260, 0, 0.45, { to: 1100, v: 0.7 }); seq([0, 0, 0, 0, 0, 0, 0, 84, 88, 91, 96], 0.06); },
    hit:     () => { noise(0, 0.08, { cut: 1600, v: 0.7 }); tone(170, 0, 0.07, { to: 60, v: 0.8 }); },
    crit:    () => { noise(0, 0.12, { cut: 3500, v: 0.9 }); tone(260, 0, 0.1, { to: 70 }); tone(1500, 0.02, 0.05, { v: 0.4 }); },
    weak:    () => noise(0, 0.05, { cut: 900, v: 0.4 }),
    faint:   () => tone(820, 0, 0.5, { to: 90, v: 0.8 }),
    heal:    () => seq([79, 83, 86], 0.05, { type: 'triangle', v: 0.9 }),
    status:  () => [0, 1, 2].forEach(k => { tone(520, k * 0.07, 0.03); tone(700, k * 0.07 + 0.035, 0.03); }),
    shield:  () => tone(1200, 0, 0.14, { type: 'triangle', to: 1700, v: 0.9 }),
    up:      () => seq([76, 79, 83], 0.035, { v: 0.5 }),
    down:    () => seq([83, 79, 76], 0.035, { v: 0.5 }),
    encounter: () => { seq([100, 99, 98, 97, 96, 95, 94, 93], 0.032, { v: 0.6 }); noise(0.27, 0.15, { cut: 800, v: 0.6 }); tone(110, 0.27, 0.2, { to: 70 }); },
    alert:   () => { tone(1760, 0, 0.06); tone(1760, 0.09, 0.08); },
    win:     () => { seq([72, 76, 79, 84], 0.1); tone(N(79), 0.42, 0.14); tone(N(84), 0.56, 0.35); },
    lose:    () => seq([72, 71, 70, 69], 0.16, { type: 'triangle' }),
    badge:   () => { seq([79, 79, 79], 0.09); seq([0, 0, 0, 84, 88], 0.09); tone(N(91), 0.45, 0.45); },
    start:   () => { tone(N(84), 0, 0.08); tone(N(91), 0.08, 0.16); },
    // v54: a Rare / Very rare item lands on the shelf
    sparkle: () => { seq([91, 95, 98, 103], 0.045, { type: 'triangle', v: 0.7 }); tone(N(103), 0.2, 0.28, { type: 'triangle', v: 0.35 }); },
    sparkle2: () => { seq([84, 88, 91, 96, 100, 103], 0.045, { type: 'triangle', v: 0.75 });
      [0, 1, 2, 3].forEach(k => tone(N(k % 2 ? 108 : 103), 0.3 + k * 0.06, 0.05, { type: 'triangle', v: 0.3 })); },
    wipeIn:  q => tone(1100, 0, q ? 0.14 : 0.36, { to: 180, v: 0.35 }),
    wipeOut: q => tone(200, 0, q ? 0.14 : 0.26, { to: 900, v: 0.3 }),
  };

  function play(name, arg){
    HAPTIC.buzz(name);                                      // 3.7.0: felt even with the sound off
    if(!SOUNDS[name] || !on()) return;
    const now = performance.now();
    if(last[name] && now - last[name] < 45) return;          // at 4× the same blip would pile up
    last[name] = now;
    log.push(name); if(log.length > 300) log.shift();
    if(!ensure()) return;
    try{ SOUNDS[name](arg); }catch(e){}
  }
  return { play, log, names: Object.keys(SOUNDS), ensure };
})();


/* ===================================================================
   v48 · THE HOME-SCREEN APP
   The same file runs three ways: inside the claude.ai artifact, opened as a
   local file, and hosted on its own address (GitHub Pages) with a manifest,
   icons and a service worker next to it. Only the hosted copy has
   <link rel="manifest"> (build.py adds it to app/index.html), so only it
   registers the service worker and offers "Install app" in the START menu.
   Android/desktop Chrome can install straight from the menu; iPhones can't be
   prompted, so the menu explains Share → Add to Home Screen.
   =================================================================== */
const APP = (() => {
  let prompt = null;
  const hosted = () => /^https?:$/.test(location.protocol) && window.top === window && !!document.querySelector('link[rel="manifest"]');
  const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const ios = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); prompt = e; });
  window.addEventListener('appinstalled', () => { prompt = null; });
  if(hosted() && 'serviceWorker' in navigator)
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  if(standalone()) document.documentElement.classList.add('standalone');
  return {
    hosted, standalone, ios,
    canInstall: () => hosted() && !standalone() && (!!prompt || ios() || window.PKB_INSTALL),
    async install(){
      if(prompt){
        const p = prompt; prompt = null;
        try{ p.prompt(); const c = await p.userChoice; if(c && c.outcome === 'accepted') say('PokéBattler is on your home screen.'); }catch(e){}
        return;
      }
      const d = modal(`<h3>Install PokéBattler</h3>
        ${ios() ? `<ol class="ihelp">
          <li>Tap the <b>Share</b> button <span class="ishare" aria-hidden="true">⬆︎</span> in Safari's toolbar.</li>
          <li>Scroll down and tap <b>Add to Home Screen</b>.</li>
          <li>Tap <b>Add</b>. PokéBattler appears on your home screen with its own icon.</li></ol>`
        : `<ol class="ihelp"><li>Open your browser's menu (<b>⋮</b>).</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li></ol>`}
        <p>Opened from the home screen it fills the whole screen, plays offline, and keeps your run on this phone.</p>
        <div class="btnrow"><button class="btn primary" data-m="close">Got it</button></div>`);
      d.classList.add('install');
      d.querySelector('[data-m="close"]').onclick = () => d.remove();
    },
  };
})();

let G = null;
let phase = 'shop';           // 'shop' | 'battle' | 'over'
let sel = null;               // { kind:'dc'|'team'|'mart'|'bitem', idx }
let inspect = null;
let battle = null;
let toast = '';

/* ---------------- persistence (best effort, never required) --------- */
const SAVE_KEY = 'pokebattler.save.v3';
/* 2.0.0: the daily challenge has its own save, so it never touches your run.
   Which slot a run lives in is a fact about the run (G.daily), not a mode. */
const DAILY_KEY = 'pokebattler.save.daily';
const slotKey = g => (g && g.daily) ? DAILY_KEY : SAVE_KEY;
function save(){
  if(!G) return;
  try{ localStorage.setItem(slotKey(G), JSON.stringify({ G, phase: phase === 'battle' ? 'shop' : phase })); }catch(e){}
  PREF.set('slot', G.daily ? 'daily' : 'main');
}
function load(key){
  try{
    const raw = localStorage.getItem(key || SAVE_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || !d.G || !Array.isArray(d.G.team)) return null;
    d.G.team    = d.G.team.filter(u => u && SPECIES[u.id] && Number.isFinite(u.spd));
    d.G.pc      = (d.G.pc||[]).filter(u => u && SPECIES[u.id] && Number.isFinite(u.spd));
    d.G.daycare = (d.G.daycare||[]).filter(s => s && s.unit && SPECIES[s.unit.id]);
    d.G.mart    = (d.G.mart||[]).filter(s => s && (s.held ? HELD_ITEMS[s.id] : ITEMS[s.id]));
    d.G.bag     = (d.G.bag||[]).filter(id => HELD_ITEMS[id]);
    for(const u of [...(d.G.team||[]), ...(d.G.pc||[])])
      if(u.held && !HELD_ITEMS[u.held]) u.held = null;
    syncUid(d.G);      // never mint a uid a saved pokémon already owns
    /* Saves from before trainer EXP have no bank. Left alone, a run loaded on
       turn 20 would start banking from zero while its veterans carry twenty
       battles of EXP — every buy for the rest of that run would arrive a runt,
       which is exactly what trainer EXP exists to prevent. Back-fill the bank
       as if the trainer had been earning at today's rate all along, and bring
       the shelf they are looking at up to it. */
    if(!d.G.trainerExp){
      const n = Math.max(0, (d.G.turn || 1) - 1), g = TUNING.expGainWin;
      d.G.trainerExp = { hp: g.hp * n, atk: g.atk * n, spd: g.spd * n };
      for(const s of d.G.daycare) if(s && !s.bought) trainerCatchUp(d.G, s.unit);
    }
    /* Saves from before the gauntlet. Someone already past Lorelei would load
       with no gauntlet state and be told "last chance to shop — once you
       challenge Lorelei…" while standing at Agatha. Put them in the gauntlet
       where they are, at full health: the rules changed under them, so they
       get the kinder start. */
    /* Saves from before badge rewards. They keep what they have (a PC fuller
       than the new 8-slot start stays full — it just can't take more until it
       grows), and every badge already won is owed its reward: they choose them
       on load, one after another. */
    if(!('perks' in d.G)){
      d.G.perks = {}; d.G.rewardLog = []; d.G.freeRolls = 0;
      d.G.pendingRewards = Array.from({ length: d.G.badges || 0 }, (_, i) => i);
    }
    if(!('gauntlet' in d.G)){
      d.G.gauntlet = (d.G.stage || 0) > gauntletStart() && !d.G.over ? { hpFrac: {} } : null;
    }
    fixSlots(d.G);     // v34: saves from before free placement stand where they were listed
    return d;
  }catch(e){ return null; }
}
function clearSave(){ try{ localStorage.removeItem(slotKey(G)); }catch(e){} }
/** Put the run in `key` on screen (saving the current one first). */
function switchSlot(key){
  save();
  const d = load(key);
  if(!d) return false;
  G = d.G; phase = d.phase === 'over' ? 'over' : 'shop';
  sel = null; inspect = null; battle = null; shopMem = null; drawnPhase = null; toast = ''; undo = null;
  if(!G.daycare || !G.daycare.length) rollShop(G, false);
  save(); render();
  return true;
}
/** The main (non-daily) run as it stands, whether or not it's on screen. */
const mainRun = () => (G && !G.daily) ? G : ((load(SAVE_KEY) || {}).G || null);
const localDate = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const prettyDate = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString([], { month:'short', day:'numeric', year:'numeric' }); };

/* ---------------- card rendering ----------------------------------- */
const typeColor = id => (TYPES[SPECIES[id].type] || {}).color || '#8a93a8';

function spriteHtml(id, cls){
  const sp = SPECIES[id], col = typeColor(id);
  if(SPRITES[id]) return `<div class="sprite img ${cls||''}" style="--tcol:${col}"><img src="${SPRITES[id]}" alt="${esc(sp.name)}"></div>`;
  return `<div class="sprite ${cls||''}" style="--tcol:${col}">${esc(sp.name.slice(0, 2))}</div>`;
}

/** An item's artwork, falling back to its emoji when no sprite is loaded. */
function itemSpriteHtml(id, fallback, cls){
  return SPRITES[id]
    ? `<div class="sprite icon img ${cls||''}"><img src="${SPRITES[id]}" alt=""></div>`
    : `<div class="sprite icon ${cls||''}">${fallback}</div>`;
}
/* ---------------- held items --------------------------------------
   The badge orbits the sprite: bottom-right of the art, overlapping the frame,
   ringed in the card colour so it reads against any type tint. */
function heldBadge(u, where, i, cls){
  const h = heldOf(u);
  if(!h) return '';
  const off = (h.when && !h.when(u)) ? ' off' : '';   // Eviolite on a final form
  const tap = where ? `data-act="unequip" data-where="${where}" data-i="${i}"` : '';
  return `<span class="held${off} ${cls||''}" title="${esc(h.name)}${off ? ' — no effect here' : ''} · tap to take off"
    ${tap}>${itemGlyph(u.held, h.icon)}</span>`;
}

/* The second move (v32): what triggers it, then what it does. */

/* A battle card's status condition and barrier, from the step snapshot. */
function statusHtml(u){

/* v50: an item's rarity as a small coloured tag. Common items get none, so the

function rarityTag(def){
  const r = rarityOf(def); if(r === 'common') return '';
  const R = TUNING.rarity[r], pct = Math.round(R.weight * 100);
  return `<i class="rar r-${r}" title="${esc(R.name)} — turns up about ${pct}% as often as a common item">${esc(R.name.toUpperCase())}</i>`;
}
/** Inline item artwork for running text (the evolution line, the inspector). */

}

/* opts: { price, cls, bar, acting, frac } — `frac` is the HP a pokémon has
   left mid-gauntlet (0..1); the shop draws it the same way a battle does */
function unitHtml(u, opts){
  opts = opts || {};
  const lvl = u.lvl || unitLevel(u);
  const pips = expPipsToNext(u);
  let pipHtml = '';
  if(pips.need){
    pipHtml = '<div class="exp">';
    for(let i = 0; i < pips.need; i++) pipHtml += `<i class="${i < pips.have ? 'on' : ''}"></i>`;
    pipHtml += '</div>';
  }
  let barHtml = '';
  if(opts.bar){
    const frac = Math.max(0, Math.min(1, u.hp / Math.max(1, u.maxHp)));
    const col = frac > 0.5 ? 'var(--hp)' : frac > 0.22 ? 'var(--gold)' : 'var(--bad)';
    barHtml = `<div class="hpbar"><i style="width:${frac*100}%;background:${col}"></i></div>`;
  }
  const f = opts.frac;
  if(!opts.bar && f != null && f < 1){
    const col = f > 0.5 ? 'var(--hp)' : f > 0.22 ? 'var(--gold)' : 'var(--bad)';
    barHtml = f > 0
      ? `<div class="hpbar" title="${Math.round(f*100)}% HP left"><i style="width:${f*100}%;background:${col}"></i></div>`
      : `<div class="ko">Fainted</div>`;
  }
  const boosted = (u.tmpAtk || u.tmpSpd) ? '<div class="boosted" title="X item active">✦</div>' : '';
  const twin = opts.mergeable ? '<div class="twin" title="a party member can take this copy">＋</div>' : '';
  // X items show as the effective number, tinted, so the card reads as it will fight
  const hs = heldStats(u);
  const eA = effAtk(u), eS = effSpd(u);
  const eH = opts.bar ? Math.max(0, u.hp) : f != null && f < 1 ? Math.round(effHp(u) * f) : effHp(u);
  return `<div class="unit ${opts.cls||''} ${opts.acting?'acting':''} ${f === 0 ? 'fainted' : ''}" data-uid="${u.uid}" style="--tcol:${typeColor(u.id)}">
    ${isLegend(u) ? '<div class="lvl leg" title="Legendary — never levels up">★</div>' : lvl > 1 ? `<div class="lvl">L${lvl}</div>` : ''}${boosted}${twin}
    <div class="artwrap">${spriteHtml(u.id)}${roleBadge(u.id)}${opts.held === false ? '' : heldBadge(u, opts.where, opts.idx)}</div>
    <div class="uname">${esc(SPECIES[u.id].name)}</div>
    ${pipHtml}${barHtml}${opts.bar ? statusHtml(u) : ''}
    <div class="stats"><span class="a ${u.tmpAtk||hs.atk?'xup':''}">◆${eA}</span><span class="h ${hs.hp?'xup':''}">♥${eH}</span></div>
    <div class="stats spd"><span class="s ${(u.tmpSpd||0) + hs.spd < 0 ? 'xdown' : u.tmpSpd||hs.spd?'xup':''}">»${eS}</span></div>
    ${opts.price ? `<div class="price">${opts.price}₽</div>` : ''}
  </div>`;
}

function martHtml(s, i){

  return `<div class="slot ${sel && sel.kind==='mart' && sel.idx===i ? 'selected':''}" data-act="mart" data-i="${i}">
    ${s.bought ? '' : `<div class="unit item">
      ${itemSpriteHtml(s.id, def.icon)}

      <div class="price">${def.cost}₽</div>
    </div>${s.reserved ? '<div class="frozen"></div>' : ''}`}
  </div>`;
}

function battleItemHtml(def, i){
  return `<div class="slot fixed ${sel && sel.kind==='bitem' && sel.idx===i ? 'selected':''}" data-act="bitem" data-i="${i}">
    <div class="unit item">
      ${itemSpriteHtml(def.id, def.icon)}
      <div class="uname">${esc(def.name)}</div>
      <div class="round">this round</div>
      <div class="price">${def.cost}₽</div>
    </div></div>`;

/* ===================================================================
   THE FORMATION GRID
   Three ranks, two abreast, exactly as the layout sketch: the party reads
   Back | Middle | Front left to right, with the front rank nearest the enemy.
   Party index 0-1 is Front, 2-3 Middle, 4-5 Back, so these arrays are just
   the order those indices appear in a 3-column grid.
   =================================================================== */
const RANK_W = TUNING.rankWidth;                       // 2 abreast
const RANKS  = TUNING.rankNames;                       // Front / Middle / Back
// left-to-right column order for each side
const COLS_OWN   = [2, 1, 0];                          // Back, Middle, Front
const COLS_ENEMY = [0, 1, 2];                          // Front, Middle, Back
// the party index living at (column, row)
const slotAt = (rank, row) => rank * RANK_W + row;

function rankHeaderHtml(cols){
  return `<div class="rankhead">${cols.map(r =>
    `<span>${RANKS[r]}</span>`).join('')}</div>`;
}

/** Lay out six cells in a 3x2 grid. `cell(index)` renders one. */
function formationHtml(cols, cell){
  let out = '';
  for(let row = 0; row < RANK_W; row++)
    for(const rank of cols) out += cell(slotAt(rank, row));
  return `<div class="formation">${out}</div>`;
}

/* ---------------- which slots can accept the current selection ------ */
function slotClass(i){
  const u = teamAt(G, i);
  if(sel && sel.kind === 'bag') return u ? 'valid' : '';
  if(sel && sel.kind === 'dc'){
    const s = G.daycare[sel.idx];
    if(!s) return '';
    if(!u && G.team.length < TUNING.maxTeam) return 'valid';
    if(u && u.id === s.unit.id && unitLevel(u) < 3) return 'mergeable';
    return '';
  }
  if(sel && sel.kind === 'pc'){
    const src = pcAt(G, sel.idx);
    if(!src) return '';
    if(u && u.id === src.id && unitLevel(u) < 3) return 'mergeable';
    if(!u && G.team.length < TUNING.maxTeam) return 'valid';
    return u ? 'valid' : '';        // a different species swaps places
  }
  if(sel && sel.kind === 'mart'){
    const s = G.mart[sel.idx];
    if(s && s.held) return u ? 'valid' : '';   // buy it straight onto this pokémon
    return (u && s && canUseItem(s.id, u)) ? 'valid' : '';
  }
  if(sel && sel.kind === 'bitem') return '';   // party-wide: there is no target to pick
  if(sel && sel.kind === 'team'){
    if(sel.idx === i) return 'selected';
    const src = teamAt(G, sel.idx);
    if(u && src && u.id === src.id && unitLevel(u) < 3) return 'mergeable';
    return 'valid';
  }
  return '';
}

/* ---------------- the PC box --------------------------------------- */
function pcSlotClass(i){
  const u = pcAt(G, i);
  if(sel && sel.kind === 'bag') return u ? 'valid' : '';
  if(sel && sel.kind === 'pc'){
    if(sel.idx === i) return 'lifted';
    const src = pcAt(G, sel.idx);
    // a twin in the box can take the copy without a trip through the party
    if(u && src && u.id === src.id && unitLevel(u) < 3) return 'mergeable';
    return 'valid';                // v34: anywhere else in the box — move it, or swap
  }
  if(sel && sel.kind === 'dc'){
    const s = G.daycare[sel.idx];
    if(u && s && u.id === s.unit.id && unitLevel(u) < 3) return 'mergeable';   // v35: combine in the box
    return (!u && pcRoom(G) > 0) ? 'valid' : '';
  }
  if(sel && sel.kind === 'mart'){                // medicine, candy, stones and held items work on the PC too
    const s = G.mart[sel.idx];
    return (u && s && (s.held || canUseItem(s.id, u))) ? 'valid' : '';
  }
  if(sel && sel.kind === 'team') return (!u && pcRoom(G) > 0) || u ? 'valid' : '';   // store it, or swap with this one
  return '';
}

/* The box, Gen 3-5 style: sprites sit straight on the wallpaper with a soft
   shadow and no frame each. Everything else about a pokémon lives in the
   popup, which is what stops twelve of these fighting for room. */
function pcHtml(){
  let cells = '';
  const last = Math.max(pcCap(G), ...G.pc.map(u => u.box + 1));
  for(let i = 0; i < last; i++){
    const u = pcAt(G, i);
    const cls = pcSlotClass(i);
    if(!u){
      cells += `<span class="cell empty ${cls}" data-act="pc" data-i="${i}"></span>`;
      continue;
    }
    const ready = pcCanMerge(G, pcIdx(G, i));
    const f = hpFracOf(G, u);
    cells += `<button class="cell ${cls} ${ready ? 'ready' : ''} ${f === 0 ? 'fainted' : ''}" data-act="pc" data-i="${i}"
      data-pop="pc:${i}" title="${esc(u.nm)}${f === 0 ? ' — fainted' : f < 1 ? ` — ${Math.round(f*100)}% HP` : ''}">
      ${SPRITES[u.id] ? `<img src="${SPRITES[u.id]}" alt="${esc(u.nm)}">`
                      : `<span class="letters">${esc(u.nm.slice(0,2))}</span>`}
      ${isLegend(u) ? '<i class="clv leg">★</i>' : unitLevel(u) > 1 ? `<i class="clv">L${unitLevel(u)}</i>` : ''}
      ${ready ? `<i class="cready" title="${pcTwinInBox(G, pcIdx(G, i)) >= 0
        ? 'another copy is in the box' : 'a party member can take this copy'}">＋</i>` : ''}
      ${heldBadge(u, 'pc', i, 'mini')}
      ${f > 0 && f < 1 ? `<i class="cwound"><u style="width:${f*100}%"></u></i>` : ''}
    </button>`;
  }
  return `<div class="wall">${cells}</div>`;
}

/* The Bag: the same idea as the box, one floor down and a different pocket.
   Four slots, items only, and picking one up works exactly like picking up a
   pokémon — tap it, then tap whoever should carry it. */
function bagHtml(){
  let cells = '';
  for(let i = 0; i < Math.max(bagCap(G), G.bag.length); i++){
    const id = G.bag[i];
    if(!id){
      cells += `<span class="bcell empty"></span>`;
      continue;
    }
    const d = HELD_ITEMS[id];
    const on = sel && sel.kind === 'bag' && sel.idx === i;
    cells += `<button class="bcell ${on ? 'lifted' : ''}" data-act="bag" data-i="${i}"
      data-bagpop="${i}" title="${esc(d.name)}">${itemGlyph(id, d.icon)}</button>`;
  }
  return `<h2 class="sep bagttl">Bag <span class="sub">${G.bag.length}/${bagCap(G)} held items</span></h2>
    <div class="wall bag">${cells}</div>`;
}

/* ===================================================================
   THE SUMMARY — since v43 it is drawn only in the message box (#inspect).
   popupHtml() builds it; the old floating card and its hover/double tap are gone.
   =================================================================== */
let popupEl = null;
const wideScreen = () => window.matchMedia('(min-width: 700px)').matches;
const finePointer = () => window.matchMedia('(hover: hover) and (pointer: fine)').matches;

/* Popups are addressed by LOCATION ("pc:3"), not by uid. Two pokémon sharing
   a uid used to make one popup show the other; a location can only ever hold
   one of them. */
function unitAtRef(ref){
  if(!ref) return null;
  const [where, n] = String(ref).split(':');
  const i = +n;
  if(where === 'team') return teamAt(G, i);
  if(where === 'pc')   return pcAt(G, i);
  if(where === 'dc'){ const s = G.daycare[i]; return s && !s.bought ? s.unit : null; }
  return null;
}

/* Bar maxima are DERIVED from the roster, not typed in. They were typed in
   (70 / 24 / 140) and the stat rescale silently pegged every attack bar at
   100% — attack now reaches 63 — while speed bars stopped passing 62%. A
   number that has to track another number should be computed from it. */
const BAR_MAX = (() => {
  const top = stat => Math.max(...Object.keys(SPECIES).filter(k => !SPECIES[k].legendary).map(k => SPECIES[k][stat]));   // 2.1.0: a legendary's bar may run full
  return { hp: Math.round(top('hp') * 1.12),
           atk: Math.round(top('atk') * 1.12),
           spd: Math.round(top('spd') * 1.12) };
})();

function statBar(label, value, max, colour, bonus){
  const w = Math.max(3, Math.min(100, Math.round(value / max * 100)));
  // the slice of the bar that comes from an item, drawn lighter on the end
  const bw = bonus > 0 ? Math.max(2, Math.min(w, Math.round(bonus / max * 100))) : 0;
  // v51: an item can cost a stat too (Choice Band's Speed) — shown in red, no hatching
  return `<div class="sb"><label>${label}</label>
    <i class="sbar"><u style="width:${w}%;background:${colour}"></u>${
      bw ? `<em style="width:${bw}%;left:${w - bw}%"></em>` : ''}</i><b>${value}${
      bonus > 0 ? `<i class="sbon">+${bonus}</i>` : bonus < 0 ? `<i class="sbon neg">−${-bonus}</i>` : ''}</b></div>`;
}

/* Speed decides how OFTEN a pokémon acts, and a raw "»61" cannot tell you
   whether that is fast — fast is only ever relative to the rest of your party.
   These three turn the stat into the sentence a player actually needs, and all
   of them read the engine's clock rather than a second copy of the maths. */
const PACE_TIERS = [[0.75,'Sluggish','p1'], [0.95,'Steady','p2'],
                    [1.2,'Brisk','p3'],     [Infinity,'Blistering','p4']];
const paceTier = r => PACE_TIERS.find(([lim]) => r < lim);
const RANK_WORD = ['fastest','2nd fastest','3rd fastest','4th fastest','5th fastest','6th fastest'];

/* The same fact, at the moment of the decision. In the Daycare the question
   is never "is 61 fast" but "where would this one slot into my team", so the
   row answers that one instead. */
function dcPaceHtml(u){
  const team = (G.team || []).filter(Boolean);
  if(!team.length) return '';
  const r = paceVs(u, team);
  if(r == null) return '';
  return `<span class="dpace ${paceTier(r)[2]}"
    title="acts ${r.toFixed(2)}\u00d7 as often as your party average">
    ${RANK_WORD[Math.min(5, paceRank(u, team))]}</span>`;
}

/* The rate line under the stat bars. Hidden with an empty party: "1.00x your
   average" compared against nothing but itself is noise, not information. */
function paceLineHtml(u){
  const team = (G.team || []).filter(Boolean);
  if(team.length < 2) return '';
  const r = paceVs(u, team);
  if(r == null) return '';
  const [, word, cls] = paceTier(r);
  const mine = team.includes(u);
  return `<div class="paceline"><span class="pacechip ${cls}">${word}</span>
    <span>Acts <b>${r.toFixed(2)}\u00d7</b> as often as your party average</span>
    ${mine ? '' : `<span class="pacerank">would be your ${RANK_WORD[Math.min(5, paceRank(u, team))]}</span>`}
  </div>`;
}

/** Mid-gauntlet only: what this pokémon has left, in words. */
function woundLineHtml(u){
  if(!inGauntlet(G)) return '';
  const f = hpFracOf(G, u);
  if(f >= 1) return '';
  const resting = (G.pc || []).includes(u);
  return f === 0
    ? `<div class="popwound ko">Fainted — out until the Elite Four is over. Resting doesn't revive.</div>`
    : `<div class="popwound">${Math.round(effHp(u) * f)} / ${effHp(u)} HP — ${resting
        ? `resting: +${Math.round(TUNING.benchRest * 100)}% for each fight it sits out.`
        : 'carried from the last fight.'}</div>`;
}

/* Vitamins taken, out of the per-pokémon cap. Only shown once it has had some. */
function vitLineHtml(u){
  const ids = ['protein','hpup','carbos'].filter(k => vitaminsTaken(u, k));
  const egg = u.eggTicks || 0;          // Lucky Egg rounds count toward a cap too
  if(!ids.length && !egg) return '';
  return `<div class="popvit">${ids.map(k => {
    const n = vitaminsTaken(u, k), full = n >= TUNING.vitaminCap;
    return `<span class="${full ? 'full' : ''}">${itemGlyph(k, ITEMS[k].icon)} ${esc(ITEMS[k].name)} ${n}/${TUNING.vitaminCap}</span>`;
  }).join('')}${egg ? `<span class="${egg >= TUNING.eggCap ? 'full' : ''}">${itemGlyph('egg', HELD_ITEMS.egg.icon)} Lucky Egg ${egg}/${TUNING.eggCap}</span>` : ''}</div>`;
}

/* 2.2.0 (Sean): the summary shows the EXP pips too — the PC grid has no room
   for them, so this is where you check how close a stored pokémon is. */
function popPipsHtml(u){
  const l = unitLevel(u);
  if(l >= 3) return '<span class="poppips max">max</span>';
  const p = expPipsToNext(u), left = p.need - p.have;
  let h = '';
  for(let i = 0; i < p.need; i++) h += `<i class="${i < p.have ? 'on' : ''}"></i>`;
  return `<span class="poppips" title="${left} more cop${left === 1 ? 'y' : 'ies'} (or Rare Cand${left === 1 ? 'y' : 'ies'}) to reach Lv ${l + 1}">${h}</span>`;
}
function popupHtml(u){
  const sp = SPECIES[u.id], l = unitLevel(u), t = TYPES[sp.type];
  const hs = heldStats(u);
  const h = heldOf(u);
  /* The item's own share of each stat is called out on the bar, so you can see
     what you'd be giving up by taking it off. */
  const itemBlock = !h ? '' : `
    <div class="popheld ${h.when && !h.when(u) ? 'off' : ''}">
      <span class="hicon">${itemGlyph(u.held, h.icon)}</span>
      <div>
        <b>${esc(h.name)}<i class="hkind ${h.kind}">${esc(h.kind)}</i></b>
        <p>${esc(h.text)}</p>
        ${h.when && !h.when(u)
          ? `<p class="hoff">${esc(h.offText || 'No effect on this pokémon.')}</p>` : ''}
      </div>
    </div>`;
  return `<div class="pcol a"><div class="pophead">
      <div class="popart" style="--tcol:${typeColor(u.id)}">
        ${SPRITES[u.id] ? `<img src="${SPRITES[u.id]}" alt="">` : esc(sp.name.slice(0,2))}
        ${heldBadge(u, null, null, 'pop')}</div>
      <div><div class="popname">${esc(sp.name)}</div>
        <span class="poptype" style="background:${typeColor(u.id)}">${esc(sp.type)}</span>
        ${roleChip(u.id)}
        ${sp.legendary ? '<span class="poplv legend">★ Legendary</span>' : `<span class="poplv">Lv ${l}</span>${popPipsHtml(u)}`}</div>
    </div>
    <div class="popbars">
      ${statBar('HP',  effHp(u),  BAR_MAX.hp,  'var(--hp)',  hs.hp)}
      ${statBar('ATK', effAtk(u), BAR_MAX.atk, 'var(--atk)', hs.atk + (u.tmpAtk||0))}
      ${statBar('SPD', effSpd(u), BAR_MAX.spd, 'var(--spd)', hs.spd + (u.tmpSpd||0))}
    </div>
    ${paceLineHtml(u)}
    ${woundLineHtml(u)}
    ${itemBlock}
    ${vitLineHtml(u)}
    </div><div class="pcol b">
    <div class="popmove"><b>${esc(sp.move.name)}</b> <i class="trig">Main move</i><p>${esc(sp.move.text(l))}</p></div>
    ${move2Html(sp, l, null, heldOf(u) && heldOf(u).lockMain ? heldOf(u).name : null)}
    <div class="poprole r-${roleOf(u.id)}"><b>${ROLES[roleOf(u.id)].icon} ${esc(ROLES[roleOf(u.id)].name)} · ${esc(ROLES[roleOf(u.id)].trait)}</b>
      <p>${esc(ROLES[roleOf(u.id)].text())}</p></div>
    <div class="popmu">
      ${t.weak.length ? `<span class="bad">weak to ${t.weak.join(', ')} ×2</span>` : ''}
      ${t.resist.length ? `<span class="good">resists ${t.resist.join(', ')} ×½</span>` : ''}
    </div>
    ${evoLineHtml(u.id)}</div>`;
}

function hidePopup(){ if(popupEl) popupEl.hidden = true; }

/* 3.7.0 · FIRST-RUN TIPS — one short card at a time, each shown once, in the
   order you meet the thing it explains. START → Options → Tips hides them or
   shows them again. Browser test runs don't see them unless window.PKB_TIPS. */
const TIPS = (() => {
  const KEY = 'pkb_tipsSeen';
  const LIST = [
    { id:'shop',   when: () => true,
      title:'Welcome, Trainer!', text:'Tap a pokémon in the Daycare, then tap an empty spot in your party to buy it. You earn more ₽ after every battle.' },
    { id:'inspect', when: g => g.team.length >= 1,
      title:'Tap to inspect', text:'Tap any pokémon — yours, the Daycare’s, a scouting report’s, or either side in a battle — to see its moves, role and matchups.' },
    { id:'merge',  when: g => g.turn >= 2,
      title:'Three of a kind', text:'Three copies of the same pokémon make it level 2, six make it level 3 — and levelling up evolves it. Drop a copy onto the one you have.' },
    { id:'roles',  when: g => g.team.length >= 3,
      title:'Front rank takes the hits', text:'The badge on each picture is its role. Tanks go in front and Cannons at the back — “Line up by role” does it for you.' },
    { id:'boss',   when: g => { const n = nextUp(g); return !!(n && n.boss); },
      title:'A gym leader is next', text:'Their card shows their type and team style. Lose and you keep a scouting report of exactly what they fielded for the rematch.' },
  ];
  const seen = () => { try{ return JSON.parse(localStorage.getItem(KEY) || '[]') || []; }catch(e){ return []; } };
  const allowed = () => (!navigator.webdriver || window.PKB_TIPS) && PREF.get('tips', 'on') !== 'off';
  function current(g){
    if(!g || !allowed() || g.over) return null;
    const s = seen();
    return LIST.find(t => !s.includes(t.id) && t.when(g)) || null;
  }
  function dismiss(id){ const s = seen(); if(!s.includes(id)) s.push(id); try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
  function reset(){ try{ localStorage.removeItem(KEY); }catch(e){} }
  function html(g){
    const t = current(g); if(!t) return '';
    return `<div class="tipcard" role="note"><span class="tipicon">💡</span><div><b>${esc(t.title)}</b><p>${esc(t.text)}</p></div>
      <button class="btn tipok" data-act="tipok" data-tip="${t.id}">Got it</button></div>`;
  }
  return { html, dismiss, reset, current, LIST };
})();

/* 3.7.0 · TAP TO INSPECT, EVERYWHERE — the same summary card for pokémon
   that aren't yours: the scouting report, both sides of a battle, and the
   team on the run-over screen. */
function openUnitCard(u, note){
  if(!u || !SPECIES[u.id]) return;
  SFX.play('open');
  const d = modal(`${note ? `<p class="ucnote">${note}</p>` : ''}<div class="isum ucard">${popupHtml(u)}</div>
    <div class="btnrow"><button class="btn primary" data-m="close">Close</button></div>`);
  d.classList.add('unitcard');
  d.querySelector('[data-m="close"]').onclick = () => { SFX.play('back'); d.remove(); };
}
function openFighterCard(F){
  if(!battle || !F) return;
  const mine = F.side === 'p';
  const src = mine ? (G.team || []).concat(G.pc || []).find(x => x && x.uid === F.uid)
                   : ((battle.opp && battle.opp.team) || []).find(x => x && x.uid === F.uid);
  const u = src || { id:F.id, exp:0, hp:F.maxHp, atk:F.atk, spd:F.spd };
  openUnitCard(u, mine ? 'Your pokémon' : esc(battle.oppName || 'Opponent'));
}

/* ===================================================================
   THE PICK-UP CURSOR
   Lifting a pokémon shows it riding the pointer on a mouse, or as a bar
   along the bottom on a touch screen where a finger would cover it.
   =================================================================== */
let carryEl = null;
function updateCarry(){
  if(!carryEl){
    carryEl = document.createElement('div');
    carryEl.className = 'carry';
    carryEl.hidden = true;
    document.body.appendChild(carryEl);
  }
  const held = heldUnit();
  const item = heldItem();
  document.body.classList.toggle('carrying', !!(held || item));
  // the contextual bar is pinned to the bottom on touch; the sheet has to
  // sit above it or the buttons you need are behind the thing describing them
  document.body.classList.toggle('picking', !!sel);
  if(!held && !item){ carryEl.hidden = true; return; }
  carryEl.hidden = false;
  carryEl.classList.toggle('pinned', !finePointer());
  // 2.2.1: start ON the pointer — never at a stale or default spot — and stay hidden
  // until the page has seen the pointer at all
  if(finePointer()) placeCarry();
  const verb = finePointer() ? 'click' : 'tap';
  const ch = held
    ? `${SPRITES[held.id] ? `<img src="${SPRITES[held.id]}" alt="">` : ''}
       <span>${esc(held.nm)}</span>
       <em>${verb} a slot</em>`
    : `<span class="carryitem">${itemGlyph(item.id, item.def.icon)}</span>
       <span>${esc(item.def.name)}</span>
       <em>${verb} a pokémon</em>`;
  if(carryEl.dataset.was !== ch){ carryEl.dataset.was = ch; carryEl.innerHTML = ch; }   // v49: no re-decode on every tap
}
/** A Bag item on the cursor, so a phone shows what it is carrying. */
function heldItem(){
  if(!sel || sel.kind !== 'bag') return null;
  const id = G.bag[sel.idx];
  return id && HELD_ITEMS[id] ? { id, def: HELD_ITEMS[id] } : null;
}
/** Whatever the cursor is currently holding, if anything. */
function heldUnit(){
  if(!sel) return null;
  if(sel.kind === 'pc')   return pcAt(G, sel.idx);
  if(sel.kind === 'team') return teamAt(G, sel.idx);
  if(sel.kind === 'dc'){ const s = G.daycare[sel.idx]; return s && !s.bought ? s.unit : null; }
  return null;
}

/* ---------------- inspector ---------------------------------------- *//* ---------------- inspector ---------------------------------------- */
function matchupHtml(type){
  const t = TYPES[type]; if(!t) return '';
  return (t.weak.length ? `<span class="mu bad">weak to ${t.weak.join(', ')} ×2</span>` : '')
       + (t.resist.length ? `<span class="mu good">resists ${t.resist.join(', ')} ×½</span>` : '');
}

/** The pokémon's whole evolution line, with the current stage marked. */
/** How `child` is reached from its parent: { by, stone } (1.3.0: branch-aware). */
const evoStep = child => { const p = evoParent(child); return p ? evoNext(p).find(n => n.into === child) : null; };
const stageArrow = step => `<span class="arr">${step.by === 'stone' ? itemGlyph(step.stone, ITEMS[step.stone].icon) : '→'}</span>`;
function evoLineHtml(id){
  const line = evoLine(id), nx = evoNext(id);
  if(line.length < 2 && !nx.length) return '<span class="mu">does not evolve — levels up into bigger stats</span>';
  const parts = line.map((k,i) => {
    const step = i > 0 ? evoStep(k) : null;
    return (step ? stageArrow(step) : '') + `<span class="stage ${k === id ? 'now' : ''}">${esc(SPECIES[k].name)}</span>`;
  }).join('');
  // a branching line (Eevee): every way it can go, each with its stone
  const branches = nx.length > 1 ? `<span class="arr">→</span>` + nx.map(n =>
    `<span class="stage branch">${itemGlyph(n.stone, ITEMS[n.stone].icon)} ${esc(SPECIES[n.into].name)}</span>`).join('<span class="arr">/</span>') : '';
  const how = !nx.length ? 'final form'
    : nx.length > 1 ? `a ${nx.map(n => ITEMS[n.stone].name.replace(' Stone', '')).join(', ').replace(/, ([^,]*)$/, ' or $1')} Stone decides what it becomes`
    : nx[0].by === 'stone' ? `needs a ${ITEMS[nx[0].stone].name}`
    : 'evolves on its next level up';
  return `<div class="line">${parts}${branches}</div><span class="mu">${how}</span>`;
}

/* v49: a message floats at the top of the screen instead of replacing the
   summary, so the page under it keeps its shape. */
const toastHtml = () => toast ? `<div class="toastbox" role="status"><b>${esc(toast)}</b></div>` : '';
/* 1.5.0: what a stone would do to the pokémon you own — before you buy it.
   For Eevee this is the whole point: the stone picks the evolution. */
function stonePreview(stone){
  const out = [];
  for(const [where, list] of [['party', G.team || []], ['PC', G.pc || []]]) for(const u of list){
    if(!u || !canUseItem(stone, u)) continue;
    const n = evoNext(u.id).find(x => x.stone === stone);
    if(n) out.push({ u, where, into: n.into });
  }
  return out;
}
const miniSprite = id => SPRITES[id] ? `<img class="pix" src="${SPRITES[id]}" alt="">` : '';
function stonePreviewHtml(stone){
  const list = stonePreview(stone);
  if(!list.length) return '';
  return `<div class="sprevs">${list.map(({ u, where, into }) => {
    const a = SPECIES[u.id], b = SPECIES[into], d = k => b[k] - a[k];
    const sign = n => (n >= 0 ? '+' : '−') + Math.abs(n);
    return `<div class="sprev">${miniSprite(u.id)}<span>${esc(u.nm)} <i class="dim">(${where})</i></span><span class="arr">→</span>${miniSprite(into)}<b>${esc(b.name)}</b>
