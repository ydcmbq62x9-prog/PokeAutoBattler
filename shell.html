.tfield::before{left:12%;width:26px}
.tfield::after{right:18%;top:28%;width:18px}
.tmon{position:absolute;left:50%;bottom:17%;width:clamp(112px,32vw,140px);height:clamp(112px,32vw,140px);transform:translateX(-50%)}
.tmon img{width:100%;height:100%;object-fit:contain;object-position:bottom;image-rendering:pixelated;transform:scaleX(-1);
  filter:drop-shadow(0 3px 0 rgba(63,74,92,.25));animation:tbob 1.6s steps(2) infinite}
.tmon.hop img{animation:thop .45s ease-out}
.twho{font-size:14px;color:var(--muted);min-height:1em}
.tpress{font:inherit;font-size:20px;font-weight:700;letter-spacing:3px;color:var(--edge);background:none;border:0;padding:10px 18px;cursor:pointer;
  animation:gbblink 1.1s steps(1) infinite}
.tpress:focus,.tmi:focus{outline:none}
/* 2.2.1 (Sean): the ▶ arrow is the only selection marker — no dashed focus box beside it */
.tmi:focus-visible{outline:none}
.tmenu{width:min(300px,100%);display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--panel);
  border:3px solid var(--edge);border-radius:10px;box-shadow:var(--gbbox);text-align:left}
.tmenu[hidden],.tpress[hidden]{display:none!important}
.tmi{font:inherit;font-size:18px;font-weight:700;letter-spacing:1.5px;color:var(--text);background:none;border:0;
  padding:6px 6px 6px 26px;text-align:left;cursor:pointer;position:relative;border-radius:6px}
.tmi small{display:block;font-size:12px;font-weight:500;letter-spacing:.3px;color:var(--muted);margin-top:1px}
.tmi.cur::before{content:'▶';position:absolute;left:6px;top:7px;font-size:14px;color:var(--edge)}
.tmi:disabled{opacity:.45;cursor:default}
.tmenu .yesno{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;padding-top:8px;border-top:2px dotted var(--line2);font-size:13px}
.tmenu .yesno span{flex:1 1 100%}
.tmenu .yesno .btn{flex:1;padding:6px 10px}
.tfoot{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim);margin-top:4px}
.tfoot span:first-child:not(:last-child){color:var(--muted)}
@keyframes tbob{50%{transform:scaleX(-1) translateY(-3px)}}
@keyframes thop{0%{transform:scaleX(-1)}40%{transform:scaleX(-1) translateY(-18px)}100%{transform:scaleX(-1)}}
@keyframes tdrop{0%{transform:translateY(-40px);opacity:0}70%{transform:translateY(4px);opacity:1}100%{transform:none}}
@keyframes tslide{0%{transform:translateX(120%)}100%{transform:translateX(-50%)}}
@keyframes tfade{from{opacity:0}to{opacity:1}}
.title .tlogo{animation:tdrop .6s ease-out both}
.title .tsub{animation:tfade .4s .45s both}
.title .tmon{animation:tslide .55s .35s cubic-bezier(.2,.8,.3,1) both}
.title .tpress{animation:tfade .3s .9s both,gbblink 1.1s 1.2s steps(1) infinite}
.title.still,.title.still *{animation:none!important}
.title.still .tpress{animation:none}
html.dark .title{background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 6px),var(--bg)}
html.dark .tlogo .t1,html.bc .tlogo .t1{color:#ff6b62;text-shadow:2px 2px 0 #0b0d13}
html.dark .tlogo .t2,html.bc .tlogo .t2{text-shadow:4px 4px 0 #8a6412}
html.dark .tfield,html.bc .tfield{background:
   radial-gradient(ellipse 60% 14% at 50% 80%,#3c5a40 0 70%,#2c4430 71% 100%,transparent 101%),
   linear-gradient(180deg,#26334d 0 55%,#2d3a30 55% 58%,#1f2a23 58%)}
html.dark .tfield::before,html.dark .tfield::after,html.bc .tfield::before,html.bc .tfield::after{background:#f3eed8;opacity:.25;box-shadow:10px -6px 0 #f3eed8,22px 0 0 #f3eed8}
@media (max-height:620px){ .tfield{height:140px} .tmon{width:100px;height:100px} .tlogo .t2{font-size:44px} .tscreen{gap:8px} }

/* ===================================================================
   v40 — POKéBALL WIPE (rolling iris)
   =================================================================== */
.wipe{position:fixed;left:0;right:0;top:-240px;bottom:-240px;z-index:90;pointer-events:auto;overflow:hidden}
/* 2.2.1: the dark shade is clipped to this box, and on some phones (iOS with the
   toolbar / home-bar area) a plain inset:0 stops short of the screen's bottom edge,
   leaving a pale strip. The box now runs 240px past the top and bottom — equally,
   so the iris still centres on the screen. */
.wiris{position:absolute;left:50%;top:50%;border-radius:50%;box-shadow:0 0 0 300vmax #22262f;transform:translate(-50%,-50%)}
.wiris.flat{inset:0;left:0;top:0;transform:none;border-radius:0;box-shadow:none;background:#22262f}
.wball{position:absolute;left:50%;top:50%;width:clamp(64px,16vw,84px);height:clamp(64px,16vw,84px);transform-origin:50% 50%;
  margin:calc(clamp(64px,16vw,84px) / -2) 0 0 calc(clamp(64px,16vw,84px) / -2)}
.wball svg{display:block;width:100%;height:100%}
.wiris.flat + .wball{display:none}

/* ===================================================================
   v42 — IRON OUT
   =================================================================== */
.queue .qmon.ghost{visibility:hidden}
#blog::before{content:'';position:sticky;top:-2px;display:block;height:22px;margin-bottom:-22px;z-index:1;pointer-events:none;
  background:linear-gradient(var(--panel),rgba(0,0,0,0))}
html:not(.dark) #blog::before{background:linear-gradient(var(--panel),rgba(251,248,236,0))}
html.dark #blog::before,html.bc #blog::before{background:linear-gradient(var(--panel),rgba(37,42,55,0))}
.overteam{flex-wrap:wrap;gap:6px}
.overteam .held{bottom:auto;top:-5px;right:-7px}
.shopbar .btn{white-space:nowrap}
.dexrow .tag{display:inline-block;border-radius:5px;padding:0 6px;margin-left:3px;font-size:11px;font-weight:700;line-height:1.55;vertical-align:2px;
  border:1.5px solid rgba(0,0,0,.18)}

/* ===================================================================
   v43 — IRON OUT 2
   =================================================================== */
/* Bold pixel text: Pixelify's heaviest weight closes up the small letters at
   game sizes ("Continue" ran together, C read as O). Only 400–600 are loaded,
   and the browser may not fake a heavier one, so bold lands on 600. */
html{font-synthesis-weight:none;font-synthesis:none}
.btn,.big-cta{letter-spacing:.6px}

/* role chips stay one line */
.rchip{white-space:nowrap;line-height:1.35;vertical-align:1px}
.drow .rchip{font-size:10px;padding:0 5px;margin-left:3px}

/* the party field: empty spots are only the disc; level pips show */
.pfield .slot.empty::before{content:none;display:none}
.pfield .exp{margin-top:10px;gap:3px;justify-content:center}
.pfield .exp i{width:7px;height:7px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1.5px var(--edge);opacity:.55}
.pfield .exp i.on{background:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold2);opacity:1}
html.dark .pfield .exp i,html.bc .pfield .exp i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--edge)}
html.dark .pfield .exp i.on,html.bc .pfield .exp i.on{background:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold2)}

/* one summary: the message box */
.isum{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media (min-width:700px){ .isum{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:0 20px} .isum .pcol.b .popmove:first-child{margin-top:0;border-top:0;padding-top:0} }
.isum .popart{width:52px;height:52px}
.isum .popname{font-size:17px}
.isum .line{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:8px 0 2px}
.isum .stage{font-size:12px;color:var(--dim)}
.isum .stage.now{color:var(--text);font-weight:bold;background:var(--panel2);border-radius:5px;padding:0 5px}
.isum .arr{color:var(--dim);font-size:11px}
.isum .mu{font-size:11px;color:var(--dim)}

/* the turn order row stays; at the end it shows who is left */
.queue.over .qmon{opacity:.75}

.isum.reveal{animation:isumroll .55s steps(11,end) both}
@keyframes isumroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
/* scroll bars don't change a list's width */
.dclist,.martlist,#blog,.clog{scrollbar-gutter:stable}

/* ===================================================================
   v45 — TWO FONTS
   Pixelify is a display face: at the sizes of descriptions, names and
   numbers its C read as O and B as G. Everything now reads in Nunito, and the
   pixel font is kept for what should look like a Game Boy: headings, buttons,
   labels, menus, the top bar, the fight's banners. Pixel text sits at 500 —
   heavier weights close the letters up.
   =================================================================== */
:root{ --read:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif; --font:var(--read) }
body{font-family:var(--read)}
button,input,textarea,select{font-family:inherit}
h1,h2,h3,h4,.panel h2,.modal h3,.dexh,.tcard h4,
.btn,.big-cta,.iconbtn,.speed .sp,.optseg .sp,.dexjump .sp,
.smi,.sdesc,.sver,.tmi,.tpress,.tlogo,.tsub,.twho,
.topbar .stat,.topbar .lbl,.stat.vs,
.speech .say b,.popname,.big,.ribbon,.introban b,.rankhead span,.rklbl,.qlbl,.pfield .lvl,
.optrow > span,.yesno span,.carry span,.tfoot,.vtag{font-family:var(--pix)}
h1,h2,h3,h4,.panel h2,.modal h3,.dexh,.tcard h4,.btn,.big-cta,.iconbtn,.speed .sp,.optseg .sp,.dexjump .sp,
.smi,.tmi,.tpress,.topbar .stat,.speech .say b,.popname,.big,.ribbon,.introban b,.rankhead span,.rklbl,.qlbl,.pfield .lvl,.carry span{font-weight:500!important}
.tlogo{font-weight:500}
.btn,.big-cta,.iconbtn{letter-spacing:.8px}
/* the reading face carries the weight now */
.drow b,.mtext b,.popmove b,.poprole b,.popheld b,#inspect b,.dexrow b,.abil b,.recs b,.facts b{font-weight:800}

/* ===================================================================
   v46 — FRAMES THAT DON'T SCROLL, SPRITES WITH ROOM
   The Game Boy frame is an inset shadow, and a box's own content paints over
   its inset shadow — so a scrolling box slid its text across its own border.
   The frame is now an outer box with a few pixels of padding, and only the
   inside scrolls.
   =================================================================== */
.blogbox{background:var(--panel);border:3px solid var(--edge);border-radius:10px;box-shadow:var(--gbbox);padding:5px 3px 5px 5px}
.blogbox #blog{border:0!important;box-shadow:none!important;background:transparent!important;border-radius:4px;padding:2px 6px 2px 7px;height:112px;margin:0}
.modal .box{padding:5px;overflow:hidden;display:flex;flex-direction:column;--boxpad:13px}
.modal .boxscroll{overflow:auto;padding:13px;min-height:0;flex:1 1 auto;border-radius:6px}
.modal.startmenu .box{padding:5px}
.modal.startmenu .boxscroll{padding:5px 3px 3px 5px;overflow:visible}

/* sprites get room inside their frames */
.qmon{width:38px;height:38px}
.qmon img{width:26px;height:26px}
.queue.shopq .qmon{width:32px;height:32px}
.queue.shopq .qmon img{width:21px;height:21px}
.queue.shopq{overflow:hidden}
@media (max-width:480px){ .queue.shopq .qmon:nth-child(n+8){display:none} }
.popart img{width:40px;height:40px}
.isum .popart img{width:38px;height:38px}
.carry img{width:28px;height:28px}
.speech .who img{max-width:84%;max-height:84%;object-fit:contain}
.tcard .tface img{width:74px;height:74px}

/* ===================================================================
   v47 — SMOOTH START MENU
   The menu used to slide in on four hard steps (steps(4)), which reads as
   dropped frames. It now glides on its own compositor layer,
   and the looping animations behind a pop-up pause while it is open so the
   page underneath stops repainting.
   =================================================================== */
.modal.startmenu{animation:none}
.modal.startmenu .box{animation:smin2 .18s cubic-bezier(.2,.8,.3,1) both;will-change:transform,opacity;contain:layout paint;backface-visibility:hidden}
@keyframes smin2{from{transform:translate3d(36px,0,0);opacity:0}to{transform:none;opacity:1}}
body:has(.modal) .btn.big-cta::after,body:has(.modal) .formation .unit .sprite img,
body:has(.modal) #inspect::after,body:has(.modal) .pfield .slot.selected .artwrap{animation-play-state:paused}

/* ===================================================================
   v48 — THE HOME-SCREEN APP
   Room for the notch and the home bar (env() is 0 everywhere else, so the
   artifact and the local file look the same as before). Opened from the home
   screen, iPhones draw the status bar over the page, so a slate strip sits
   behind it, like a Game Boy's bezel.
   =================================================================== */
#app{padding-top:calc(8px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal.startmenu{padding-top:calc(12px + env(safe-area-inset-top,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
html.standalone body::before{content:'';position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:#2b303b;z-index:95;pointer-events:none}
img{-webkit-touch-callout:none;-webkit-user-drag:none}
.ihelp{margin:4px 0 12px;padding-left:22px;line-height:1.6;color:var(--text);font-size:14.5px}
.ihelp li{margin:4px 0}
.ishare{display:inline-block;border:2px solid var(--edge);border-radius:5px;padding:0 5px;font-size:12px;vertical-align:1px}

/* ===================================================================
   v49 — STEADIER ON PHONES
   Messages float at the top instead of replacing the summary (no page jump),
   and the held-item badge on a summary picture is a corner badge again —
   the v46 sprite sizing (.popart img) was catching its icon too.
   =================================================================== */
.toastbox{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));z-index:80;pointer-events:none;
  transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;
  background:var(--panel);border:3px solid var(--edge);border-radius:10px;box-shadow:var(--gbbox);
  padding:8px 14px;font-size:14.5px;line-height:1.35;text-align:center;animation:toastin .16s ease-out both}
.toastbox b{color:var(--text);font-weight:800}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){ .toastbox{animation:none} }
.popart .held.pop{width:20px;height:20px;right:-6px;bottom:-6px;border-radius:6px}
.popart .held.pop img.pix,.isum .popart .held.pop img.pix{width:14px;height:14px;object-fit:contain;image-rendering:pixelated}

/* ===================================================================
   v50 — ITEM RARITY TAGS
   Common has no tag; the colour gets warmer as an item gets rarer.
   =================================================================== */
.rar{display:inline-block;font-style:normal;font-size:8.5px;letter-spacing:.8px;font-weight:800;margin-left:6px;vertical-align:1px;
  padding:1px 5px;border-radius:5px;line-height:1.35;white-space:nowrap}
.rar.r-uncommon{color:#fff;background:#2e8f5a}
.rar.r-rare{color:#fff;background:#3a6fc9}
.rar.r-veryrare{color:#1b1406;background:linear-gradient(135deg,#ffe28a,#f0b43c)}
#inspect .rar{vertical-align:2px}

/* v51: an item that costs a stat shows the cost in red */
.sb b .sbon.neg,html .sb b .sbon.neg{color:var(--bad,#c0392b)}
.stats .xdown,html .stats .xdown{color:#c0392b;text-shadow:none}
html.dark .stats .xdown,html.bc .stats .xdown{color:#ff8e96}

/* v52: a second move a Choice Band has locked out */
.popmove.locked b,.popmove.locked p{text-decoration:line-through;opacity:.55}
.popmove.locked .trig{opacity:.55}
.popmove .lockby{display:block;font-size:10.5px;font-weight:700;color:var(--bad);margin-top:1px}

/* ===================================================================
   v54 — RARITY SPARKLE
   A Rare / Very rare item landing on the shelf gets a glow round its row and
   a shine sweeping across it, after the row has dealt in. The row's own
   animation (the deal) is untouched: the effect lives on ::before / ::after.
   =================================================================== */
.martrow.fx-rare,.martrow.fx-vrare{position:relative;isolation:isolate}
.martrow.fx-rare::before,.martrow.fx-vrare::before{content:'';position:absolute;inset:-2px;border-radius:11px;pointer-events:none;z-index:1;
  animation:rareglow 1.3s ease-out var(--sparkdelay,300ms) both}
.martrow.fx-rare::before{--glow:#3a6fc9}
.martrow.fx-vrare::before{--glow:#f0b43c;animation-duration:1.9s}
.martrow.fx-rare::after,.martrow.fx-vrare::after{content:'';position:absolute;inset:0;border-radius:9px;pointer-events:none;z-index:2;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.75) 46%,rgba(255,255,255,.95) 50%,rgba(255,255,255,.75) 54%,transparent 70%) no-repeat;
  background-size:250% 100%;background-position:130% 0;animation:rareshine .75s ease-in-out var(--sparkdelay,300ms) both}
.martrow.fx-vrare::after{background-image:linear-gradient(105deg,transparent 30%,rgba(255,236,170,.8) 46%,rgba(255,255,255,1) 50%,rgba(255,236,170,.8) 54%,transparent 70%);
  animation:rareshine .75s ease-in-out var(--sparkdelay,300ms) 2 both}
@keyframes rareglow{0%{box-shadow:0 0 0 0 var(--glow)}25%{box-shadow:0 0 0 3px var(--glow),0 0 16px 4px var(--glow)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes rareshine{from{background-position:130% 0}to{background-position:-30% 0}}
@media (prefers-reduced-motion:reduce){ .martrow.fx-rare::after,.martrow.fx-vrare::after{animation:none;opacity:0} .martrow.fx-rare::before,.martrow.fx-vrare::before{animation-duration:.01s} }
body.calm .martrow.fx-rare::after,body.calm .martrow.fx-vrare::after{animation:none;opacity:0}

/* ===================================================================
   1.3.0 — version under the title logo, dates in What's new, transfer codes,
   and Eevee's branching evolution line in the summary
   =================================================================== */
.tver{font-family:var(--pix);font-size:12px;letter-spacing:1px;color:var(--dim);margin-top:2px}
.title .tver{animation:tfade .4s .5s both}
.cdate{font-size:10.5px;color:var(--dim);font-weight:400;margin-left:4px;white-space:nowrap}
.modal.xfer h4{margin:14px 0 4px;font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.modal.xfer textarea{width:100%;min-height:74px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;word-break:break-all;box-sizing:border-box}
.modal.xfer .xmsg{color:var(--bad);font-size:12.5px;min-height:1em;margin:4px 0}
.modal.xfer .xconfirm p{font-size:13px}
.line .stage.branch{white-space:nowrap}
.line .stage.branch img.pix{width:14px;height:14px;vertical-align:-2px}

/* 1.4.1 — What's new: the date and tag are one unbreakable group */
.clog .cmeta{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;vertical-align:1px;margin-left:2px}
.clog .cmeta .cdate{margin-left:0}
.clog .cmeta .cnow,.clog .cmeta .cnew{margin-left:0;white-space:nowrap;line-height:1.5}

/* 1.5.0 — stone preview */
.mtext .mprev{display:block;margin-top:2px;font-size:10.5px;color:var(--text);font-weight:600}
.mtext .mprev b{font-weight:800;display:inline;font-size:inherit}
.mtext .mprev .mp{white-space:nowrap;display:inline-block;margin-right:8px}
.mtext .mprev img.pix,.sprev img.pix{width:18px;height:18px;vertical-align:-4px;image-rendering:pixelated;margin-right:2px}
.sprevs{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.sprev{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12.5px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.sprev .arr{color:var(--dim)}
.sprev .poptype{font-size:10px;padding:0 6px;border-radius:6px;color:#10131a;font-weight:700}
.sprev .rchip{font-size:10px}
.sprev .sdel{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}

/* ===================================================================
   2.0.0 — daily challenge, rules, legendaries, undo, recap, formations
   =================================================================== */
.modebar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 8px;padding:6px 10px;border:2px solid var(--edge);border-radius:10px;
  background:var(--panel);font-size:12.5px;box-shadow:var(--gbbox)}
.modechip{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;background:var(--edge);color:#fff;letter-spacing:.3px}
.btn.undo{align-self:center;font-size:13px;padding:6px 14px;min-height:0;background:var(--panel);border-style:dashed}
.btn.undo .dim{font-size:11px;margin-left:4px}
.panel.legend{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-color:#c98a12;
  background:linear-gradient(135deg,var(--panel) 60%,#f6e3b0);animation:legin .5s ease-out both}
html.dark .panel.legend,html.bc .panel.legend{background:linear-gradient(135deg,var(--panel) 60%,#4a3a14)}
@keyframes legin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.legart{width:64px;height:64px;flex:0 0 auto;border:2px solid var(--edge);border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--tcol) 35%,transparent),transparent 70%)}
.legart img{width:52px;height:52px;object-fit:contain;image-rendering:pixelated}
.legtext{flex:1;min-width:180px;display:flex;flex-direction:column;gap:3px}
.legtext b{font-size:15px;letter-spacing:.5px}
.legtext .poptype{font-size:10.5px;padding:0 6px;border-radius:6px;color:#10131a;font-weight:700}
.legbtns{display:flex;gap:8px;flex-wrap:wrap}
.panel.recap{margin-top:8px;padding:8px 10px}
.panel.recap summary{cursor:pointer;font-size:13px}
.recap .rhead,.recap .rrow{display:grid;grid-template-columns:minmax(90px,1.3fr) 1fr 1fr 44px 30px;gap:6px;align-items:center}
.recap .rhead{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:6px 0 2px}
.recap .rhead span:nth-child(n+4){text-align:right}
.recap .rrow{font-size:12px;padding:3px 0;border-top:1px dotted var(--line)}
.recap .rrow.down{opacity:.6}

.recap .rbar b{position:relative;font-size:10.5px;padding-left:4px;line-height:14px}
.recap .rnum{text-align:right;font-size:11.5px;color:var(--muted)}
.rtag{font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:.6px;padding:0 4px;border-radius:4px;color:#fff}

.modal.newrun .mods{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.modal.newrun .modt{text-align:left;display:flex;flex-direction:column;gap:1px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);cursor:pointer;font:inherit}
.modal.newrun .modt b{font-size:13.5px}
.modal.newrun .modt span{font-size:11.5px;color:var(--muted)}
.modal.newrun .modt.on{border-color:var(--edge);box-shadow:inset 0 0 0 2px var(--gold)}
.modal.newrun .modt.on b::before{content:'✓ ';color:var(--good)}
.modal.newrun .monotypes{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px 4px}
.modal.newrun .gens{display:flex;gap:6px;margin:6px 0 2px}
.modal.newrun .gent{flex:1;text-align:left;display:flex;flex-direction:column;gap:1px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);cursor:pointer;font:inherit;min-height:44px}
.modal.newrun .gent b{font-size:13.5px}
.modal.newrun .gent span{font-size:11.5px;color:var(--muted)}
.modal.newrun .gent.on{border-color:var(--edge);box-shadow:inset 0 0 0 2px var(--gold)}
.modal.newrun .gent.on b::before{content:'✓ ';color:var(--good)}
.modal.newrun .gent:disabled{opacity:.5;cursor:default}
.modal.newrun .gennote{margin:2px 2px 8px;font-size:11.5px}
.ntype[hidden]{display:none}
h4.genhead{margin:12px 0 4px}
.tag.gentag{background:#d9b44a;color:#10131a}
.dexfilt{flex-direction:column;gap:5px;padding-bottom:6px}
.dexseg{display:flex;gap:4px;flex-wrap:wrap}
.dexseg .sp{min-height:32px}
.dexseg .sp.on{background:var(--gold);color:#10131a;border-color:var(--edge)}
.modal.dex [hidden]{display:none!important}
/* ---- 4.1.0 · POKÉDEX grid + cards, Run Focus note, livelier title ---- */
.dexsearch{width:100%;box-sizing:border-box;margin:6px 0 2px;padding:9px 12px;border:2px solid var(--line2);border-radius:10px;background:var(--panel2);color:var(--text);font:inherit;font-size:14px}
.dexsearch:focus{outline:none;border-color:var(--gold)}
.dexcount{font-size:12px;font-weight:600;margin-left:6px}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:8px}
.dexfams{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.dexfam{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px;border:2px solid var(--line);border-radius:14px;background:var(--panel)}
.dexfam .dextile{width:92px;flex:0 0 auto}
.dexfam .farrow{color:var(--dim);font-size:18px;font-weight:700}
.dexfam[hidden],.farrow[hidden]{display:none!important}
.dextile{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;min-width:0;border:2px solid var(--line2);border-radius:12px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--tcol) 14%,var(--panel2)),var(--panel2));color:var(--text);font:inherit;cursor:pointer;transition:transform .12s,border-color .12s}
.dextile:hover,.dextile:focus-visible{border-color:var(--tcol);outline:none;transform:translateY(-2px)}
.dextile:active{transform:scale(.97)}
.dextile b{font-size:11.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dextile:not(.seen) .sprite{opacity:.8}
.dextile .tmeta{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim)}
.dextile .tmeta i{width:8px;height:8px;border-radius:50%;display:inline-block}
.dextile .tseen{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--good,#5cc97a);border:1px solid rgba(0,0,0,.35)}
.dextile[hidden]{display:none!important}
.sprite.tile{width:60px;height:60px}
.sprite.lg{width:88px;height:88px;border-radius:14px}
.modal.dexcardm{z-index:60}
.dcard .chead{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.dcard .chead h3{margin:0 0 4px;font-size:20px}
.dcard h4{margin:12px 0 4px}
.cbars{display:flex;flex-direction:column;gap:5px;margin:8px 0}
.cbar{display:grid;grid-template-columns:58px 1fr 34px;gap:8px;align-items:center;font-size:12px}
.cbar i{display:block;height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.cbar u{display:block;height:100%;border-radius:5px;text-decoration:none}
.cbar u.hp{background:#5cc97a}.cbar u.atk{background:#ef6a5a}.cbar u.spd{background:#4fb5f5}
.cbar b{text-align:right}
.cmoves .abil{margin:4px 0;font-size:12.5px;color:var(--muted)}
.cchain{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.cevo{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 7px;border:2px solid var(--line2);border-radius:10px;background:var(--panel2);color:var(--text);font:inherit;font-size:11px;cursor:pointer}
.cevo.me{border-color:var(--gold)}
.carrow{display:flex;flex-direction:column;align-items:center;font-size:16px;color:var(--dim);line-height:1}
.carrow small{font-size:9px;max-width:70px;text-align:center}
.cmu{display:flex;flex-direction:column;gap:3px;font-size:12px}
.runnote{margin:0 0 6px;padding:6px 9px;border:2px dashed var(--gold2,#e0a220);border-radius:10px;font-size:11.5px;line-height:1.5;background:color-mix(in srgb,var(--gold) 9%,transparent)}
.runnote b{color:var(--gold)}
.dfocus{font-style:normal;color:var(--gold);margin-left:5px;font-size:12px}
.tcloud{position:absolute;height:10px;border-radius:6px;background:#fff;opacity:.75;animation:tdrift 26s linear infinite}
.tcloud.c1{top:14%;left:-30px;width:34px}
.tcloud.c2{top:30%;left:-60px;width:24px;animation-duration:38s;animation-delay:-14s}
.tcloud.c3{top:8%;left:-40px;width:20px;animation-duration:31s;animation-delay:-22s}
@keyframes tdrift{to{transform:translateX(520px)}}
html.dark .tcloud,html.bc .tcloud{background:#f3eed8;opacity:.18}
.tside{position:absolute;bottom:15%;width:clamp(64px,19vw,84px);height:clamp(64px,19vw,84px);transform:translateX(-50%)}
.tside img{width:100%;height:100%;object-fit:contain;object-position:bottom;image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(63,74,92,.25));animation:tbob 1.6s steps(2) infinite}
.tside.l{left:20%}.tside.r{left:80%}.tside.r img{animation-delay:-.8s;transform:scaleX(-1)}
.tside.l img{transform:scaleX(-1)}
.title .tside{animation:tfade .5s .6s both}
.title.still .tside{animation:none}
.title.still .tcloud{animation:none}

.modal.newrun .ntype{font:inherit;font-size:12px;font-weight:700;padding:3px 10px;border-radius:8px;border:2px solid var(--c);background:transparent;color:var(--text);cursor:pointer}
.modal.newrun .ntype.on{background:var(--c);color:#10131a}
.modal .warn{color:var(--bad);font-size:13px}
.modal.newrun h4,.modal.daily h4{margin:12px 0 4px;font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.modal.daily .drules{border:2px solid var(--line);border-radius:10px;padding:4px 10px;background:var(--panel2)}
.modal.daily .drules p{font-size:13px;margin:4px 0 6px}
.modal.daily .dbtns{flex-wrap:wrap}
.modal .small{font-size:11.5px}
.tmi small{display:block}
/* 2.1.0 — legendaries: a gold star where the level badge goes */
.unit .lvl.leg{background:linear-gradient(135deg,#ffd76a,#e0a526);color:#4a3300;font-size:10px}
.poplv.legend{color:#e0a526;font-weight:700}
/* 2.2.0 — EXP pips on the summary */
.poppips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.poppips i{width:7px;height:7px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1.5px var(--edge);opacity:.55}
.poppips i.on{background:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold2);opacity:1}
.poppips.max{font-size:10px;color:var(--gold2);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.clv.leg{background:linear-gradient(135deg,#ffd76a,#e0a526);color:#4a3300}
/* 2.2.1 (Sean): the dock keeps one shape. On wide screens it was a flex row of
   [Undo][next-fight box][BATTLE], so a visible Undo squeezed the box to a narrow
   column (text wrapping over 5 lines) and stretched BATTLE to match. Undo now has its
   own row above; the box and BATTLE always sit side by side at the same height. The
   box also carried the .nextup top margin, so it sat 10px lower than BATTLE. */
.dock .speech{margin-top:0}
.dock .btn.undo{margin-bottom:0}
@media (min-width:620px){
  .dock{display:grid;grid-template-columns:minmax(0,1fr) 210px;column-gap:7px;row-gap:0;align-items:stretch}
  .dock .btn.undo{grid-column:1/-1;grid-row:1;justify-self:center;margin-bottom:7px}
  .dock .speech{grid-column:1;grid-row:2;flex:none;min-width:0}
  .dock .btn.fight{grid-column:2;grid-row:2;width:auto;min-width:0;max-height:none}
}
/* ===== 2.2.1 — phone pass ===== */
/* Small phones: the badge row (8 gems) ran into "NEXT TURN +25₽" — the gems shrink a little
   and "Next turn" shortens to "Next" (gone entirely below 340px) so both always fit. */
@media (max-width:400px){
  .stat.badges .pips{gap:2.5px}
  .stat.badges .pips .bdg{width:9px;height:9px}
  .tcol.tright .stat.next .lbl{font-size:0}
  .tcol.tright .stat.next .lbl::after{content:'Next';font-size:10.5px;letter-spacing:.4px}
}
@media (max-width:340px){ .tcol.tright .stat.next .lbl{display:none} }
/* Phones on their side: the START menu was taller than the screen and its last entries
   (Restart, Exit, the description) sat off the bottom. Tighter rows, and it scrolls if it must. */
@media (max-height:520px){
  .modal.startmenu .box{max-height:calc(100vh - 24px);overflow-y:auto;-webkit-overflow-scrolling:touch}
  .modal.startmenu .smi{padding-top:2px;padding-bottom:2px;font-size:16px}
  .modal.startmenu .sdesc,.modal.startmenu .yesno{min-height:0;margin-top:3px;padding-top:4px;font-size:12px}
  .modal.startmenu .smenu hr{margin:2px 0}
}
/* …and the battle field was 16:9 of the full width, taller than a landscape phone's screen, so the
   back row sat below the fold. It is now capped to what fits, centred. */
@media (orientation:landscape) and (max-height:520px){
  .stage,.bstage{width:min(100%,calc((100vh - 140px) * 16 / 9));margin-left:auto;margin-right:auto}
}
/* 2.3.0 — every What's new entry has a type as its title and a one-line summary under it */
.clog .csub{display:block;font-size:12px;color:var(--muted);margin:2px 0 1px 18px;line-height:1.35;font-weight:400}

/* ---- 2.4.0: the Hardcore Badge ---- */
.hcb{width:30px;height:30px;display:inline-block;vertical-align:middle;flex:none;object-fit:contain;image-rendering:pixelated}
.hcb.sm{width:18px;height:18px;margin:-3px 4px 0 0}
.smi .hcb.sm{margin:-3px 0 0 4px}
.hcb.big{width:58px;height:58px}
.hcb.locked{filter:grayscale(1) brightness(.75);opacity:.35}
.twho .thc{display:inline-block}
.twho .hcb.sm{width:22px;height:22px;margin-top:-4px}
.hcrow{display:flex;align-items:center;gap:10px;margin-top:8px;padding:7px 9px;border:2px dashed var(--line2);border-radius:8px}
.hcrow.on{border:2px solid #e0a526;background:color-mix(in srgb,#e0a526 14%,transparent)}
.hcrow .hcb{width:38px;height:38px}
.hcrow div{display:flex;flex-direction:column;min-width:0}
.hcrow b{font-size:14px;letter-spacing:.5px}
.hcrow span{font-size:12px;color:var(--muted);line-height:1.35}
.hcaward{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px auto 6px;padding:10px 14px;max-width:340px;
  border:2px solid #e0a526;border-radius:10px;background:color-mix(in srgb,#e0a526 14%,transparent);text-align:left;animation:pop .55s ease-out}
.hcaward div{display:flex;flex-direction:column}
.hcaward b{font-size:15px;letter-spacing:.5px;white-space:nowrap}
.hcaward span{font-size:13px;color:var(--muted)}
.hcnote{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:#b07a10;white-space:nowrap}
html.dark .hcnote,html.bc .hcnote{color:#f2c14e}
@media (prefers-reduced-motion:reduce){ .hcaward{animation:none} }

/* 3.0.0 · type chart (help) */
.tchart{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.tchart .trow{display:grid;grid-template-columns:78px 1fr;gap:2px 8px;align-items:start;font-size:11.5px;padding:5px 0;border-top:1px solid var(--line,rgba(128,128,128,.25))}
.tchart .trow .chip.big{grid-row:1 / span 2;align-self:center;text-align:center;font-size:11px}
.tchart .trow i{font-style:normal;font-weight:700;font-size:10.5px;margin-right:2px}
.tchart .trow i.bad{color:#d0533e}.tchart .trow i.good{color:#3f9a5a}
.tchart .trow .chip{display:inline-block;margin:1px 3px 1px 0;font-size:10px;padding:1px 6px}

/* ---- 3.7.0: first-run tips, unit cards everywhere, run summary ---- */
.tipcard{display:flex;align-items:flex-start;gap:10px;background:var(--panel);border:3px solid var(--gold2);border-radius:10px;
  box-shadow:var(--gbbox);padding:10px 12px;margin:0 0 10px;animation:tipin .35s ease-out}
.tipcard .tipicon{font-size:20px;line-height:1.2}
.tipcard div{flex:1;min-width:0}
.tipcard b{display:block;font-size:15px;margin-bottom:2px}
.tipcard p{margin:0;font-size:13.5px;line-height:1.4;color:var(--muted)}
.tipcard .tipok{align-self:center;flex:0 0 auto;min-height:36px}
@keyframes tipin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
body.calm .tipcard{animation:none}
.smon[data-act],.ftr,.overteam .slot[data-act]{cursor:pointer}
.smon[data-act]:active{transform:translateY(1px)}
.modal.unitcard .box{max-width:560px}
.ucnote{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.runsum{margin:14px auto 4px;max-width:560px;text-align:left}
.rsfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px}
.rsfacts span{display:flex;flex-direction:column;align-items:center;background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:7px 4px}
.rsfacts b{font-size:17px}
.rsfacts i{font-style:normal;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.rsmvp{display:flex;align-items:center;gap:12px;margin-top:10px;background:var(--panel);border:3px solid var(--gold2);border-radius:10px;padding:8px 12px;box-shadow:var(--gbbox)}
.rsmvp .rsart{width:64px;height:64px;flex:0 0 auto;display:grid;place-items:center}
.rsmvp .rsart img{max-width:100%;max-height:100%;image-rendering:pixelated}
.rsmvp div{display:flex;flex-direction:column;gap:2px;min-width:0}
.rsmvp b{font-size:17px}
.rsmvp .rtag{align-self:flex-start}
.rsrest{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13.5px}
.rsrest span{display:inline-flex;align-items:center;gap:4px}
.rsrest img{width:24px;height:24px;image-rendering:pixelated}
.ftr .fbody{pointer-events:auto}
.panel .shopbar:has([data-act="runimage"]){flex-wrap:wrap;justify-content:center}
.panel .shopbar:has([data-act="runimage"]) .btn{flex:1 1 150px}
/* 3.7.0 clean-up: comfortable tap targets for the small buttons phonepass flagged */
.optseg .sp{min-height:34px}
h2 .btn.arrange{min-height:30px;padding:4px 10px}
.optseg{flex-wrap:wrap}

/* 4.1.0: Red */
.rdb.sm{width:18px;height:18px}.twho .rdb.sm{width:22px;height:22px}
.hcrow.red{border-color:#d6342c;background:color-mix(in srgb,#d6342c 12%,transparent)}
.redend,.redstrip{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px auto 6px;padding:10px 14px;max-width:420px;
  border:2px solid #d6342c;border-radius:10px;text-align:left;background:linear-gradient(135deg,color-mix(in srgb,#ffd23a 26%,transparent),color-mix(in srgb,#d6342c 14%,transparent));animation:pop .55s ease-out}
.redend.lost{border-color:var(--line2);background:none}
.redend>div,.redstrip>div{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}

.redstrip{margin:8px 12px;max-width:none}
.rpika img{width:34px;height:34px;image-rendering:pixelated}
.award.redwin{border-color:#d6342c}
.speech.red{border-color:#d6342c}

/* 4.2.0: battle pause */
.pausebtn{flex:0 0 auto;min-width:42px;padding-inline:10px}
.pausebtn.on{background:var(--info);color:#07121f;border-color:var(--info)}
.stepbtn{flex:0 0 auto}
.bstage.paused::after{content:'PAUSED';position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:30;pointer-events:none;
  font-weight:900;font-size:11px;letter-spacing:2px;color:#07121f;background:rgba(255,255,255,.85);border-radius:20px;padding:2px 12px}
@media(max-width:420px){ .shopbar .stepbtn{min-width:70px;padding-inline:6px;font-size:12px} .shopbar .btn[data-act="skip"]{min-width:78px;padding-inline:6px} }
.modt.off{opacity:.45}
.tkt{font-style:normal;color:var(--gold,#e0a526);font-weight:800;margin-left:4px}
.bossart.silhouette img{filter:brightness(0) contrast(1);opacity:.55}
.secteam{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
/* 4.9.0 run history */
.hlist{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.hrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border:2px solid var(--line);border-radius:10px;background:var(--panel2)}
.hrow.won{border-color:var(--gold)}
.hrow .hteam{display:flex;flex:0 0 auto;max-width:58%;overflow:hidden;zoom:.8}
.hrow .hteam .spr,.hrow .hteam img,.hrow .hteam svg{width:26px;height:26px}
.hrow .hinfo{display:flex;flex-direction:column;min-width:0;font-size:13px}

/* 4.9.1 — phone and desktop layout fixes */
.ghostb,.ghostq{visibility:hidden;pointer-events:none}
.speechflow{display:none}
.dock .fopp,.legdock{display:none}
.dock .btn.fight small{font-size:.62em;opacity:.85;letter-spacing:0;text-transform:none;font-weight:600}
@media (max-width:700px){
  .dock .speech{display:none}
  .speechflow{display:block}
  .dock .fopp{display:inline}
  .dock{display:flex;flex-direction:column;align-items:stretch}
  .dock .btn.fight,.dock .btn.undo{grid-column:auto;grid-row:auto;width:100%;min-width:0}
  .dock .btn.undo{width:auto;align-self:center;margin-bottom:0}
  .dock .btn.fight{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dock{gap:5px;padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  .legdock{display:flex;align-items:center;gap:6px;padding:5px 8px;border:2px solid var(--gold);border-radius:10px;background:var(--panel);box-shadow:var(--gbbox)}
  .legdock span{flex:1;min-width:0;font-size:13px;line-height:1.2}
  .legdock .btn{min-height:34px;padding:4px 10px;font-size:13px;flex:none;width:auto}
}
@media (max-width:700px) and (orientation:portrait){
  #app:has(.arena){min-height:100vh;min-height:100dvh}

/* =====================================================================
   4.13.0 · THE BOARD — both teams as tiles in their real formation.
   Wide: yours on the left, ranks as columns (front nearest the middle).
   .vert (a field under 620px, set from JS): the enemy on top, yours below.
   The effects layer is unchanged: it reads where each tile's sprite is.
   ===================================================================== */
.bstage.board{aspect-ratio:16/9;--tp:63,140,224;--te:224,71,63}
.bstage.board.vert{aspect-ratio:4/5}
.bstage.board .rklbl{display:none}
/* surfaces: a field, dusk, the gym floor in its leader's colour, the League hall */
.bstage.board.bg-route .ground{background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 4cqw,transparent 4cqw 8cqw),
  radial-gradient(70% 60% at 50% 50%,#5e9e4e,#3f7a37 70%,#2f622b)}
.bstage.board.bg-route::after{display:none}
.bstage.board.bg-dusk .ground{background:
  radial-gradient(60% 50% at 50% 50%,rgba(240,154,106,.35),transparent 70%),
  linear-gradient(135deg,#3a2a5e,#6e3d6e 45%,#4a5a3e)}
.bstage.board.bg-gym .ground{background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.10) 0 1px,transparent 1px 8cqw),
  repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 8cqw),
  radial-gradient(70% 60% at 50% 50%,color-mix(in srgb,var(--gymc) 55%,#5a5446),color-mix(in srgb,var(--gymc) 30%,#262a36))}
.bstage.board.bg-league .ground{background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 10cqw),
  radial-gradient(60% 50% at 50% 50%,rgba(160,120,255,.35),transparent 70%),
  linear-gradient(160deg,#15122c,#2a2152 50%,#1d1840)}
.bstage.board .midline{left:50%;top:4%;bottom:4%;width:3px;transform:translateX(-50%);opacity:.6;
  background:repeating-linear-gradient(180deg,#ffd23a 0 10px,transparent 10px 18px)}
.bstage.board.vert .midline{left:4%;right:4%;top:50%;bottom:auto;width:auto;height:3px;transform:translateY(-50%);
  background:repeating-linear-gradient(90deg,#ffd23a 0 10px,transparent 10px 18px)}

/* slots and tiles share one grid of positions */
.bstage.board .slotmark,.bstage.board .ftr{position:absolute;width:14.5%;height:39%;border-radius:10px;transform:none}
.bstage.board .slotmark{border:2px dashed rgba(255,255,255,.14);z-index:1}
.bstage.board .f0{top:9%} .bstage.board .f1{top:55%}
.bstage.board .p.r0{left:33.5%} .bstage.board .p.r1{left:18%} .bstage.board .p.r2{left:2.5%}
.bstage.board .e.r0{left:52%}   .bstage.board .e.r1{left:67.5%} .bstage.board .e.r2{left:83%}
.bstage.board.vert .slotmark,.bstage.board.vert .ftr{width:47%;height:14.6%}
.bstage.board.vert .f0{left:2%} .bstage.board.vert .f1{left:51%}
.bstage.board.vert .e.r2{top:1.5%} .bstage.board.vert .e.r1{top:16.8%} .bstage.board.vert .e.r0{top:32.1%}
.bstage.board.vert .p.r0{top:53.3%} .bstage.board.vert .p.r1{top:68.6%} .bstage.board.vert .p.r2{top:83.9%}

.bstage.board .ftr{z-index:3;pointer-events:auto;display:block;
  background:linear-gradient(160deg,rgba(var(--t),.34),rgba(16,20,32,.62));border:2px solid rgba(var(--t),.75);
  box-shadow:0 2px 0 rgba(0,0,0,.25);transition:box-shadow .2s,border-color .2s}
.bstage.board .ftr.p{--t:var(--tp)} .bstage.board .ftr.e{--t:var(--te)}
.bstage.board .ftr .fmove{width:100%;height:100%;display:grid;grid-template-areas:"art" "head";grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);
  align-items:stretch;justify-items:stretch;padding:4px 6px 5px;box-sizing:border-box;gap:2px}
.bstage.board .ftr .fbody{grid-area:art;min-height:0;display:flex;justify-content:center;pointer-events:auto}
.bstage.board .ftr .fart{width:auto;height:100%;max-width:100%;max-height:100%;aspect-ratio:1}
.bstage.board .ftr .fhead{grid-area:head;align-items:stretch;margin:0;gap:2px;min-width:0}
.bstage.board .ftr .fname{display:block;font-size:max(10px,1.25cqw);text-align:center;overflow:hidden;text-overflow:ellipsis;color:#eef2fb}
.bstage.board .ftr .fhp{width:100%;height:6px}
.bstage.board .ftr .fchips{justify-content:center;min-height:13px}
.bstage.board.vert .ftr .fmove{grid-template-areas:"art head";grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr);padding:3px 7px 3px 3px;gap:6px}
.bstage.board.vert .ftr .fhead{justify-content:center}
.bstage.board.vert .ftr .fname{font-size:max(11px,3.5cqw);text-align:left}
.bstage.board.vert .ftr .fchips{justify-content:flex-start}
.bstage.board .fshadow{display:none}
.bstage.board .ftr.acting{border-color:#ffd23a;box-shadow:0 0 0 2px #ffd23a,0 0 14px rgba(255,210,58,.55)}
.bstage.board .ftr.down{border-color:rgba(255,255,255,.18);background:rgba(16,20,32,.45)}
.bstage.board .ftr.down .fmove{visibility:visible;opacity:.3;filter:grayscale(1)}
.bstage.board .ftr.down::after{content:'\2715';position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  font-size:min(40px,9cqw);font-weight:bold;color:rgba(224,71,63,.85);text-shadow:0 1px 2px #000}
.bstage.board.vert .ftr.down::after{font-size:min(40px,10cqw)}
.bstage.board .fbarrier{inset:-4% -10% -2%}
.fx.impact{position:absolute;width:clamp(44px,10cqw,90px);aspect-ratio:1;border-radius:50%;pointer-events:none;z-index:6;
  background:radial-gradient(circle,#fff 0 22%,var(--c) 44%,transparent 70%);mix-blend-mode:screen}
@media (max-width:700px) and (orientation:portrait){
  #app:has(.arena) .bstage.board.vert{min-height:calc(100vw * 1.05);max-height:calc(100vw * 1.6)}
}

/* =====================================================================
   4.14.0 · THE STADIUM — the board as a tilted table in a stadium.
   Pokémon stand up off their squares (counter-rotated), the floor follows
   the battle (a leader's type, your rival at dusk, the League hall), the
   camera leans in on big hits. Positions are the 4.13.0 board's, now on .table.
   ===================================================================== */
.bstage.board.stadium{--tilt:24deg;--pitch:#3f8f45}
.bstage.board.stadium .ground{z-index:0}
.bstage.board.stadium .tview{position:absolute;inset:0;perspective:150cqw;perspective-origin:50% 0%;z-index:2}
.bstage.board.stadium .table{position:absolute;left:5%;right:5%;top:13%;bottom:6%;transform:rotateX(var(--tilt));transform-origin:50% 100%;
  transform-style:preserve-3d;border-radius:12px;box-shadow:0 0 0 3px rgba(255,255,255,.75),0 18px 26px rgba(0,0,0,.45)}
.bstage.board.stadium.vert{--tilt:22deg}
.bstage.board.stadium.vert .table{left:4%;right:4%;top:9%;bottom:3%}
.bstage.board.stadium .pitch{position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.bstage.board.stadium .midline{opacity:.85;background:rgba(255,255,255,.75);width:3px}
.bstage.board.stadium.vert .midline{background:rgba(255,255,255,.75);height:3px;width:auto}
.bstage.board.stadium .slotmark{border:2px solid rgba(255,255,255,.16);border-radius:8px}

/* tiles are squares painted on the floor; what stands on them is turned to face you */
.bstage.board.stadium .ftr{background:rgba(0,0,0,.14);border:2px solid rgba(var(--t),.85);border-radius:8px;box-shadow:none;transform-style:preserve-3d}
.bstage.board.stadium .ftr::before{content:'';position:absolute;pointer-events:none;border-radius:50%;
  background:radial-gradient(closest-side,rgba(var(--t),.8),rgba(var(--t),.18) 70%,transparent)}
.bstage.board.stadium .ftr .fmove{transform-style:preserve-3d}
.bstage.board.stadium .ftr .fbody{transform:rotateX(calc(var(--tilt) * -1));transform-origin:50% 100%;align-items:flex-end;transform-style:preserve-3d}
.bstage.board.stadium .ftr .fart{filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.bstage.board.stadium .ftr .fname{text-shadow:0 1px 2px #000,0 0 3px #000}
.bstage.board.stadium .ftr.acting{border-color:#ffd23a;box-shadow:0 0 0 2px #ffd23a,0 0 18px rgba(255,210,58,.7)}
.bstage.board.stadium .ftr.acting::before{background:radial-gradient(closest-side,#fff6b0,rgba(255,210,58,.5) 60%,transparent)}
.bstage.board.stadium .ftr.down{background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.2)}
.bstage.board.stadium .ftr.down::before{display:none}
/* wide: the pokémon stands in the middle of a tall square, its bar and name painted below */
.bstage.board.stadium:not(.vert) .ftr::before{left:18%;right:18%;bottom:24%;height:18%}
.bstage.board.stadium:not(.vert) .ftr .fart{height:112%;max-height:none}
/* phone: the pokémon stands at the left end of a wide square, its name and bar to the right */
.bstage.board.stadium.vert .ftr::before{left:3%;width:30%;bottom:6%;height:40%}
.bstage.board.stadium.vert .ftr .fart{height:122%;max-height:none;max-width:none}
.bstage.board.stadium.vert .ftr .fbody{width:min(30cqw,36%);justify-content:flex-start}
.bstage.board.stadium.vert .ftr .fname{font-size:max(10px,3.2cqw)}
/* a gentle idle bob (not under reduced motion) */
.bstage.board.stadium .ftr:not(.down) .fart img{animation:sbob 2.4s ease-in-out infinite}
.bstage.board.stadium .ftr:nth-child(3n) .fart img{animation-delay:-.8s}
.bstage.board.stadium .ftr:nth-child(3n+1) .fart img{animation-delay:-1.6s}
@keyframes sbob{0%,100%{translate:0 0}50%{translate:0 -3px}}
body.calm .bstage.board.stadium .fart img{animation:none}
@media (prefers-reduced-motion:reduce){.bstage.board.stadium .fart img{animation:none}}

/* ---- surroundings ---- */
.bstage.board.stadium .stands{position:absolute;left:0;right:0;top:0;height:22%;
  background:radial-gradient(1.2cqw 1.2cqw at 12% 40%,#fff6,transparent),radial-gradient(1.2cqw 1.2cqw at 33% 62%,#fdf6,transparent),radial-gradient(1.2cqw 1.2cqw at 58% 30%,#dff6,transparent),radial-gradient(1.2cqw 1.2cqw at 81% 55%,#ffd6,transparent),
    repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1.4cqw,rgba(255,255,255,.14) 1.4cqw 2.8cqw),repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 1.6cqw),var(--standc,#2c376a);
  clip-path:polygon(0 100%,6% 0,94% 0,100% 100%)}
.bstage.board.stadium.vert .stands{height:13%}
.bstage.board.stadium .lights{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(28% 18% at 12% 2%,rgba(255,255,220,.5),transparent 70%),radial-gradient(28% 18% at 88% 2%,rgba(255,255,220,.5),transparent 70%)}
.bstage.board.stadium.bg-route .ground{background:linear-gradient(180deg,#5ea7e0 0%,#9fd2ef 18%,#2b4a2e 30%,#203a24 100%)}
.bstage.board.stadium.bg-route{--standc:#3a4f8a}
.bstage.board.stadium.bg-dusk .ground{background:linear-gradient(180deg,#3a2a5e 0%,#c0607a 14%,#f0a070 22%,#2a2030 32%,#1a1420 100%)}
.bstage.board.stadium.bg-dusk{--standc:#4a2f52}
.bstage.board.stadium.bg-gym .ground{background:
  repeating-linear-gradient(90deg,transparent 0 18%,color-mix(in srgb,var(--gymc) 70%,transparent) 18% 20%,transparent 20% 38%),
  linear-gradient(180deg,#1b1f2c 0%,color-mix(in srgb,var(--gymc) 25%,#1b1f2c) 30%,#14171f 100%)}
.bstage.board.stadium.bg-gym .stands{--standc:color-mix(in srgb,var(--gymc) 40%,#232838)}
.bstage.board.stadium.bg-league .ground{background:radial-gradient(60% 30% at 50% 0%,rgba(190,150,255,.4),transparent 70%),linear-gradient(180deg,#15122c 0%,#2a2152 30%,#120f24 100%)}
.bstage.board.stadium.bg-league{--standc:#3d3470}
.bstage.board.stadium.bg-league .lights{background:radial-gradient(22% 30% at 25% 0%,rgba(255,215,120,.45),transparent 70%),radial-gradient(22% 30% at 75% 0%,rgba(255,215,120,.45),transparent 70%)}
.bstage.board.stadium.bg-summit .ground{background:radial-gradient(.5cqw .5cqw at 20% 20%,#fff,transparent),radial-gradient(.5cqw .5cqw at 70% 12%,#fff,transparent),radial-gradient(.5cqw .5cqw at 45% 30%,#fff,transparent),linear-gradient(180deg,#0b1026 0%,#26305a 30%,#0e1430 100%)}
.bstage.board.stadium.bg-summit .stands{display:none}

/* ---- floors ---- */
.bstage.board.stadium .table{background:var(--pitch)}
.bstage.board.stadium.fl-route .table{background:repeating-linear-gradient(0deg,#3f8f45 0 7.7%,#48a04e 7.7% 15.4%)}
.bstage.board.stadium.fl-dusk .table{background:repeating-linear-gradient(0deg,#2f6a3a 0 7.7%,#367a42 7.7% 15.4%)}
.bstage.board.stadium.fl-route .pitch::before,.bstage.board.stadium.fl-dusk .pitch::before{content:'';position:absolute;left:50%;top:50%;width:26cqw;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.75);border-radius:50%}
.bstage.board.stadium.fl-league .table{background:repeating-linear-gradient(90deg,rgba(255,215,120,.16) 0 2px,transparent 2px 12.5%),repeating-linear-gradient(0deg,rgba(255,215,120,.16) 0 2px,transparent 2px 12.5%),linear-gradient(160deg,#4a3f86,#2e2660 60%,#3c3274);box-shadow:0 0 0 3px #e0b44a,0 18px 26px rgba(0,0,0,.5)}
.bstage.board.stadium.fl-summit .table{background:radial-gradient(40% 30% at 30% 40%,#fff,transparent 70%),radial-gradient(40% 30% at 75% 70%,#f2f8ff,transparent 70%),linear-gradient(160deg,#dfe9f5,#b9cce0)}
.bstage.board.stadium.fl-Water .table{background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 2px,transparent 2px 12.5%),repeating-linear-gradient(0deg,rgba(255,255,255,.22) 0 2px,transparent 2px 10%),repeating-radial-gradient(circle at 50% 50%,#3b8fe0 0 10px,#3383d4 10px 20px)}
.bstage.board.stadium.fl-Fire .table{background:linear-gradient(115deg,transparent 44%,rgba(255,120,30,.75) 45% 48%,transparent 49%) 0 0/64px 52px,linear-gradient(35deg,transparent 58%,rgba(255,160,40,.6) 59% 62%,transparent 63%) 22px 18px/70px 60px,radial-gradient(40% 30% at 30% 70%,rgba(255,90,20,.45),transparent 70%),linear-gradient(160deg,#4a2a24,#2c1814)}
.bstage.board.stadium:is(.fl-Ice,.fl-summit,.fl-Normal,.fl-Flying,.fl-Ground,.fl-Rock,.fl-Steel,.fl-Electric) .ftr:not(.down){background:rgba(18,24,40,.46)}
