.bstage.board.stadium.fl-Psychic .table{background:repeating-radial-gradient(circle at 50% 50%,transparent 0 22px,rgba(255,170,230,.25) 22px 24px),linear-gradient(160deg,#7a3e8e,#4e2462)}
.bstage.board.stadium.fl-Electric .table{background:repeating-linear-gradient(45deg,#ffd23a 0 10px,#2b2f3a 10px 20px) 0 0/100% 5% no-repeat,repeating-linear-gradient(45deg,#ffd23a 0 10px,#2b2f3a 10px 20px) 0 100%/100% 5% no-repeat,linear-gradient(rgba(0,0,0,.25) 1px,transparent 1px) 0 0/100% 12.5%,linear-gradient(90deg,rgba(0,0,0,.25) 1px,transparent 1px) 0 0/25% 100%,linear-gradient(160deg,#9aa4b4,#6e7888)}
.bstage.board.stadium.fl-Ice .table{background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.7) 40.5%,transparent 41.5%),linear-gradient(30deg,transparent 65%,rgba(255,255,255,.6) 65.5%,transparent 66.5%),linear-gradient(160deg,#d6f0fa,#9ccfe6)}
.bstage.board.stadium.fl-Fighting .table{background:linear-gradient(90deg,rgba(0,0,0,.18) 2px,transparent 2px) 0 0/16.66% 100%,linear-gradient(160deg,#c8945a,#9a6a3a);box-shadow:0 0 0 3px #e9dcc0,0 18px 26px rgba(0,0,0,.45)}
.bstage.board.stadium.fl-Fighting .pitch{inset:10% 8%;border:3px solid rgba(200,40,40,.7)}
.bstage.board.stadium.fl-Ghost .table{background:radial-gradient(50% 30% at 30% 30%,rgba(170,120,255,.35),transparent 70%),radial-gradient(40% 30% at 70% 75%,rgba(120,80,200,.35),transparent 70%),linear-gradient(160deg,#2c2242,#17112a)}
.bstage.board.stadium.fl-Dragon .table{background:radial-gradient(circle at 50% 100%,transparent 14px,rgba(255,255,255,.12) 15px 16px,transparent 17px) 0 0/30px 20px,linear-gradient(160deg,#3c3aa0,#24206a)}
.bstage.board.stadium.fl-Flying .table{background:radial-gradient(30% 14% at 25% 30%,rgba(255,255,255,.85),transparent 70%),radial-gradient(26% 12% at 70% 65%,rgba(255,255,255,.8),transparent 70%),linear-gradient(160deg,#9fd4f2,#6eb2e0)}
.bstage.board.stadium.fl-Normal .table{background:conic-gradient(#f6d8e2 25%,#fbeef2 0 50%,#f6d8e2 0 75%,#fbeef2 0) 0 0/25% 16.66%}
.bstage.board.stadium.fl-Steel .table{background:radial-gradient(circle,#dfe4ea 0 2px,transparent 3px) 6px 6px/25% 12.5%,linear-gradient(rgba(0,0,0,.25) 1px,transparent 1px) 0 0/100% 12.5%,linear-gradient(90deg,rgba(0,0,0,.25) 1px,transparent 1px) 0 0/25% 100%,linear-gradient(160deg,#b4bcc8,#828c9a)}
.bstage.board.stadium.fl-Poison .table{background:radial-gradient(circle,rgba(150,255,120,.45) 0 4px,transparent 5px) 0 0/40px 36px,radial-gradient(circle,rgba(150,255,120,.3) 0 3px,transparent 4px) 20px 18px/40px 36px,linear-gradient(160deg,#6a3a80,#45225a)}
.bstage.board.stadium.fl-Dark .table{background:linear-gradient(160deg,#2a1a22,#120a10);box-shadow:0 0 0 3px #c03040,0 18px 26px rgba(0,0,0,.55)}
@media (max-width:700px) and (orientation:portrait){
  #app:has(.arena) .bstage.board.stadium.vert{min-height:calc(100vw * 1.15);max-height:calc(100vw * 1.7)}
}

/* ===== 4.15.0 · crowd bulbs, confetti, and the three battle looks ===== */
.bstage.board.stadium .bulbs{position:absolute;inset:0;pointer-events:none}
.bstage.board.stadium .bulb{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:radial-gradient(circle,#fff 0 35%,rgba(255,255,230,.6) 55%,transparent 72%);box-shadow:0 0 8px 3px rgba(255,255,230,.7)}
.fx.confetti{width:7px;height:11px;border-radius:2px;z-index:8}

/* Miniatures: no squares — each pokémon is a figure on a round base, on a table with a wooden rim */
.bstage.board.stadium.look-mini .table{box-shadow:0 0 0 6px #7a4a2a,0 0 0 9px #a86c3c,0 18px 26px rgba(0,0,0,.5)}
.bstage.board.stadium.look-mini .slotmark{border:none}
.bstage.board.stadium.look-mini .slotmark::before{content:'';position:absolute;border:2px dashed rgba(255,255,255,.25);border-radius:50%}
.bstage.board.stadium.look-mini .ftr,.bstage.board.stadium.look-mini .ftr.acting,.bstage.board.stadium.look-mini .ftr.down,
.bstage.board.stadium.look-mini:is(.fl-Ice,.fl-summit,.fl-Normal,.fl-Flying,.fl-Ground,.fl-Rock,.fl-Steel,.fl-Electric) .ftr:not(.down){background:transparent;border-color:transparent;box-shadow:none}
.bstage.board.stadium.look-mini .ftr::before{display:block;background:radial-gradient(closest-side,#3a3f4c,#14161d);box-shadow:0 0 0 3px rgb(var(--t)),0 4px 0 #0b0d12,0 6px 8px rgba(0,0,0,.45)}
.bstage.board.stadium.look-mini .ftr.acting::before{background:radial-gradient(closest-side,#4a4f5c,#14161d);box-shadow:0 0 0 3px #ffd23a,0 4px 0 #0b0d12,0 0 16px #ffd23a}
.bstage.board.stadium.look-mini .ftr.down::before{opacity:.5;box-shadow:0 0 0 3px rgba(255,255,255,.3),0 4px 0 #0b0d12}
.bstage.board.stadium.look-mini:not(.vert) .ftr::before{left:20%;right:20%;bottom:26%;height:16%}
.bstage.board.stadium.look-mini.vert .ftr::before{left:2%;width:30%;bottom:8%;height:36%}
.bstage.board.stadium.look-mini:not(.vert) .slotmark::before{left:20%;right:20%;bottom:26%;height:16%}
.bstage.board.stadium.look-mini.vert .slotmark::before{left:2%;width:30%;bottom:8%;height:36%}

/* Paper: each pokémon is printed on a white standee in your colour or theirs */
.bstage.board.stadium.look-paper .table{box-shadow:0 0 0 4px #f4ecd8,0 0 0 6px rgba(0,0,0,.15),0 18px 26px rgba(0,0,0,.4)}
.bstage.board.stadium.look-paper .slotmark{border:2px dashed rgba(255,255,255,.22)}
.bstage.board.stadium.look-paper .ftr,.bstage.board.stadium.look-paper .ftr.acting,.bstage.board.stadium.look-paper .ftr.down,
.bstage.board.stadium.look-paper:is(.fl-Ice,.fl-summit,.fl-Normal,.fl-Flying,.fl-Ground,.fl-Rock,.fl-Steel,.fl-Electric) .ftr:not(.down){background:transparent;border-color:transparent;box-shadow:none}
.bstage.board.stadium.look-paper .ftr::before{display:block;border-radius:3px;background:rgb(var(--t));opacity:.85}
.bstage.board.stadium.look-paper:not(.vert) .ftr::before{left:26%;right:26%;bottom:22%;height:7%}
.bstage.board.stadium.look-paper.vert .ftr::before{left:4%;width:26%;bottom:4%;height:14%}
.bstage.board.stadium.look-paper .ftr .fart{background:#fff;border-radius:6px;padding:3px;box-sizing:border-box;box-shadow:0 0 0 2px rgb(var(--t)),3px 3px 0 rgba(0,0,0,.22);filter:none}
.bstage.board.stadium.look-paper .ftr.acting .fart{box-shadow:0 0 0 3px #ffd23a,0 0 14px #ffd23a,3px 3px 0 rgba(0,0,0,.22)}
.bstage.board.stadium.look-paper .ftr.acting::before{background:#ffd23a}
.bstage.board.stadium.look-paper:not(.vert) .ftr .fart{height:96%}
.bstage.board.stadium.look-paper.vert .ftr .fart{height:112%}
/* without a square behind them, names and bars get their own dark label */
.bstage.board.stadium:is(.look-mini,.look-paper) .ftr .fhead{background:rgba(16,20,32,.55);border-radius:6px;padding:2px 5px;align-self:center}
.bstage.board.stadium:is(.look-mini,.look-paper) .ftr.down .fhead{background:rgba(16,20,32,.3)}

/* =====================================================================
   4.16.0 · PIECES — no card squares: each pokémon stands free on its spot,
   a soft nameplate floats over its head (a dark band that fades out on
   every edge, no team colour), with a smooth HP bar that leaves a white
   trail and shows a barrier as a striped blue end. Status conditions get
   particles; a barrier is a shimmering shell that shatters.
   ===================================================================== */
.bstage.board.stadium{--ah:62%;--amb:13%;--pw:13cqw;--nf:max(10px,1.15cqw)}
.bstage.board.stadium.vert{--ah:108%;--amb:5%;--pw:31cqw;--nf:max(10px,3cqw)}
.bstage.board.stadium.vert .ftr .fhead,.bstage.board.stadium.vert:is(.look-mini,.look-paper) .ftr .fhead{bottom:calc(100% - 9px);padding-top:2px}
.bstage.board.stadium.vert .ftr .fhead::before{inset:-2px -12% 0}
.bstage.board.stadium .ftr .fmove,.bstage.board.stadium.vert .ftr .fmove{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0;gap:0;grid-template:none}
.bstage.board.stadium .ftr .fbody,.bstage.board.stadium.vert .ftr .fbody{position:relative;width:auto;height:var(--ah);margin-bottom:var(--amb);display:flex;justify-content:center;align-items:flex-end}
.bstage.board.stadium .ftr .fart,.bstage.board.stadium.vert .ftr .fart,.bstage.board.stadium:not(.vert) .ftr .fart{position:relative;height:100%;width:auto;aspect-ratio:1;max-width:none;max-height:none}
.bstage.board.stadium.look-paper .ftr .fart,.bstage.board.stadium.look-paper.vert .ftr .fart,.bstage.board.stadium.look-paper:not(.vert) .ftr .fart{height:92%}

/* the plate */
.bstage.board.stadium .ftr .fhead,.bstage.board.stadium:is(.look-mini,.look-paper) .ftr .fhead{position:absolute;left:50%;bottom:calc(100% + 3px);transform:translateX(-50%);width:var(--pw);
  display:flex;flex-direction:column;align-items:stretch;gap:2px;margin:0;padding:3px 9px 4px;background:none;border-radius:0;z-index:4;pointer-events:none}
.bstage.board.stadium .ftr .fhead::before{content:'';position:absolute;inset:-4px -12% -1px;z-index:-1;border-radius:45%;
  background:linear-gradient(180deg,rgba(14,18,30,0),rgba(14,18,30,.68) 55%,rgba(14,18,30,.62));
  -webkit-mask:linear-gradient(90deg,transparent,#000 22% 78%,transparent);mask:linear-gradient(90deg,transparent,#000 22% 78%,transparent)}
.bstage.board.stadium .frow{display:flex;align-items:center;gap:4px;min-width:0}
.bstage.board.stadium .ftr .fname,.bstage.board.stadium.vert .ftr .fname{flex:1 1 auto;min-width:0;font-size:var(--nf);text-align:left;color:#fff;text-shadow:0 1px 0 #000,0 0 3px rgba(0,0,0,.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bstage.board.stadium .ftr.acting .fname{color:#ffe680}
.bstage.board.stadium .ftr .fchips,.bstage.board.stadium.vert .ftr .fchips{flex:none;min-height:0;margin:0;justify-content:flex-end}
.bstage.board.stadium .fchip{font-size:0;padding:0 3px;line-height:12px;border-radius:3px;box-shadow:none}
.bstage.board.stadium .fchip b{display:inline!important;font-size:8.5px;margin:0;letter-spacing:.3px}
.bstage.board.stadium .fchip.sh{display:none}
.bstage.board.stadium .ftr .fhp{position:relative;width:100%;height:6px;border:none;border-radius:3px;background:#2a2f3c;overflow:hidden;box-shadow:inset 0 1px 0 rgba(0,0,0,.45)}
.bstage.board.stadium .fhp i{position:absolute;left:0;top:0;bottom:0;width:100%;height:auto;background:linear-gradient(180deg,#7ef09a,#2fbf5f);transition:width .4s ease}
.bstage.board.stadium .fhp i.mid{background:linear-gradient(180deg,#ffe07a,#e0a520)}
.bstage.board.stadium .fhp i.low{background:linear-gradient(180deg,#ff8a7a,#d8352a)}
.bstage.board.stadium .fhp b{position:absolute;left:0;top:0;bottom:0;width:100%;background:#fff;opacity:.85;transition:width .9s ease-in .35s}
.bstage.board.stadium .fhp em{position:absolute;right:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(45deg,#a9d8ff 0 3px,#6fb8f0 3px 6px);transition:width .3s}
.bstage.board.stadium .ftr.down .fhead{opacity:.45}

/* Stadium look: no squares — a soft pad under the feet, faint rings for empty spots */
.bstage.board.stadium.look-stadium .ftr,.bstage.board.stadium.look-stadium .ftr.acting,.bstage.board.stadium.look-stadium .ftr.down,
.bstage.board.stadium.look-stadium:is(.fl-Ice,.fl-summit,.fl-Normal,.fl-Flying,.fl-Ground,.fl-Rock,.fl-Steel,.fl-Electric) .ftr:not(.down){background:transparent;border-color:transparent;box-shadow:none}
.bstage.board.stadium.look-stadium .slotmark{border:none}
.bstage.board.stadium.look-stadium .slotmark::before,.bstage.board.stadium.look-mini .slotmark::before{content:'';position:absolute;border:2px dashed rgba(255,255,255,.22);border-radius:50%}
.bstage.board.stadium .ftr::before,.bstage.board.stadium .slotmark::before{left:24%;right:24%;width:auto;bottom:calc(var(--amb) - 6%);height:16%}
.bstage.board.stadium.vert .ftr::before,.bstage.board.stadium.vert .slotmark::before{left:31%;right:31%;width:auto;bottom:0;height:34%}
.bstage.board.stadium.look-paper .ftr::before{left:38%;right:38%;bottom:calc(var(--amb) - 3%);height:6%}
.bstage.board.stadium.look-paper.vert .ftr::before{left:38%;right:38%;bottom:2%;height:14%}
.bstage.board.stadium.look-stadium .ftr.acting::before{box-shadow:0 0 14px rgba(255,210,58,.8)}
.bstage.board.stadium .ftr.down::after{inset:auto 0 0;height:60%}

/* status particles */
.bstage .stfx{position:absolute;inset:-10% -10% 0;pointer-events:none;z-index:3}
.bstage .stfx i{position:absolute;opacity:0}
.bstage .ftr.down .stfx{display:none}
.st-brn .stfx i{width:22%;height:30%;bottom:0;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff3a0,#ff9a2a 45%,#e0401a 70%,transparent 72%);animation:stflame 1s ease-in infinite}
.st-brn .stfx i:nth-child(1){left:12%}.st-brn .stfx i:nth-child(2){left:40%;animation-delay:-.35s}.st-brn .stfx i:nth-child(3){left:66%;animation-delay:-.7s}
@keyframes stflame{0%{opacity:0;transform:translateY(0) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-120%) scale(.3)}}
.st-psn .stfx i{width:16%;aspect-ratio:1;bottom:5%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f0c8ff,#b05ad0 55%,#6a2a8a);animation:stbub 1.4s ease-in infinite}
.st-psn .stfx i:nth-child(1){left:15%}.st-psn .stfx i:nth-child(2){left:45%;animation-delay:-.5s}.st-psn .stfx i:nth-child(3){left:70%;animation-delay:-1s}
@keyframes stbub{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:.95}90%{opacity:.8;transform:translateY(-160%) scale(1)}100%{opacity:0;transform:translateY(-170%) scale(1.3)}}
.st-par .stfx i{width:18%;height:34%;background:#ffe14a;clip-path:polygon(55% 0,20% 55%,48% 55%,30% 100%,82% 40%,54% 40%,72% 0);filter:drop-shadow(0 0 3px #fff6a0);animation:stzap 1.1s steps(1) infinite}
.st-par .stfx i:nth-child(1){left:2%;top:20%}.st-par .stfx i:nth-child(2){right:2%;top:5%;animation-delay:-.4s}.st-par .stfx i:nth-child(3){left:42%;top:-8%;animation-delay:-.75s}
@keyframes stzap{0%,60%,100%{opacity:0}10%,25%{opacity:1}}
.st-slp .stfx i{font-weight:bold;font-size:12px;color:#e8eeff;text-shadow:0 0 3px #3a4a8a,0 0 1px #000;font-style:normal;animation:stzz 2.2s ease-out infinite}
.st-slp .stfx i::before{content:'z'}
.st-slp .stfx i:nth-child(1){left:62%;top:20%}.st-slp .stfx i:nth-child(2){left:72%;top:6%;animation-delay:-.7s;font-size:14px}.st-slp .stfx i:nth-child(3){left:82%;top:-8%;animation-delay:-1.4s;font-size:17px}
@keyframes stzz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-14px)}}
.st-cnf .stfx{inset:-28% 10% 72%}
.st-cnf .stfx i{width:11px;height:11px;left:50%;top:50%;margin:-5.5px;background:#ffd23a;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);opacity:1;animation:storbit 1.6s linear infinite}
.st-cnf .stfx i:nth-child(2){animation-delay:-.53s;background:#ff9bd0}.st-cnf .stfx i:nth-child(3){animation-delay:-1.06s;background:#9fd3ff}
@keyframes storbit{from{transform:rotate(0deg) translateX(14px)}to{transform:rotate(360deg) translateX(14px)}}

/* the barrier: a shimmering hex shell */
.bstage.board .fbarrier{inset:-14% -18% -4%;border-radius:50% 50% 46% 46%;opacity:0;transform:scale(.6);transition:opacity .3s,transform .35s cubic-bezier(.2,.9,.3,1.3);z-index:2;
  background:radial-gradient(ellipse at 50% 60%,rgba(150,210,255,.05) 40%,rgba(150,210,255,.35) 70%,rgba(220,240,255,.7)),repeating-conic-gradient(from 30deg,rgba(255,255,255,.18) 0 4deg,transparent 4deg 60deg);
  border:2px solid rgba(210,236,255,.85);box-shadow:0 0 10px rgba(120,190,255,.7),inset 0 0 8px rgba(255,255,255,.5)}
.bstage.board .fbarrier::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 48%,transparent 60%);background-size:250% 100%;animation:stshimmer 2.2s linear infinite}
@keyframes stshimmer{from{background-position:150% 0}to{background-position:-100% 0}}
.bstage.board .fbarrier.on{opacity:1;transform:scale(1)}
.fx.shard{width:11px;height:11px;background:linear-gradient(135deg,#fff,#9fd3ff);clip-path:polygon(50% 0,100% 40%,70% 100%,10% 80%);z-index:9}
body.calm .bstage .stfx i,body.calm .bstage .fbarrier::after{animation:none;opacity:.9}
@media (prefers-reduced-motion:reduce){.bstage .stfx i,.bstage .fbarrier::after{animation:none!important;opacity:.9}}

/* 4.16.0: miniature bases follow the pokémon to the middle of its spot */
.bstage.board.stadium.look-mini:not(.vert) .ftr::before,.bstage.board.stadium.look-mini:not(.vert) .slotmark::before{left:22%;right:22%;width:auto;bottom:calc(var(--amb) - 7%);height:17%}
.bstage.board.stadium.look-mini.vert .ftr::before,.bstage.board.stadium.look-mini.vert .slotmark::before{left:30%;right:30%;width:auto;bottom:-2%;height:36%}

/* 4.17.0: no band behind the plate — only the lettering and the bar carry a shadow; pokémon a little smaller */
.bstage.board.stadium{--ah:54%;--amb:15%}
.bstage.board.stadium.vert{--ah:92%;--amb:7%}
.bstage.board.stadium .ftr .fhead::before,.bstage.board.stadium.vert .ftr .fhead::before{display:none}
.bstage.board.stadium .ftr .fhead,.bstage.board.stadium:is(.look-mini,.look-paper) .ftr .fhead{padding:0 6px 2px}
.bstage.board.stadium .ftr .fname,.bstage.board.stadium.vert .ftr .fname{text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000,0 2px 3px rgba(0,0,0,.7)}
.bstage.board.stadium .ftr .fname i{text-shadow:inherit}
.bstage.board.stadium .ftr .fhp{box-shadow:0 0 0 1.5px rgba(0,0,0,.75),0 2px 3px rgba(0,0,0,.45)}
.bstage.board.stadium .fchip{box-shadow:0 0 0 1px rgba(0,0,0,.6)}

/* 4.17.0 · hit particles by type */
.fx.pt{position:absolute;pointer-events:none;z-index:7;background:var(--c)}
.fx.pt.ember{width:8px;height:8px;border-radius:50%;background:radial-gradient(circle,#fff 0 20%,var(--c) 45%,transparent 72%);box-shadow:0 0 6px var(--c)}
.fx.pt.drop{width:7px;height:10px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;box-shadow:inset -1px -2px 0 rgba(0,0,0,.15),0 0 2px rgba(255,255,255,.6)}
.fx.pt.leaf{width:10px;height:6px;border-radius:0 100% 0 100%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.fx.pt.spark{width:9px;height:14px;clip-path:polygon(55% 0,20% 55%,48% 55%,30% 100%,82% 40%,54% 40%,72% 0);filter:drop-shadow(0 0 3px #fff6a0)}
.fx.pt.ishard{width:6px;height:12px;clip-path:polygon(50% 0,100% 30%,70% 100%,20% 85%,0 30%);filter:drop-shadow(0 0 2px #fff)}
.fx.pt.chunk{width:8px;height:7px;border-radius:2px;clip-path:polygon(15% 0,85% 10%,100% 70%,60% 100%,0 80%);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.fx.pt.dust{width:18px;height:12px;border-radius:50%;background:radial-gradient(closest-side,var(--c),transparent);opacity:.8}
.fx.pt.glint{width:10px;height:10px;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);filter:drop-shadow(0 0 3px var(--c))}
.fx.pt.wisp{width:12px;height:12px;border-radius:50%;background:radial-gradient(closest-side,var(--c),transparent);filter:blur(.5px)}
.fx.pt.bubble{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--c) 55%,transparent 72%);box-shadow:0 0 0 1px rgba(255,255,255,.4)}
.fx.pt.star{width:10px;height:10px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);filter:drop-shadow(0 0 2px rgba(0,0,0,.5))}
.fx.pt.feather{width:5px;height:13px;border-radius:50% 50% 50% 50%/80% 80% 20% 20%;box-shadow:inset 1px 0 0 rgba(0,0,0,.12)}

/* 4.17.1: pokémon a little smaller again */
.bstage.board.stadium{--ah:47%;--amb:17%}
.bstage.board.stadium.vert{--ah:80%;--amb:9%}

/* 4.17.1 iron out: a filter on .fmove flattened the standing pose (preserve-3d), so a fainted pokémon is greyed on the sprite itself */
.bstage.board.stadium .ftr.down .fmove{opacity:1;filter:none}
.bstage.board.stadium .ftr.down .fart img{opacity:1;filter:grayscale(1) brightness(.5) contrast(1.15);animation:none}
.bstage.board.stadium .ftr.down .fbarrier{opacity:0}

/* 4.17.1 iron out */
.bstage.board.stadium ~ .big.ribbon,.stagewrap .big.ribbon{top:50%;transform:translateY(-50%)}
@container (max-width:640px){
  .bstage.board.stadium:not(.vert){--pw:16cqw}
  .bstage.board.stadium:not(.vert) .ftr .fname{font-size:9px;letter-spacing:-.1px}
  .bstage.board.stadium:not(.vert) .ftr .fname i{font-size:8px}
  .bstage.board.stadium:not(.vert) .ftr .fhead{padding:0 2px 2px}
}

/* 4.17.1 iron out: phones on their side — the START menu goes two columns so each row can be a comfortable tap */
@media (max-height:520px) and (min-width:600px){
  .modal.startmenu .box{max-width:min(580px,calc(100vw - 24px));width:min(580px,calc(100vw - 24px))}
  .modal.startmenu .smenu{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;align-items:stretch}
  .modal.startmenu .smi{min-height:34px;padding-top:4px;padding-bottom:4px}
  .modal.startmenu .smenu hr,.modal.startmenu .sdesc,.modal.startmenu .yesno{grid-column:1 / -1}
}

/* 4.17.2: a fainted pokémon keeps only its grey silhouette and its name — no cross, no HP bar */
.bstage.board .ftr.down::after{display:none}
.bstage.board.stadium .ftr.down .fhp{display:none}

/* 4.17.3: no team-coloured spots under the pokémon — a soft neutral shadow instead (Miniatures keep their bases) */
.bstage.board.stadium:is(.look-stadium,.look-paper) .ftr::before,.bstage.board.stadium:is(.look-stadium,.look-paper) .ftr.acting::before{background:radial-gradient(closest-side,rgba(0,0,0,.32),transparent);box-shadow:none;opacity:1}
.bstage.board.stadium.look-paper .ftr::before{border-radius:50%}

/* =====================================================================
   5.0.0 · BROADCAST — the whole game is the stadium. The page is the pitch;
   every box is a dark see-through panel floating over it like a sports
   broadcast; headings are gold tags; the top bar is a scoreboard. Scoped
   under html.bc so it beats the older Light/Dark rules. Light = a sunny
   pitch, Dark = an evening one; the panels are the same in both.
   ===================================================================== */
html.bc,html.bc.dark{
  --bg:#3a8840; --bg2:#43974a; --panel:rgba(12,18,34,.8); --panel2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.28); --edge:rgba(255,255,255,.22);
  --text:#f4f6fb; --muted:#c3cbe0; --dim:#98a3c0;
  --gold:#ffd23a; --gold2:#e0a526; --goldtx:#ffd23a;
  --hp:#5ad17a; --atk:#ff8a6a; --spd:#7ab8ff;
  --good:#5ad17a; --bad:#ff6b73; --info:#7ab8ff;
  --navy:#11182c; --navy2:#1f2b4e; --glass:rgba(12,18,34,.8); --glass2:rgba(14,20,38,.96);
  --gbbox:0 4px 12px rgba(0,0,0,.28);
  color-scheme:dark;
}
html.bc body{background:radial-gradient(130% 70% at 50% 0%,rgba(0,0,0,0),rgba(0,0,0,.28)),repeating-linear-gradient(0deg,#3a8840 0 34px,#43974a 34px 68px);background-attachment:fixed;color:var(--text)}
html.bc.dark body{background:radial-gradient(130% 70% at 50% 0%,rgba(0,0,0,.1),rgba(0,0,0,.5)),repeating-linear-gradient(0deg,#2c6a32 0 34px,#337838 34px 68px);background-attachment:fixed}

/* boxes: no thick borders, soft glass, the same corners everywhere */
html.bc :is(.panel,#inspect,.popup,#blog,.queue,.nextup,.closed,.speech){background:var(--glass);border:0;border-radius:10px;box-shadow:var(--gbbox);color:var(--text)}
html.bc .modal .box{background:var(--glass2);border:0;border-radius:12px;box-shadow:0 0 0 2px rgba(255,210,58,.55),0 14px 40px rgba(0,0,0,.55);color:var(--text)}
html.bc .modal{background:rgba(6,10,20,.55)}
html.bc .panel h2{color:var(--text)}
html.bc .panel h2 .sub{color:var(--muted)}
html.bc .panel h2.sep{border-top:1px solid var(--line)}
/* gold headline tags */
html.bc .tg{display:inline-flex;align-items:center;background:var(--gold);color:var(--navy);font-family:var(--pix);font-weight:500;text-transform:uppercase;letter-spacing:1.2px;font-size:13.5px;padding:2px 9px;border-radius:4px;line-height:1.35}
html.bc .modal h3{color:var(--gold);letter-spacing:.6px}
html.bc .modal h4{color:var(--muted)}

/* buttons */
html.bc .btn{background:rgba(255,255,255,.1);border:0;border-radius:8px;color:var(--text);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
html.bc .btn:active{transform:translateY(1px);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
html.bc .btn.primary,html.bc .btn.gold,html.bc .btn.big-cta.boss{background:var(--gold);color:var(--navy);box-shadow:0 3px 0 #a07a10}
html.bc .btn.danger{background:linear-gradient(180deg,#ff5a4a,#d8352a);color:#fff;box-shadow:0 3px 0 #8a1f18}
html.bc .btn.ghost{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2)}
html.bc .btn.buy,html.bc .btn.freeroll{color:var(--gold);box-shadow:inset 0 0 0 1.5px rgba(255,210,58,.6)}
html.bc h2 .btn.arrange{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2)}
html.bc .btn.fight{background:linear-gradient(180deg,#ff5a4a,#d8352a);color:#fff;border:0;box-shadow:0 4px 0 #8a1f18,0 0 18px rgba(255,90,74,.35)}
html.bc .btn.fight.boss{background:linear-gradient(180deg,#ff5a4a,#d8352a);color:#fff}
html.bc .btn.fight[disabled]{background:rgba(255,255,255,.12);color:var(--muted);box-shadow:none}

/* scoreboard */
html.bc .topbar.gb{background:linear-gradient(90deg,var(--navy),var(--navy2));border:0;border-radius:8px;box-shadow:0 4px 0 rgba(0,0,0,.35);border-bottom:3px solid var(--gold);padding:6px 6px 6px 12px;position:relative}
html.bc .topbar.gb .stat.credits,html.bc .topbar.gb .stat.credits .lbl{color:var(--gold)}
html.bc .topbar.gb .stat.credits{font-size:26px}
html.bc .tcol .stat .lbl,html.bc .stat.next{color:var(--muted)}
html.bc .stat.turn{color:#fff}
html.bc .iconbtn.start{background:var(--gold);color:var(--navy);border-radius:6px;align-self:stretch;display:flex;align-items:center}
html.bc .stat.streak.win{color:var(--gold)}

/* the dock: the next trainer and BATTLE, floating at the bottom */
html.bc .dock{background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.22) 30%)}
html.bc .speech .who{border:0;border-radius:8px;background:linear-gradient(180deg,#2c376a 0 52%,#3f8f45 52%)}
html.bc .speech .ssub,html.bc .speech .nstage{color:var(--muted)}
html.bc .speech .road i:not(.bdg){border-color:rgba(255,255,255,.5)}
html.bc .speech .road i.done{background:rgba(255,255,255,.75)}
html.bc .speech .road i.now{background:#ff5a4a;border-color:#ffb0a8}

/* Daycare and Mart rows: glass with a gold edge */
html.bc .drow,html.bc .martrow{background:rgba(255,255,255,.07);border:0;border-left:4px solid var(--gold);border-radius:6px;color:var(--text)}
html.bc .drow{background:linear-gradient(90deg,color-mix(in srgb,var(--c,#888) 22%,transparent),rgba(255,255,255,.05) 60%)}
html.bc .drow.sel,html.bc .martrow.sel{box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(255,210,58,.35)}
html.bc .drow.locked,html.bc .drow.out,html.bc .martrow.out{opacity:.55;border-left-color:rgba(255,255,255,.25)}
html.bc .dprice,html.bc .mprice{color:var(--gold)}
html.bc .martrow .mtext span,html.bc .dsub{color:var(--muted)}
html.bc .mhead{color:var(--gold)}
/* PC and Bag */
html.bc .wall{background:rgba(255,255,255,.06);background-image:none;border:0;border-radius:8px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12)}
html.bc .bagwall,html.bc .bag{background:rgba(255,255,255,.06);background-image:none;border:0;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12)}
html.bc .cell{background:rgba(255,255,255,.05)}
html.bc .cell.empty::before{opacity:.25}

/* the inspector (message box) and the log */
html.bc #inspect,html.bc #blog{color:var(--text)}
html.bc .queue .qmon{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25)}
html.bc .queue .qlbl{color:var(--muted)}

/* ---- 5.0.0 · the camera between the shop and the stadium ---- */
body.cam{overflow-x:hidden}
body.cam .panel.arena,body.cam .stagewrap,body.cam #stageslot{overflow:visible!important}
body.cam .panel.arena{z-index:5;position:relative}
body.cam :is(#app > *,.bosstag,.award,.gnote,.stagewrap > .ribbon){transition:opacity .45s ease,transform .45s cubic-bezier(.2,.8,.3,1),background-color .45s,box-shadow .45s}
body.cam .bstage :is(.ground,.slotmark.e,.introban){transition:opacity .55s ease}
body.cam-hide :is(#app > :not(.panel.arena):not(.topbar),.bosstag,.award,.gnote,.stagewrap > .ribbon){opacity:0;transform:translateY(30px)}
body.cam-hide #app > .topbar{opacity:0;transform:translateY(-30px)}
body.cam-hide .panel.arena{background:transparent!important;box-shadow:none!important}
body.cam-hide .bstage .ground,body.cam-hide .bstage .slotmark.e{opacity:0}
body.cam-foe .bstage .ftr.e{opacity:0;transition:opacity .3s}

/* 5.0.0: every pop-up is the solid glass, whatever its own panel colour */
html.bc .modal .box{background:var(--glass2)!important}

/* 5.0.0: the title screen stands on the same pitch, under the stadium lights */
html.bc .title{background:radial-gradient(90% 45% at 50% 0%,rgba(255,250,220,.35),transparent 70%),radial-gradient(130% 70% at 50% 0%,rgba(0,0,0,0),rgba(0,0,0,.3)),repeating-linear-gradient(0deg,#3a8840 0 34px,#43974a 34px 68px)}
html.bc.dark .title{background:radial-gradient(90% 45% at 50% 0%,rgba(200,220,255,.22),transparent 70%),radial-gradient(130% 70% at 50% 0%,rgba(0,0,0,.1),rgba(0,0,0,.55)),repeating-linear-gradient(0deg,#2c6a32 0 34px,#337838 34px 68px)}
html.bc .tlogo .t2{color:var(--gold);text-shadow:0 4px 0 #11182c,3px 0 0 #11182c,-3px 0 0 #11182c,0 -3px 0 #11182c,0 8px 14px rgba(0,0,0,.45)}
html.bc .tlogo .t1{color:#fff;text-shadow:0 2px 0 #11182c,2px 0 0 #11182c,-2px 0 0 #11182c,0 -2px 0 #11182c}

/* ---- 5.0.0 · THE WORLD: one stadium behind the game, every screen layered over it ----
   #world holds the field (.wcam > .bstage) in the battle's box; the camera is .wcam's transform.
   Shop: close in on your half, the party's flat slots placed over the field's marks (JS).
   Battle: the camera pulled back; the page's own field box (#stageslot) is just an empty spacer. */
body{position:relative}
.bcwrap,.bcL,.bcR{display:contents}
#world{position:absolute;left:0;right:0;top:0;height:100vh;overflow:hidden;z-index:0;pointer-events:none}
#world[hidden]{display:none}
#world.wide{position:fixed;inset:0;height:auto!important}
#world .wcam{position:absolute;transform-origin:0 0;pointer-events:auto}
#world .bstage{width:100%!important;height:100%!important;aspect-ratio:auto!important;min-height:0!important;max-height:none!important;border:0;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
#world .bstage .ground,#world .bstage .slotmark{transition:opacity .6s ease}
#world.shopview .bstage .ground,#world.shopview .bstage .slotmark{opacity:0}
#world.shopview .bstage{box-shadow:none}
body.inworld #app{position:relative;z-index:1;overflow-x:clip}
/* the page's see-through parts let taps fall through to the field (a fighter's card in battle) */
body.inworld :where(#app *){pointer-events:auto}
body.inworld :is(#app,.bcwrap,.bcL,.bcR,.panel.party,.pfield,.pfield .formation,.panel.arena,.stagewrap,#stageslot,.arenanotes){pointer-events:none}
html.bc #app > .topbar.gb{height:54px;box-sizing:border-box;flex:none}

/* --- the party on the field --- */
html.bc .panel.party{background:transparent!important;box-shadow:none!important;padding:0;container-type:inline-size}
html.bc .panel.party > h2{padding:0 2px}
html.bc .panel.party > h2 .sub{color:#eef3ff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
html.bc .pfield,html.bc.dark .pfield{background:none;border:0;box-shadow:none;padding:0;margin:0;max-width:none}
html.bc .pfield .rankhead{display:none}
html.bc .pfield .formation{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:0;height:calc(var(--sbH,520px) * .6);min-height:220px}
@container (max-width:620px){ html.bc .pfield .formation{grid-template-columns:1fr 1fr} }
html.bc .pfield .slot{position:absolute;min-height:0!important;padding:0;margin:0;transform:none!important;background:none;border:0;box-shadow:none;display:block;z-index:1}
html.bc .pfield .slot.pr1{z-index:2}html.bc .pfield .slot.pr2{z-index:3}
html.bc .pfield .slot .unit{position:absolute;inset:0;display:block;padding:0;background:none;border:0;box-shadow:none;transform:none}
html.bc .pfield .slot:hover .unit{transform:translateY(-2px)}
html.bc .pfield .artwrap{position:absolute;left:50%;bottom:var(--ab,13%);transform:translateX(-50%);margin:0}
html.bc .pfield .sprite.img{width:var(--sp,64px);height:var(--sp,64px)}
html.bc .pfield .slot .stats{position:absolute;left:-10%;right:-10%;white-space:nowrap;bottom:calc(var(--ab,13%) + var(--sp,64px) + 14px);margin:0;gap:5px;justify-content:center;font-size:12px;
  text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000}
html.bc .pfield .slot .stats.spd{bottom:calc(var(--ab,13%) + var(--sp,64px) + 1px);font-size:11px}
html.bc .pfield .stats .a{color:#ffb19c}html.bc .pfield .stats .h{color:#9ff0b4}html.bc .pfield .stats .s{color:#a9d4ff}
html.bc .pfield .slot .lvl{position:absolute;left:auto;right:calc(50% + var(--sp,64px) * .42);top:auto;bottom:calc(var(--ab,13%) + var(--sp,64px) * .7);background:rgba(12,18,34,.85);color:var(--gold);border:0;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
html.bc .pfield .slot .exp{position:absolute;left:0;right:0;bottom:-7px;margin:0}
html.bc .pfield .exp i{background:rgba(0,0,0,.35)} html.bc .pfield .exp i.on{background:var(--gold)}
html.bc .pfield .slot .hpbar{position:absolute;left:25%;right:25%;bottom:calc(var(--ab,13%) + var(--sp,64px) + 29px);margin:0}
html.bc .pfield .slot .ko{position:absolute;left:0;right:0;bottom:calc(var(--ab,13%) + var(--sp,64px) + 28px);margin:0;text-align:center}
html.bc .pfield .slot .boosted,html.bc .pfield .slot .twin{bottom:calc(var(--ab,13%) + var(--sp,64px) * .7);top:auto}
html.bc .pfield .artwrap::after{background:radial-gradient(closest-side,rgba(0,0,0,.35),transparent);box-shadow:none}
html.bc .pfield .slot.selected .artwrap::after{background:radial-gradient(closest-side,#ffe680,rgba(255,210,58,.35) 70%,transparent);box-shadow:0 0 12px rgba(255,210,58,.6)}
html.bc .pfield .slot.mergeable .artwrap::after{background:radial-gradient(closest-side,#ffd23a,rgba(255,210,58,.3) 70%,transparent);box-shadow:0 0 0 2px var(--gold)}
html.bc .pfield .slot.valid:not(.empty) .artwrap::after{background:radial-gradient(closest-side,#9fe0ae,rgba(95,184,119,.3) 70%,transparent);box-shadow:none}
html.bc .pfield .slot.empty::after{bottom:6%;left:50%;right:auto;width:min(80%,calc(var(--sp,64px) * 1.1));transform:translateX(-50%);height:min(22%,22px);border:2px dashed rgba(255,255,255,.45)}
html.bc .pfield .slot.empty.valid::after{border-style:solid;border-color:#9fe0ae;background:rgba(95,184,119,.25)}
html.bc .pfield .sprite.img img{filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
html.bc .shopq{background:var(--glass)}
body.cam-going .pfield .slot{opacity:0;transition:opacity .18s}

/* --- battle: the field box in the page is a spacer; the notes and the ribbon float over the field --- */
html.bc body[data-phase=battle] .panel.arena{position:relative;padding:0;background:none!important;box-shadow:none!important;border:0;flex:none!important;display:block!important}
html.bc body[data-phase=battle] .stagewrap{flex:none!important;display:block!important}
html.bc body[data-phase=battle] #stageslot{height:var(--sbH,520px);display:block!important;flex:none!important}
html.bc .arenanotes{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:6;width:min(94%,560px);display:flex;flex-direction:column;gap:6px}
html.bc .arenanotes > *{margin:0}
html.bc .arenanotes .award,html.bc .arenanotes .gnote{background:var(--glass2);border-radius:10px;box-shadow:0 0 0 2px rgba(255,210,58,.5),0 8px 20px rgba(0,0,0,.4);padding:8px 12px}
html.bc .panel.arena > .bosstag{position:absolute;left:10px;top:10px;z-index:6;margin:0;background:var(--glass);border-radius:8px;padding:4px 10px}

/* --- wide screens (computer, phone on its side): the page doesn't scroll, everything floats on the stadium --- */
@media (min-width:1000px),(orientation:landscape) and (max-height:520px) and (min-width:640px){
  body.inworld[data-phase=shop]{overflow:hidden}
  body[data-phase=shop] #app{max-width:none;height:100vh;height:100dvh;box-sizing:border-box;padding:8px 16px 12px;display:flex;flex-direction:column;gap:10px}
  body[data-phase=shop] .bcwrap{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(330px,36vw,480px);gap:14px}
  body[data-phase=shop] .bcL{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
  body[data-phase=shop] .panel.party{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:space-between}
  body[data-phase=shop] .panel.party > h2{align-self:flex-start}
  html.bc body[data-phase=shop] .pfield{flex:1 1 auto;min-height:0}
  html.bc body[data-phase=shop] .pfield .formation{height:100%;min-height:0}
  body[data-phase=shop] .panel.party .shopq{align-self:flex-start;margin:0}
  body[data-phase=shop] .bcL > #inspect{flex:none;max-height:96px;overflow:auto}
  body[data-phase=shop] .bcR{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
  body[data-phase=shop] .bcR .shelves{grid-template-columns:1fr;overflow-y:auto;overscroll-behavior:contain;flex:1 1 auto;min-height:0;padding-right:4px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}
  body[data-phase=shop] .bcR .dock{position:static;margin:0;padding:0;background:none;flex-direction:column;display:flex}
  body[data-phase=shop] .bcR .dock .speech{margin:0}
  body[data-phase=shop] .bcR .dock .btn.fight{min-height:52px;font-size:20px;letter-spacing:2px}
  body[data-phase=shop] .bcR .martlist,body[data-phase=shop] .bcR .dclist{max-height:none}
  body[data-phase=shop] #app > .vtag{position:absolute;right:10px;bottom:0;opacity:.55;margin:0}
  /* battle: the whole stadium, with the turn order, commentary and controls as a strip along the bottom */
  body[data-phase=battle] #app{max-width:none;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;grid-auto-flow:row dense;column-gap:10px;row-gap:10px;align-content:start;padding:8px 16px 10px}
  body[data-phase=battle] #app > *{grid-column:1 / -1;min-width:0}
  html.bc body[data-phase=battle] #app > .panel.arena{justify-self:center;width:var(--sbW,800px)}
  body[data-phase=battle] #app > #bqueue{grid-column:1;align-self:start}
  body[data-phase=battle] #app > #bqueue .queue{height:92px;box-sizing:border-box;margin:0;align-content:center}
  body[data-phase=battle] #app > .blogbox{grid-column:2}
  body[data-phase=battle] #app > .blogbox #blog{height:66px;max-height:66px}
  body[data-phase=battle] #app > .shopbar{grid-column:3;flex-direction:column;justify-content:center;align-items:stretch;gap:6px;margin:0;min-width:200px}
  body[data-phase=battle] #app > .shopbar > *{justify-content:center}
}
@media (orientation:landscape) and (max-height:520px) and (min-width:640px){
  body[data-phase=shop] #app{padding:6px 12px 8px;gap:6px}
  body[data-phase=shop] .panel.party > h2 .sub{display:none}
  body[data-phase=shop] .bcwrap{grid-template-columns:minmax(0,1fr) minmax(290px,40vw);gap:10px}
  body[data-phase=shop] .bcL > #inspect{max-height:42px;min-height:0;font-size:12.5px;padding:4px 10px;line-height:1.3}
  body[data-phase=shop] .bcL > #inspect *{min-height:0}
  html.bc body[data-phase=shop] .pfield .slot .stats{font-size:10px;gap:3px}
  html.bc body[data-phase=shop] .pfield .slot .stats.spd{font-size:9.5px}
  body[data-phase=shop] .bcR .dock .speech .say b{font-size:15px;line-height:1.15}
  body[data-phase=shop] .bcR .dock .speech .who{transform:scale(.8)}
  body[data-phase=shop] .bcR .dock .btn.fight{min-height:42px;font-size:17px}
  body[data-phase=shop] .panel.party{position:relative}
  body[data-phase=shop] .panel.party > h2{position:absolute;left:0;top:0;z-index:4;margin:0}
  html.bc body[data-phase=shop] .pfield .formation{margin-top:22px;height:calc(100% - 22px)}
  body[data-phase=shop] .panel.party .shopq{display:none}
  body[data-phase=battle] #app{padding:6px 12px 6px;row-gap:6px}
  body[data-phase=battle] #app > #bqueue .queue{height:58px;padding-block:4px}
  body[data-phase=battle] #app > #bqueue .queue .qmon{width:32px;height:32px}
  body[data-phase=battle] #app > .blogbox #blog{height:40px;max-height:40px;font-size:12.5px}
  body[data-phase=battle] #app > .shopbar{flex-direction:row;flex-wrap:wrap;min-width:0;gap:4px}
  body[data-phase=battle] #app > .shopbar .btn{min-height:30px;padding:2px 10px}
}

/* ---- 5.0.0 · the boss walk-out ---- */
.walkout{position:absolute;z-index:25;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.walkout .wbody{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 4px 0 rgba(0,0,0,.3))}
.walkout img{width:100%;height:100%;object-fit:contain;object-position:bottom;image-rendering:pixelated}
.walkout .wname{position:absolute;top:100%;margin-top:4px;white-space:nowrap;font-size:clamp(11px,2.2cqw,16px);color:#fff;background:var(--navy,#11182c);padding:1px 10px;border-radius:6px;box-shadow:0 0 0 2px var(--gold,#ffd23a)}
.walkout .wspot{position:absolute;bottom:-6%;left:-10%;right:-10%;height:22%;border-radius:50%;z-index:-1;background:radial-gradient(closest-side,rgba(255,250,200,.65),rgba(255,230,120,.2) 70%,transparent)}
.walkout.elite .wname{box-shadow:0 0 0 2px #a98bff}.walkout.champion .wname{box-shadow:0 0 0 2px #ff9d6e}.walkout.rival .wname{box-shadow:0 0 0 2px #7fc4ff}
.wball2{position:absolute;width:16px;height:16px;border-radius:50%;z-index:26;pointer-events:none;background:linear-gradient(#e0473f 0 44%,#222 44% 56%,#f4f1e6 56%);box-shadow:0 0 0 2px #22262f}
.wflash{position:absolute;border-radius:50%;z-index:24;pointer-events:none;background:radial-gradient(closest-side,#fff,rgba(255,255,255,.6) 50%,transparent)}

/* ---- 5.2.0 · fainted pokémon lose their name plate; no shadows waiting on empty spots; boss lines and the badge ceremony ---- */
.bstage.board.stadium .ftr.down .fhead{display:none}
.bstage.board .ftr.incoming::before,.bstage.board .ftr.incoming .fshadow{opacity:0!important;transition:none}
.bstage.board .ftr::before{transition:opacity .3s ease}
.walkout .wsay{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:min(240px,46cqw);z-index:3;
  background:#fff;color:#1d2230;font-size:clamp(11px,1.6cqw,14px);line-height:1.25;padding:6px 10px;border-radius:10px;box-shadow:0 0 0 2px var(--navy,#11182c),0 6px 14px rgba(0,0,0,.35);text-align:center}
.walkout .wsay::after{content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fff;filter:drop-shadow(0 2px 0 var(--navy,#11182c))}
.bstage.vert .walkout .wsay{max-width:62cqw;font-size:max(11px,3.2cqw)}
.walkout .wbadge{position:absolute;left:50%;bottom:calc(100% + 34px);width:42px;height:42px;display:grid;place-items:center;z-index:4}
.walkout .wbadge .bdg,.walkout .wbadge > span,.walkout .wbadge > i:first-child{transform:scale(1.6)}
.walkout .wbadge .wglow{position:absolute;inset:-60%;z-index:-1;border-radius:50%;background:radial-gradient(closest-side,rgba(255,230,120,.9),rgba(255,210,58,.35) 55%,transparent);animation:wglow 1s ease-in-out infinite alternate}
@keyframes wglow{from{opacity:.6;transform:scale(.9)}to{opacity:1;transform:scale(1.1)}}
.wflash.gold{background:radial-gradient(closest-side,#fff6c0,rgba(255,210,58,.7) 50%,transparent)}
html.bc body[data-phase=battle] .stagewrap .big.ribbon{top:17%;transform:translateY(-50%)}
@media (max-width:700px){
  html.bc .arenanotes .bossart{display:none}
  html.bc .arenanotes .award,html.bc .arenanotes .gnote{padding:6px 10px;font-size:13px}
  html.bc .arenanotes .award .dim{display:none}
}
/* 5.2.1: no outlines on the battle field's empty spots */
#world:not(.shopview) .bstage .slotmark,#world:not(.shopview) .bstage .slotmark::before{border-color:transparent!important;background:none!important;box-shadow:none!important}
